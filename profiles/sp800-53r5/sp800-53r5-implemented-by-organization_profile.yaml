  metadata:
    title: "NIST SP 800-53 Rev 5: Controls Implemented by an Organization"
    last-modified: 2026-11-13T00:00:00Z
    version: "0.1.0"
    oscal-version: 1.2.3

    roles:
      - id: creator
        title: Document Creator
        description: >-
          The Oxide team responsible for authoring and maintaining this OSCAL
          profile.
      - id: contact
        title: Point of Contact
        description: >-
          The Oxide team to contact with questions about the content of this
          OSCAL profile.

    parties:
      - uuid: 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
        type: organization
        name: Oxide Computer Company
        short-name: Oxide
        links:
          - href: https://oxide.computer
            rel: website
      - uuid: a182ded0-c5b0-4f37-b476-02b391327ce7
        type: organization
        name: Oxide Computer Company Security Team
        email-addresses:
          - security@oxidecomputer.com
        member-of-organizations:
          - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e

    responsible-parties:
      - role-id: creator
        party-uuids:
          - a182ded0-c5b0-4f37-b476-02b391327ce7
      - role-id: contact
        party-uuids:
          - a182ded0-c5b0-4f37-b476-02b391327ce7

    remarks: >-
      This profile selects controls from NIST SP 800-53 Rev 5 that are
      classified as implemented by an organization according to the NIST control
      summary information identifying whether each control is implemented by an
      organization, an information system, or both (the published NIST OSCAL
      catalog does not carry this classification as a property; Oxide maintains
      it in this profile). Per the design intent, this includes both controls
      classified as organization-only and controls classified as implemented by
      both the organization and the information system.

      This profile has a companion profile, `sp800-53r5-implemented-by-system`,
      that captures the symmetric selection. The two profiles overlap on
      controls classified as implemented by both parties; the union of their
      resolved control selections equals the set of non-withdrawn controls in
      the catalog.

      Withdrawn controls are excluded from both profiles.

      This profile is a control-selection artifact, not a security baseline. It
      is intended to be intersected with security baselines (FedRAMP High, CNSSI
      1253, etc.) by external tooling to identify the controls an organization
      is responsible for addressing in policy and procedure.

