        email-addresses:
          - security@oxidecomputer.com
        member-of-organizations:
          - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e

    responsible-parties:
      - role-id: creator
        party-uuids:
          - a182ded0-c5b0-4f37-b476-02b391327ce7
      - role-id: contact
        party-uuids:
          - a182ded0-c5b0-4f37-b476-02b391327ce7

    remarks: >-
      This profile selects controls from NIST SP 800-53 Rev 5 that are
      classified as implemented by an information system according to the NIST
      control summary information identifying whether each control is
      implemented by an organization, an information system, or both (the
      published NIST OSCAL catalog does not carry this classification as a
      property; Oxide maintains it in this profile). Per the design intent, this
      includes both controls classified as system-only and controls classified
      as implemented by both the information system and the organization.

      This profile has a companion profile,
      `sp800-53r5-implemented-by-organization`, that captures the symmetric
      selection. The two profiles overlap on controls classified as implemented
      by both parties; the union of their resolved control selections equals the
      set of non-withdrawn controls in the catalog.

      Withdrawn controls are excluded from both profiles.

      This profile is a control-selection artifact, not a security baseline. It
      is intended to be intersected with security baselines (FedRAMP High, CNSSI
      1253, etc.) by external tooling to identify the controls a system-level
      component is responsible for addressing.

