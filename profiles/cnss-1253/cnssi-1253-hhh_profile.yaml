    remarks: >-
      This profile is a non-authoritative OSCAL transcription of the CNSSI
      No. 1253 H-H-H (High Confidentiality, High Integrity, High Availability)
      NSS baseline. The canonical source of truth is the CNSS-published PDF
      referenced in back-matter. The Classified System Overlay (CNSSI 1253E5)
      is not applied in this profile; see the companion overlay profile.

      This profile carries the control selection only. The NSS-specific
      parameter values in Appendix D are not transcribed; take them from
      the published document.

