  # edition). Where Appendix D specifies a value that differs from the SP
  # 800-53B default or narrows an organization-defined parameter, record it
  # as a set-parameter below.
  # --------------------------------------------------------------------------
  # modify:
  #   set-parameters:
  #     # ====================================================================
  #     # TRANSCRIPTION TODO - populate from CNSSI 1253 Appendix D parameter
  #     # columns. The two entries below are illustrative placeholders showing
  #     # the expected shape; replace with real Appendix D values.
  #     # ====================================================================

  #     # Illustrative: AC-2(3) - time period for disabling inactive accounts
  #     - param-id: ac-02.03_odp.01
  #       values:
  #         - "REPLACE_WITH_APPENDIX_D_VALUE"
  #       remarks: >-
  #         Replace the value above with the parameter value specified in
  #         CNSSI 1253 Appendix D, Table D-1, for AC-2(3) at the H-H-H column.

  #     # Illustrative: AU-11 - audit record retention period
  #     - param-id: au-11_odp
  #       values:
  #         - "REPLACE_WITH_APPENDIX_D_VALUE"
  #       remarks: >-
  #         Replace the value above with the parameter value specified in
  #         CNSSI 1253 Appendix D, Table D-3, for AU-11 at the H-H-H column.

  #   # If CNSSI 1253 Appendix D adds control enhancements or supplemental
  #   # guidance beyond what SP 800-53B specifies at the High level, express
  #   # them as `alters` entries below. Most of the NSS baseline is control
  #   # selection plus parameter overrides, so `alters` is typically sparse.
  #   # alters:
  #   #   - control-id: <control-id>
  #   #     adds:
  #   #       - by-id: <enhancement-id>
  #   #         props: [...]

