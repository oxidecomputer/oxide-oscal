# ============================================================================
# CNSSI No. 1253: NSS Baseline H-H-H
# OSCAL Profile (non-authoritative transcription)
# ----------------------------------------------------------------------------
# Source document:   CNSSI No. 1253, "Categorization and Control Selection for
#                    National Security Systems", 29 July 2022
#                    https://www.cnss.gov/  (canonical host)
#                    This profile transcribes the control selection in the
#                    H-H-H column of Appendix D (Tables D-1 through D-20).
#                    The Appendix D NSS parameter values are NOT yet
#                    transcribed (see the commented-out `modify` section).
# Authority note:    CNSS has not published an official OSCAL profile for
#                    CNSSI 1253. This file is a transcription
#                    authored by Oxide Computer Company for use in its OSCAL
#                    component definition. It is NOT a substitute for the
#                    canonical CNSSI document. Discrepancies are resolved in
#                    favor of the CNSS-published PDF.
# Underlying catalog: NIST SP 800-53 Rev 5 (per CNSSI 1253 Section 1.1)
# ============================================================================

