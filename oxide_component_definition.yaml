            - uuid: a311ceea-edbf-4d51-a7e1-19d2f47eb8ac
              control-id: sc-10
              description: >-
                The Oxide Cloud Computer ends web console sessions after 8 hours
                of inactivity or 24 hours in total, after which the user must
                authenticate again. These values are fixed; there is no setting
                to change them. This narrative describes termination of sessions
                and credentials; it makes no statement about when the underlying
                network connection is closed.

                Device access tokens, which the CLI and SDKs use to authenticate
                each request, do not expire by default and have no inactivity
                timeout. A silo administrator can set a maximum token lifetime,
                which applies only to tokens created afterwards.

                A user can end the current session, delete a single device
                token, and invalidate all of their own sessions and tokens at
                once. A silo administrator can invalidate all sessions and
                tokens of any user in the silo, but cannot revoke one console
                session on its own.
