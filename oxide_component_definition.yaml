            - uuid: f1ea4b9c-3595-462c-bfee-473d3493907a
              control-id: si-4.16
              description: >-
                The Oxide Cloud Computer does not correlate its monitoring
                sources. The audit log and metrics telemetry (see SI-4) are
                both available through the API, and each audit entry carries
                the actor, source address, time, and a request identifier that
                customer tooling can use in correlation. Read requests and
                technician port activity other than API requests are not
                recorded in the audit log, so they cannot be correlated from
                it.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
                - href: "#b66735eb-7655-4511-adf0-84616eb41209"
                  text: "Oxide Docs: Metrics OxQL Tutorial"
                  rel: reference
              remarks: >-
                The customer is responsible for ingesting both sources into a
                SIEM or correlation engine and configuring cross-source rules.
                Because technician port activity other than API requests is not
                in the audit log, the customer is responsible for correlating
                its own facility and jumpbox access records.
            - uuid: 7c148552-8df4-4d76-b5d3-1df05e106293
              control-id: si-4.18
              description: >-
                The Oxide Cloud Computer does not analyze outbound traffic for
                covert exfiltration. Metrics telemetry (see SI-4) is available
                through the API, but the component does not analyze it for
                exfiltration indicators.

                Customers can use VPC subnet routing to direct guest egress
                traffic through a customer-operated inspection appliance,
                deployed as a guest workload, before it leaves for external
                networks. This provides an interior point at which the customer
                can inspect outbound flows. Monitoring at the external boundary
                of the rack (the physical uplinks to the customer's facility
                network) is outside the component and is done in the customer's
                upstream network.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#b66735eb-7655-4511-adf0-84616eb41209"
                  text: "Oxide Docs: Metrics OxQL Tutorial"
                  rel: reference
                - href: "#cd1ca6d1-fa72-4ed1-9fda-9b9766906355"
                  text: "Oxide Docs: VPC Subnet Routing"
                  rel: reference
              remarks: >-
                The customer is responsible for consuming metrics into its
                analysis tooling, defining exfiltration thresholds and
                baselines, and deploying and operating any inspection appliance
                placed in line through VPC subnet routing. Each instance
                network interface's firewall allows outbound traffic by
                default; the customer is responsible for restricting egress
                where required. The customer is also responsible for all
                monitoring at the external rack boundary.
            - uuid: 7f6759e4-31cf-400d-b4b1-cde56c5de400
              control-id: si-4.19
              description: >-
                The Oxide Cloud Computer does not implement differential
                monitoring levels for individual users; there is no mechanism
                to apply heightened monitoring to accounts identified as higher
                risk. The audit log records authenticated, state-changing
                requests to the external API, and login attempts, on the same
                terms for every caller. Read requests are not recorded for any
                user, so a user's read activity cannot be observed through the
                audit log. Entries for authenticated requests identify the
                acting user, so customers can filter and analyze the activity
                of specific accounts in their own tooling; the rack itself
                filters only by time range. Login attempt entries identify
                neither the user nor the session created.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
              remarks: >-
                The customer is responsible for identifying individuals who
                pose an increased level of risk and for implementing enhanced
                monitoring of them using the audit log as the data source. This
                includes fetching audit records and filtering them by user
                identity in customer tooling, configuring alerts on activity
                from flagged accounts, and establishing procedures for
                escalated review.
            - uuid: 0bdb8c49-d528-48af-a120-60f3f060a7ca
              control-id: si-4.20
              description: >-
                The Oxide Cloud Computer does not implement additional
                monitoring of privileged users. The audit log records
                authenticated, state-changing requests to the external API by
                fleet and silo administrators on the same terms as those by
                other users. Privileged operations such as role and policy
                changes, silo configuration changes, identity provider and
                local user management, and update operations are recorded.
                There is no resource identifier field and no request body, so
                the content of a change is not recorded, and read requests are
                not recorded for any role.

                Privileged activity at the technician ports is not recorded in
                the audit log, apart from API requests made through them. This
                covers use of the setup and recovery interface, which requires
                no credential and can power-control and update rack components,
                use of the Oxide support shell, and unlocking of the management
                network (see AC-17).
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
              remarks: >-
                The customer is responsible for implementing additional
                monitoring of privileged accounts by filtering audit records by
                fleet admin and silo admin identities in its SIEM, configuring
                alert rules specific to privileged operations, and establishing
                review cadences for privileged account activity. The customer
                is responsible for controlling physical access to the
                technician ports and network access to any jumpbox or other
                host cabled to them, for granting and terminating access for
                each Oxide support session, and for keeping its own record of
                that access.
            - uuid: 494279ae-0a4a-47e3-a687-eaaaa8e15710
              control-id: si-4.22
              description: >-
                The Oxide Cloud Computer does not scan for network services
                running inside guest VMs or detect new listening ports. It
                limits the exposure of such services: every instance network
                interface has a firewall, enforced in the host OS outside the
                guest, that denies inbound traffic by default, so a service in
                a VM is reachable only where a VPC firewall rule allows it. A
                new VPC starts with rules that allow inbound traffic from
                within the VPC, and SSH and ICMP from any source.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#b557fdcb-ae3c-41e4-8cd4-e849a911017d"
                  text: Configuring Guest Networking
                  rel: reference
              remarks: >-
                The customer is responsible for maintaining an inventory of
                authorized network services, reviewing VPC firewall rules
                (including the default rules, which admit SSH and ICMP from any
