                - href: https://docs.oxide.computer/guides/architecture/networking#_integration_with_on_premises_domain_name_service
                  text: Integration with On-premises Domain Name Service
                  rel: reference
              remarks: >-
                Because the rack does not sign the records it serves, signing
                the customer's parent zone does not extend DNSSEC to them. A
                customer whose policy requires origin authentication for these
                names must document in the SSP how it addresses the gap, and is
                responsible for provisioning and maintaining the TLS certificates
                for silo endpoints, which are the means of authenticating those
                endpoints in this deployment.
            - uuid: 3e958c98-91e3-407f-a69c-1e72ec6928af
              control-id: sc-21
              description: >-
                The Oxide Cloud Computer does not provide a recursive or caching
                DNS resolver. Its DNS service is authoritative only, for the
                domain the customer delegates to the rack, so it does not
                request name resolution data from authoritative sources on
                behalf of clients and this control does not apply to the
                component.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: not-applicable
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: https://docs.oxide.computer/guides/system/network-preparations#_data_network
                  text: Data Network
                  rel: reference
              remarks: >-
                Guest instances use the DNS resolvers the customer names for the
                rack. The customer is responsible for ensuring those resolvers
                perform data origin authentication and integrity verification if
                its policy requires this control.
            - uuid: 48939c0e-35e2-4ab0-a51d-c774d36c25cb
              control-id: sc-22
              description: >-
                The control plane runs the authoritative DNS service for the
                domain the customer delegates to the rack. Oxide Computer
                Company states that this service runs as multiple replicas on
                different sleds. The service is authoritative only: the rack
                provides no recursive or caching resolver, and recursive
                resolution for the rack and for guest instances is done by DNS
                servers the customer operates and names at rack setup. The two
                roles are not combined in the component.
