                  rel: reference
            - uuid: b2d528d5-6598-4e80-bdf7-9d100eee13fb
              control-id: sc-23.5
              description: >-
                TLS certificates for the external API and web console are
                supplied only by the customer, at rack setup and afterwards
                through the API. No default certificate ships with the
                component, and rack setup cannot proceed without a
                customer-supplied one. The component does not restrict uploaded
                certificates to a customer-defined list of certificate
                authorities; the customer controls the issuing authority through
                its choice of certificate.

                Where the control plane acts as a TLS client, for HTTPS webhook
                receivers and SAML metadata URLs, it validates the server
                against a root certificate set shipped in the system release,
                not a set the customer defines. Mutually authenticated
                connections between sleds accept only certificate chains that
                verify to a root certificate configured on the sleds.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#1cda6846-b7f7-48e1-a859-34186be19d4b"
                  text: "Oxide API: certificate_create"
                  rel: reference
                - href: https://docs.oxide.computer/guides/system/rack-installation#prerequisites
                  text: "Oxide Docs: Rack Installation (Prerequisites)"
                  rel: reference
                - href: https://docs.oxide.computer/release-notes/system/23
                  text: Oxide System Release 23 Release Notes
                  rel: reference
              remarks: >-
                The customer is responsible for defining its allowed certificate
                authorities, obtaining certificates only from them, and
                uploading those certificates. The SSP should document the
                allowed list and should account for the release-supplied root
                certificate set when choosing webhook receivers and SAML
                metadata URLs.
            - uuid: 8c765a9a-cfda-41a6-8c5b-475a77ea4873
              control-id: sc-24
              description: >-
                The Oxide Cloud Computer fails to a defined state in these
                cases. A root of trust firmware image that fails signature
                verification is not booted; if neither stored image passes, the
                root of trust does not boot (see SI-7). A sled that cannot
                obtain the threshold of key shares from its peers cannot decrypt
                its control plane storage, starts no control plane services, and
                does not join the underlay network; peers give no shares to a
                sled that fails attestation or is not a member of the rack (see
                SC-28). A faulting firmware task on a service processor or root
                of trust is stopped and restarted while other tasks keep
                running. Each switch locks direct access from its technician
                ports to the management network whenever its service processor
                starts, and an unlock is time-limited (see AC-17). A
                distributed-disk block that fails authentication on read is not
                returned. An audit log entry is created before an audited
                operation runs; if it cannot be created, the request fails.

                Limitations. Service processor firmware does not fail closed: it
                is measured, but nothing prevents it from booting, and if
                measurement fails it boots unmeasured; a missing or unexpected
                measurement has effect only when a peer sled appraises it (see
                SI-7). Verification or measurement of the host operating system
                at boot is not established. The technician port lock does not
                gate the setup and recovery interface, which requires no
                credential. The API has no operation to abort, pause, or roll
                back a system update; recovery from a failed update is
                forward-only, through an offline update performed by Oxide
                Support.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: https://github.com/oxidecomputer/bootleby
                  text: "bootleby: Oxide RoT bootloader (source)"
                  rel: reference
                - href: "#d997e812-b360-4598-8df7-b892b5133273"
                  text: "Hubris: Oxide service processor firmware"
                  rel: reference
                - href: "#a3cf381f-9d9c-434e-a49d-e38651e5e9ea"
                  text: "RFD 238: Trust Quorum"
                  rel: reference
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
                - href: "#eeb24ebd-edc5-47ec-8545-4272f16bbfc9"
                  text: "Oxide Docs: System Update"
                  rel: reference
              remarks: >-
                The customer is responsible for defining the failure types and
                the state information to be preserved that its policy requires,
                for engaging Oxide Support when a system update fails to
                complete, and for documenting these behaviors and their limits
                in the system SSP.
            - uuid: 38480e8a-853c-4410-b72a-90102442677b
              control-id: sc-28
              description: >-
                The Oxide Cloud Computer protects information at rest with two
                mechanisms that cover different data; local disks and the M.2
                boot drives are covered by neither (key custody in general: see
                SC-12).

                Distributed disks are always encrypted, and encryption cannot be
                disabled. Each block is encrypted on the sled where the instance
                runs, so the replica sleds store ciphertext, with block and
                region metadata in plaintext. The control plane generates each
                disk's key and stores it in its database, not wrapped by any
                other key; at rest the key is protected only by the encryption
                of the database's datasets. A snapshot holds the same key as its
                disk, and a disk created from a snapshot or image embeds the
                source's key. There is no key rotation or rekey operation.

                Control plane data on the U.2 drives, including the control
                plane database, is encrypted by the storage layer. Each sled
                derives one key per drive from a rack secret and does not store
                it. The rack secret is split into shares, one per member sled;
                reconstructing it takes a threshold (K) of more than half of
                them. This protects that data against theft of U.2 drives or
                whole sleds where the party obtains fewer than K members'
                shares. Each sled's shares are stored unencrypted on its M.2
                drives and are not sealed to the hardware root of trust: a party
                that obtains the M.2 drives of K or more members can reconstruct
                the rack secret and derive the keys for any U.2 drive of that
                rack.

                Not encrypted: local disks, and the M.2 boot drives, which hold
                boot images, sled and service configuration, the key shares, and
                staged crash dumps.

                Integrity. On each U.2 drive, checksums detect corruption but
                there is no redundant copy to repair from, and the control plane
                schedules no scrubs. Distributed disks are kept as three
                replicas on different sleds, which are reconciled and repaired,
                and a block that fails authentication on read is not returned.
                That authentication covers block contents, not position or
                freshness, so it does not by itself detect a replica returning
                an older valid block. A local disk is a single copy on one sled.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#be8d6076-4c17-4636-aae7-419d7bb5701c"
                  text: "Oxide Docs: Disks and Snapshots (Data Encryption)"
                  rel: reference
                - href: "#d23924f9-837c-4e0f-84c6-6be26711875c"
                  text: "Oxide Docs: OS, Hypervisor, and Storage Architecture"
                  rel: reference
                - href: "#a3d63a79-3806-4f52-91ce-3afa48cf3c05"
                  text: "RFD 301: Key Hierarchy"
                  rel: reference
                - href: "#a3cf381f-9d9c-434e-a49d-e38651e5e9ea"
                  text: "RFD 238: Trust Quorum"
                  rel: reference
              remarks: >-
                The customer is responsible for encrypting local disks in the
                guest or application and managing those keys; for physical
                protection of the rack; for protecting or wiping removed sleds
                and drives, including the M.2 boot drives, under its media
                procedures; and for any additional encryption in guest operating
                systems and applications that its data classification policy
                requires, including key management for that encryption. These
                responsibilities must be documented in the system SSP.
            - uuid: c6f225e5-8cea-48e8-b037-ca31ab38ced7
              control-id: sc-28.1
              description: >-
                The Oxide Cloud Computer applies authenticated encryption to
                distributed disks (AES-256-GCM-SIV, per block) and to control
                plane datasets on the U.2 drives (AES-256-GCM). On distributed
                disks a block that fails authentication on read is not returned;
                the authentication covers block contents, not position or
                freshness (see SC-28).

                Cryptographic protection at rest does not extend to local disks
                or to the M.2 boot drives, which are not encrypted (see SC-28
                for what is covered and where the keys are kept).

                No public source establishes FIPS 140 validation of any
                cryptographic module used by the Oxide Cloud Computer, or
                operation of any component in a FIPS-approved mode, and this
                narrative asserts neither; see IA-7.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#be8d6076-4c17-4636-aae7-419d7bb5701c"
                  text: "Oxide Docs: Disks and Snapshots (Data Encryption)"
                  rel: reference
                - href: "#d23924f9-837c-4e0f-84c6-6be26711875c"
                  text: "Oxide Docs: OS, Hypervisor, and Storage Architecture"
                  rel: reference
              remarks: >-
                A customer whose policy requires FIPS 140 validated modules or
                operation in a FIPS-approved mode must confirm this with Oxide
                Computer Company. The customer is responsible for encrypting
                local disks in the guest or application, and for algorithm
                selection and key management for any encryption it adds in guest
                operating systems.
            - uuid: 93a6f1c6-2eda-4779-81e2-0a2babf912a1
              control-id: sc-28.3
              description: >-
                The keys that protect information at rest are stored as follows
                (see SC-12 for key custody in general).

                Distributed-disk keys are stored in the control plane database
                and are not wrapped by any other key; their only protection at
                rest is the encryption of the database's datasets. The database
                accepts connections on the underlay network without TLS or
                client authentication, and the control plane sends disk keys to
                the services that use them over the underlay without TLS. The
                storage service that holds a disk's replicas is never given the
                key.

                Keys for control plane datasets are not stored persistently;
                each sled derives them from the rack secret when it unlocks its
                storage. The rack secret is not stored whole. Each member sled
                stores its share unencrypted on its M.2 drives, not sealed to
                the hardware root of trust, and a party that obtains the M.2
                drives of the threshold number of members or more can
                reconstruct the secret (see SC-28). Over the network, a sled
                releases a share only to a peer that is a member of the rack and
                passes mutual authentication and firmware attestation.

                Each sled's identity key is generated and held in its hardware
                root of trust and does not leave it. It is the only key
                described here that is held in hardware; it authenticates the
                sled and does not encrypt the stored shares or keys.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#a3d63a79-3806-4f52-91ce-3afa48cf3c05"
                  text: "RFD 301: Key Hierarchy"
                  rel: reference
                - href: "#a3cf381f-9d9c-434e-a49d-e38651e5e9ea"
                  text: "RFD 238: Trust Quorum"
                  rel: reference
              remarks: >-
                The customer is responsible for physical protection of the rack
                and for protecting or wiping removed sleds and drives under its
                media procedures: a removed sled's M.2 drives still hold its key
                shares, and wiping them before reuse is a procedure, not a
                function of the component. The trust quorum design document (RFD
                238) recommends independent cryptographic review of the secret
                sharing implementation and of the protocol; no public record of
                either review was found, and a customer that requires one should
                confirm its status with Oxide Computer Company. These
                responsibilities must be documented in the system SSP.
            - uuid: 6ae456ee-5a27-4afd-88ba-fead438e4800
              control-id: sc-38
              description: >-
                The Oxide Cloud Computer limits access to operational
                information on its external API by role. Operations on resources
                require an authenticated principal, and the control plane
                authorizes each request against roles assigned on the fleet, a
                silo, or a project. Silos are the tenancy boundary, each with
                its own users, identity configuration, and projects. The audit
                log is readable only with the fleet viewer role. Login, device
                authorization bootstrap, ping, and static console asset
                endpoints are reachable without authentication.

                Three exposures fall outside this role model. A host attached to
                a technician port can view rack inventory (the identity, state,
                and firmware versions of every sled, switch, and power shelf
                controller) through the setup and recovery interface without a
                credential (see AC-17). Control plane services communicate on
                the underlay network without TLS and without authentication,
                relying on the underlay being separate from customer and guest
                networks. Silo endpoint hostnames can be resolved through DNS by
                any host with network access to the rack; the existence and name
                of a silo are not treated as confidential.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#2225a7e4-7713-4d6d-8640-9bf49222d9dd"
                  text: "Oxide Docs: Configuring Access (IAM)"
                  rel: reference
                - href: https://docs.oxide.computer/guides/system/initial-rack-setup
                  text: "Oxide Docs: Initial Rack Setup"
                  rel: reference
              remarks: >-
                The customer is responsible for controlling physical access to
                the technician ports and network access to any host cabled to
                them, which is the only safeguard for the rack inventory visible
                there; that access is not recorded in the audit log. A customer
                that treats silo hostnames as sensitive should restrict DNS
                resolution to authorized hosts with its own network controls.
                The customer is responsible for its operations security
                practices, including which personnel hold roles that expose
                operational information, and for documenting these
                responsibilities in the system SSP.
            - uuid: ad5a0e46-76fa-40c4-99f3-565858f95615
              control-id: sc-39
              description: >-
                The Oxide Cloud Computer maintains separate execution domains at
                each layer. Each guest instance runs under hardware
                virtualization with its own nested page tables, which confine it
                to its own memory and isolate it from every other instance and
                from the host. Each running instance has its own virtual machine
                monitor process in its own operating system zone, which is given
                only that instance's devices and local disk volumes; the process
                and zone boundaries confine the virtual machine monitor rather
                than the guest directly. Control plane services run in zones on
                the host operating system. On the root of trust and service
                processor microcontrollers, every firmware task, including
                device drivers, runs in unprivileged mode in its own
                memory-protected regions and interacts with other tasks through
                the firmware kernel.

                Host process and memory protection depends on the host operating
                system kernel, which is written in C.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: implemented
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#d23924f9-837c-4e0f-84c6-6be26711875c"
                  text: "Oxide Docs: OS, Hypervisor, and Storage Architecture"
                  rel: reference
                - href: "#d997e812-b360-4598-8df7-b892b5133273"
                  text: "Hubris: Oxide service processor firmware"
                  rel: reference
                - href: https://hubris.oxide.computer/reference/
                  text: Hubris Reference
                  rel: reference
            - uuid: d1673118-14f6-4577-953b-82fad82e11e1
              control-id: sc-41
              description: >-
                Each rack switch has two technician ports on its front panel,
                used for initial rack setup, offline update, recovery, and Oxide
                support access. They need not be connected for the rack to
                operate, and normal system update does not use them. Oxide
                Computer Company states that the component has no customer
                setting that disables them.

                Whenever a switch's service processor starts, it locks the
                technician ports so that an attached host cannot reach the rest
                of the management network directly; an unlock is time-limited.
                The lock does not disable the ports. A locked port still reaches
                the setup and recovery interface, which requires no credential
                and can update and power-control rack components; the support
                shell, which accepts only keys held on Oxide support hardware
                tokens; and the API, which requires customer credentials (see
                AC-17). Use of the setup and recovery interface and the support
                shell, and management network unlock, are not recorded in the
                audit log.

                The safeguard for the ports is therefore the customer's physical
                control of them and network control of any host cabled to them.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: https://docs.oxide.computer/guides/architecture/networking
                  text: "Oxide Docs: Networking Architecture"
                  rel: reference
                - href: https://docs.oxide.computer/guides/system/system-setup
                  text: "Oxide Docs: System Setup"
                  rel: reference
                - href: https://docs.oxide.computer/guides/operator/faq
                  text: "Oxide Docs: Operator FAQ"
                  rel: reference
              remarks: >-
                The customer is responsible for controlling physical access to
                the technician ports and network access to any jumpbox or other
                host cabled to them. An organization that requires the ports
                disabled must rely on physical measures, such as leaving them
                uncabled and restricting access to the rack. The customer is
                also responsible for physical control of the network uplink
                ports, for monitoring the ports and attached hosts under its
                facility and network monitoring procedures, and for documenting
                the technician port access model in the system SSP.
            - uuid: 33fdf4f7-c1a8-4478-b3c0-65aa2a47e29b
              control-id: sc-45
              description: >-
                The Oxide Cloud Computer synchronizes its system clocks to the
                NTP servers the customer names at rack setup, using an NTP
                service that is part of the control plane. The customer
                designates the authoritative time source.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#e9b8bcb6-c7b0-4281-91c3-639134a6af8c"
                  text:
                    "Oxide Docs: Initial Rack Setup (Configure Basic Networking)"
                  rel: reference
              remarks: >-
                The customer is responsible for providing accurate NTP servers
                that are themselves synchronized to a trusted time source; the
                rack's time depends on them.
            - uuid: 6df9ba9f-4d72-4d21-87f0-0f8a1b071842
              control-id: sc-45.1
              description: >-
                The control plane's NTP service synchronizes the rack's clocks,
                without manual action, to the NTP servers the customer names at
                rack setup, which serve as the rack's authoritative time source.
                The component has no customer setting for how often clocks are
                compared or for the time difference at which they are
                synchronized, and public documentation does not state those
                values.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#e9b8bcb6-c7b0-4281-91c3-639134a6af8c"
                  text:
                    "Oxide Docs: Initial Rack Setup (Configure Basic Networking)"
                  rel: reference
              remarks: >-
                The customer must designate NTP servers that are synchronized to
                an authoritative time source and document the designation in the
                system SSP. An organization with a defined comparison frequency
                or maximum time difference should confirm the component's
                synchronization behavior with Oxide Computer Company.
            - uuid: 8371c49f-feb7-4cf0-a9eb-fdc7cb59bbae
              control-id: sc-47
              description: >-
                The primary path for operating the rack is the control plane API
                and web console, served over HTTPS on the customer's network.
                The alternate path is a host attached to a switch technician
                port (see AC-17). Through it a fleet administrator can reach the
                same API with the same certificate, credentials, and
                authorization. This path remains reachable when the
                source-address allow-list blocks access and is the documented
                recovery from an allow-list lockout, but it depends on the
                control plane being up. Its requests are recorded in the audit
                log like other API requests.

                The only path that does not depend on the control plane is the
                setup and recovery interface at the technician ports. It
                requires no credential, is limited to viewing inventory, power
                control, and offline update, and its use is not recorded in the
                audit log. Public documentation describes offline update as
                performed by Oxide Support and operator use of the technician
                ports as under close supervision of Oxide, with allow-list
                recovery as the documented customer-run exception.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: https://docs.oxide.computer/guides/operator/faq
                  text: "Oxide Docs: Operator FAQ"
                  rel: reference
                - href: https://docs.oxide.computer/guides/system/system-setup
                  text: "Oxide Docs: System Setup"
                  rel: reference
              remarks: >-
                An organization that requires a customer-operated alternate path
                for command and control should note these limits and consider
                compensating controls such as an out-of-band network path to the
                API endpoint. The customer is responsible for controlling
                physical access to the technician ports and network access to
                any host cabled to them, which is the only safeguard for the
                setup and recovery interface, and for documenting the alternate
                path in the system SSP.
            - uuid: c8f30aaf-30fd-4842-9d49-b3d615990c34
              control-id: si-2
              description: >-
                Oxide Computer Company publishes a security contact for
                reporting flaws and publishes security advisories for
                vulnerabilities in its products that may require customer
                action. Oxide Computer Company states it will acknowledge a
                report within 72 hours; no other response or remediation time
                is published.

                Flaws are corrected through a self-service system update. Oxide
                Support delivers each update as a bundle through a
                customer-specified file transfer, and an operator with the
                fleet admin role uploads it and sets the target release through
                the API, without physical access. A bundle covers root of trust
                (RoT) and service processor (SP) firmware for sleds, switches,
                and power shelf controllers, the host OS, and control plane
                software. SSD firmware is not included and is handled
                separately with Oxide Support. Setting the target release
                starts the update; there is no separate approval step.

                The customer's comparison of the bundle checksum with the value
                provided by Oxide Support is the only step that ties a bundle
                to Oxide Computer Company, because the trust root the operator
                adds to the rack is taken from the bundle itself and the
                bundle's metadata is signed with a key generated for that
                build. The control plane verifies the metadata signatures
                against the rack's trust store once, at upload, and afterwards
                checks each artifact by hash against the verified metadata.
                Metadata expiry is not enforced. RoT firmware carries its own
                signatures, which the RoT verifies at boot; no signature on SP
                firmware is verified at update or boot (see SI-7). Signed
                release builds are identified as future work.

                Downgrades are refused, and an update cannot be aborted,
                paused, or rolled back. Recovery from a failed update is an
                offline update performed with Oxide Support at the technician
                ports (see AC-17). That offline path requires no credential,
                does not consult the trust store, and is not recorded in the
                audit log. Whether RoT or SP firmware enforces rollback
                protection is not established.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#952a7e36-0e1f-4f7c-bc50-ad3757cd5541"
                  text: Oxide Security Advisories
                  rel: reference
                - href: "#eeb24ebd-edc5-47ec-8545-4272f16bbfc9"
                  text: "Oxide Docs: System Update"
                  rel: reference
                - href: https://docs.oxide.computer/security
                  text: "Oxide Docs: Security"
                  rel: reference
              remarks: >-
                The customer is responsible for validating the checksum of each
                bundle against the value provided by Oxide Support before
                adding the bundle's trust root to the rack, and for controlling
                physical and network access to the technician ports. The
                customer is responsible for monitoring Oxide security
                advisories, defining the maximum time permitted between
                advisory publication and update, and applying updates within
                that window. The customer is also responsible for restricting
                the fleet admin role, removing trust roots that are no longer
                needed, approving updates under its change control process
                before the target release is set, and any pre-production
                testing its configuration management process requires. Flaw
                remediation timelines and this procedure must be documented in
                the system SSP.
            - uuid: 8e4092bb-6a3c-46e5-9f2b-d4e206309692
              control-id: si-2.4
              description: >-
                The system update described in SI-2 is the component's patch
                management tool. Once an operator with the fleet admin role
                uploads a bundle and sets the target release, the control plane
                updates RoT and service processor firmware on sleds, switches,
                and power shelf controllers, the host OS, and control plane
                software without physical access to the rack, and reports
                progress. The component does not schedule or start updates on
                its own. The API and web console remain available through most
                of an update, with a short period of downtime at the end, and a
                running instance experiences downtime when its sled is
                rebooted. An update cannot be aborted, paused, or rolled back.
                Update operations through the API are recorded in the audit
                log. The offline update path at the technician ports requires
                no credential and is not recorded in the audit log (see SI-2).
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#eeb24ebd-edc5-47ec-8545-4272f16bbfc9"
                  text: "Oxide Docs: System Update"
                  rel: reference
              remarks: >-
                The customer is responsible for validating the checksum of each
                bundle against the value provided by Oxide Support before
                adding its trust root, integrating update initiation into its
                patch management workflow, defining update frequency consistent
                with its flaw remediation policy, and any automation that
                starts updates on a schedule. The customer is responsible for
                controlling physical and network access to the technician
                ports. Guest operating systems and applications in customer VMs
                are outside the scope of system update; the customer is
                responsible for patching those workloads.
            - uuid: d739a7c9-3714-4548-92d4-98d1eadb2d61
              control-id: si-2.6
              description: >-
                The system update installs the new version of each component in
                the bundle (firmware, host OS, and control plane software). The
                component does not document removal of previous versions after
                an update. RoT and service processor firmware each have a
                second image slot, so a previous firmware image can remain in
                the inactive slot. The control plane refuses a target release
                older than the current one, and there is no rollback operation.
                Whether RoT or service processor firmware enforces rollback
                protection is not established.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#eeb24ebd-edc5-47ec-8545-4272f16bbfc9"
                  text: "Oxide Docs: System Update"
                  rel: reference
              remarks: >-
                Organizations that require removal of previous versions should
                confirm the current behavior with Oxide Computer Company before
                asserting this control as satisfied. Guest OS and application
                versions within customer VMs are the customer's responsibility.
            - uuid: 18dadeaa-603d-4dea-bc52-2a13e4736afa
              control-id: si-3
              description: >-
                The Oxide Cloud Computer does not run signature-based or
                behavioral malicious code scanning on its firmware, host OS, or
                control plane, and it does not support such scanning by the
                customer on the host OS. Its alert mechanism does not deliver
                integrity or attestation events.

                What the component provides are integrity checks on its own
                firmware and update bundles. Root of trust firmware is
                signature-verified at boot. Service processor firmware is
                measured but no signature on it is verified, and no
                verification or measurement of the host OS or control plane
                software at boot is established (see SI-7). Update bundles are
                verified as described in SI-2: the customer's comparison of the
                bundle checksum with the value from Oxide Support is the only
                step that ties a bundle to Oxide Computer Company, and the
                offline update path at the technician ports requires no
                credential. Proprietary third-party firmware is present in the
                product.

                Malicious code protection for guest virtual machine instances
                is entirely the customer's responsibility.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#d23924f9-837c-4e0f-84c6-6be26711875c"
                  text: "Oxide Docs: OS, Hypervisor, and Storage Architecture"
                  rel: reference
                - href: "#eeb24ebd-edc5-47ec-8545-4272f16bbfc9"
                  text: "Oxide Docs: System Update"
                  rel: reference
              remarks: >-
                The customer is responsible for deploying malicious code
                protection within its guest virtual machine instances and for
                any workloads it runs on the rack. The customer is responsible
                for validating the checksum of each update bundle against the
                value provided by Oxide Support before adding its trust root,
                and for controlling physical and network access to the
                technician ports. Customer-side responsibilities must be
                documented in the system SSP.
            - uuid: 66bca615-76f1-4482-b167-d3a3640ba25f
              control-id: si-3.10
              description: >-
                The Oxide Cloud Computer does not provide malware analysis
                tooling. Customers can use virtual machine instances as
                isolated environments for their own analysis. Each VM is
                confined to its own memory and isolated from other VMs and from
                the host, and every instance network interface has a firewall,
                enforced in the host OS outside the guest, that by default
                denies inbound and allows outbound traffic. Nested
                virtualization is not supported.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#d23924f9-837c-4e0f-84c6-6be26711875c"
                  text: "Oxide Docs: OS, Hypervisor, and Storage Architecture"
                  rel: reference
              remarks: >-
                The customer is responsible for provisioning and configuring
                analysis VMs, selecting and deploying malware analysis tooling
                in them, establishing procedures for safe code execution and
                result collection, and incorporating analysis findings into its
                malicious code detection capabilities. Because the default
                firewall allows outbound traffic, and a new VPC's default rules
                admit inbound traffic from within the VPC and SSH and ICMP from
                any source, the customer is responsible for restricting the
                network access of analysis VMs.
            - uuid: a26b1acf-aabe-419d-a332-d5dd8956755c
              control-id: si-4
              description: >-
                The Oxide Cloud Computer does not provide intrusion detection
                or anomaly detection. It provides two data sources that a
                customer monitoring program can draw on.

                The audit log records authenticated, state-changing requests to
                the external API, and login attempts, for both success and
                failure. Read requests, and requests rejected at authentication
                other than login attempts, are not recorded (see AU-12).
                Entries carry no resource identifier and no request body, and
                login attempt entries identify neither the user nor the session
                created (see AU-3). Entries are kept for 90 days and are not
                pushed by the rack; the customer fetches them through the API.

                The control plane's metrics service collects telemetry that the
                customer can query through the API. Telemetry is kept for 30
                days, with no customer setting to change that.

                Use of the setup and recovery interface and the support shell
                at the technician ports, and unlocking of the management
                network, are not recorded in the audit log (see AC-17). API
                requests made through the technician ports are recorded like
                any other API request.

                Alerts are delivered only by webhook, and the alert classes
                cover a liveness probe and power shelf power supply insertion
                and removal. No audit, account, authentication, integrity, or
                attestation events are delivered as alerts, so notification of
                such events depends on customer tooling reading the audit log.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
                - href: "#b66735eb-7655-4511-adf0-84616eb41209"
                  text: "Oxide Docs: Metrics OxQL Tutorial"
                  rel: reference
                - href: https://docs.oxide.computer/guides/alerts/overview
                  text: "Oxide Docs: Alerts Overview"
                  rel: reference
                - href: https://docs.oxide.computer/guides/integrations/opentelemetry
                  text: "Oxide Docs: OpenTelemetry Integration"
                  rel: reference
              remarks: >-
                The customer operates the monitoring program. The customer is
                responsible for fetching audit entries through the API at a
                regular interval (this requires the fleet viewer role; Oxide
                Computer Company publishes OpenTelemetry Collector receivers
                for it), storing them in an external SIEM, defining alerting
                rules and thresholds over the audit log and metrics, and
                reviewing monitoring output on a defined schedule. Because
                technician port activity other than API requests cannot be
                observed through the audit log, the customer is responsible for
                controlling physical access to the technician ports and network
                access to any host cabled to them, for granting and terminating
                that access for each Oxide support session and keeping its own
                record of it, and for monitoring the ports and attached hosts
                under its facility and network monitoring procedures.
                Customer-side responsibilities must be documented in the system
                SSP.
            - uuid: 27d0733c-0e42-4fec-af1b-5c05ab5d8b37
              control-id: si-4.1
              description: >-
                The Oxide Cloud Computer does not provide or operate an
                intrusion detection system. The audit log and metrics telemetry
                described in SI-4 can serve as inputs to a customer-deployed
                one. The rack does not push audit records; the customer fetches
                them through the API, and Oxide Computer Company publishes
                OpenTelemetry Collector receivers that collect audit logs from
                the API. Read requests, requests rejected at authentication
                other than login attempts, and technician port activity other
                than API requests are not present in the audit log (see AU-12
                and AC-17).
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
                - href: "#b66735eb-7655-4511-adf0-84616eb41209"
                  text: "Oxide Docs: Metrics OxQL Tutorial"
                  rel: reference
                - href: https://docs.oxide.computer/guides/integrations/opentelemetry
                  text: "Oxide Docs: OpenTelemetry Integration"
                  rel: reference
              remarks: >-
                The customer is responsible for deploying and operating an
                intrusion detection system, configuring collection of audit
                records and metrics into it, defining detection rules and
                thresholds, and responding to alerts. The customer is
                responsible for controlling and monitoring physical and network
                access to the technician ports.
            - uuid: 34273153-2fbb-4d6f-9434-67306a9f9192
              control-id: si-4.2
              description: >-
                The Oxide Cloud Computer does not perform automated analysis of
                its audit log or metrics telemetry and does not push audit
                records. Both sources (see SI-4) are available through the API
                for customer-operated tools, and the audit log can be fetched
                by time range at a regular interval. An audit entry becomes
                visible only once its request has completed, so a request in
                progress cannot be seen. Read requests and technician port
                activity other than API requests are not recorded (see AU-12).
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
                - href: "#b66735eb-7655-4511-adf0-84616eb41209"
                  text: "Oxide Docs: Metrics OxQL Tutorial"
                  rel: reference
              remarks: >-
                The customer is responsible for deploying automated tools that
                poll the audit log and metrics APIs, perform near real-time
                analysis, and generate alerts on detected events.
            - uuid: 85ec437e-48ae-4ac9-b183-d1de23966601
              control-id: si-4.4
              description: >-
                Per-flow network logging, packet capture, and deep-packet
                inspection of guest VM traffic are not documented capabilities
                of the Oxide Cloud Computer, and VPC firewall deny events are
                not captured in the audit log. What it provides are the two data sources described
                in SI-4: metrics telemetry, and the audit log, which records
                authenticated, state-changing requests to the external API, and
                login attempts, with the source IP address of each. Read
                requests and requests rejected at authentication other than
                login attempts are not recorded. Customers that require traffic
                content inspection or per-flow visibility must deploy network
                monitoring appliances and route guest VM traffic through them
                using VPC routing.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
                - href: "#b66735eb-7655-4511-adf0-84616eb41209"
                  text: "Oxide Docs: Metrics OxQL Tutorial"
                  rel: reference
              remarks: >-
                The customer is responsible for deploying network monitoring
                tools and configuring VPC routing to direct traffic through
                inspection appliances if per-flow visibility or content
                inspection is required.
            - uuid: d7540805-e3a5-4f95-acd8-be5753dafb67
              control-id: si-4.5
              description: >-
                The Oxide Cloud Computer does not generate alerts on
                indications of compromise. Its alert mechanism delivers
                webhooks only, and the alert classes cover a liveness probe and
                power shelf power supply insertion and removal; no audit,
                account, authentication, integrity, or attestation events are
                delivered as alerts. Alerting on compromise indicators
                therefore depends on customer tooling reading the audit log,
                which is available through the API as structured records. The
                limits of that log are stated in SI-4; in particular, read
                requests, requests rejected at authentication other than login
                attempts, and technician port activity other than API requests
                are not recorded.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
                - href: https://docs.oxide.computer/guides/alerts/overview
                  text: "Oxide Docs: Alerts Overview"
                  rel: reference
              remarks: >-
                The customer is responsible for defining compromise indicators,
                fetching the audit log into its SIEM and configuring alert
                rules against it, and ensuring designated personnel are
                notified when those indicators are detected.
            - uuid: 6abea72c-3af3-45de-9425-096f04164f60
              control-id: si-4.11
              description: >-
                The Oxide Cloud Computer does not analyze communications
                traffic for anomalies; there is no built-in anomaly detection,
                baselining, or alerting for network traffic. Metrics telemetry
                (see SI-4) is available through the API for analysis in
                customer tooling. Customers that require per-flow visibility,
                deep-packet inspection, or automated anomaly detection must
                deploy network analysis tools and route guest VM traffic
                through them using VPC routing. Analysis at the external
                boundary of the rack is performed in the customer's upstream
                network.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#b66735eb-7655-4511-adf0-84616eb41209"
                  text: "Oxide Docs: Metrics OxQL Tutorial"
                  rel: reference
              remarks: >-
                The customer is responsible for establishing traffic baselines,
                defining anomaly thresholds, consuming metrics into its
                analysis tooling, analyzing traffic at the rack's external
                boundary in its upstream network, and deploying inline network
                inspection appliances if deeper traffic analysis is required.
            - uuid: c859402a-4bdb-4d22-ba39-6a06b8b0bc02
              control-id: si-4.12
              description: >-
                The Oxide Cloud Computer does not generate organization-defined
                alerts. Its own alert mechanism delivers webhooks for a
                liveness probe and power shelf power supply events only; it
                does not deliver audit, account, authentication, or integrity
                events. Customers configure such alerts in their own tooling
                against the audit log and metrics telemetry (see SI-4).

                The audit log records authenticated, state-changing requests to
                the external API, and login attempts, for both success and
                failure (including authorization denials), which supports rules
                on indicators such as failed login attempts, denied
                state-changing requests, and access from unexpected source
                addresses. Login attempt entries identify neither the user nor
                the session created. Read requests, requests rejected at
                authentication other than login attempts, and technician port
                activity other than API requests are not recorded.
              props:
