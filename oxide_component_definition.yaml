            - uuid: 97b3649c-f12e-47e8-ba56-a3ffabf3a5f5
              control-id: sc-17
              description: >-
                The customer supplies the TLS certificates for the API and web
                console, obtaining each from a certificate authority of its
                choosing and uploading it with its private key at rack setup
                and, afterwards, through the API. The Oxide Cloud Computer does
                not issue certificates for customer use, and the API does not
                authenticate clients by certificate. For SAML silos, the
                identity provider's signing certificate is issued and managed at
                the customer's identity provider.

                Signing of root of trust firmware and device identity rest on
                PKIs operated by Oxide Computer Company. Oxide Computer Company
                states that their root keys are held in a physically protected
                offline keystore and are used only in key ceremonies observed by
                multiple witnesses. The trust anchors for these PKIs are set by
                Oxide Computer Company, which states that the customer cannot
                replace them.
                Two other trust stores exist: the customer installs the trust
                roots against which software update bundles are checked (see
                SI-2), and the certificate authorities the control plane trusts
                when it acts as a TLS client are fixed in the software release.

                No public source publishes the production root certificates, so
                a customer cannot verify these trust anchors from public sources
                alone and must request the certificates from Oxide Computer
                Company if it needs them.
