  components:
    - uuid: 78040f93-4dea-4b95-a44e-4067de6296bd
      type: hardware
      title: Oxide Cloud Computer
      description: >-
        The Oxide Cloud Computer is a rack-scale system of co-designed
        hardware and software, delivered as a fully integrated rack. It
        comprises compute sleds, two integrated rack switches, and power
        shelves, each with a hardware root of trust and a service processor
        running the Hubris operating system; the Helios host operating system
        and Propolis hypervisor on each sled; and the control plane, which
        serves the external API and web console and orchestrates compute,
        storage, and networking for virtual machine instances. The rack is
        modeled as a single component; the control implementations describe
        its internal elements where they are relevant to a control.
      props:
        - name: version
          value: "23"
        - name: release-date
          value: "2026-09-18T00:00:00Z"
        - name: security-contact
          value: security@oxidecomputer.com
      purpose: >-
        On-premises cloud infrastructure, operated by the customer in a
        customer-controlled facility, that provides virtual machine compute,
        block storage, and virtual networking through an API and web console.

      responsible-roles:
        - role-id: component-provider
          party-uuids:
            - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e

      protocols:
        - uuid: 70c86f29-a577-4797-8ab0-9d0dae95c1ab
          name: https
          title: Oxide API and web console
          port-ranges:
            - start: 443
              end: 443
              transport: TCP

      control-implementations:
        - uuid: 6042c538-dc04-4ef2-8a9d-604cc048dd3a
          source: "#6bd2086f-e3e8-4a14-9149-955b053a24eb"
          props:
            - name: catalog-version
              ns: https://oxide.computer/ns/oscal
              value: "5.2.0"
            - name: control-selection
              ns: https://oxide.computer/ns/oscal
              value: >-
                Covers at minimum every SP 800-53B High baseline control that
                Oxide's implemented-by-system profile classifies as
                implementable by an information system; additional controls,
                including organization-implemented controls and controls
                outside the High baseline, are included at Oxide's discretion.
          description: >-
            Oxide Cloud Computer control implementations for NIST SP 800-53
            Release 5.2.0. The source is the catalog rather than a baseline
            profile because the selection covers every High baseline control
            classified as system-implementable plus additional controls at
            Oxide's discretion (see the control-selection prop). The SP
            800-53B High baseline profile is listed in back-matter as the
            baseline whose system-implementable controls form the coverage
            floor.
          implemented-requirements:
            - uuid: 821f66c1-2939-4e07-b867-9ce94562f3d1
              control-id: ac-2
              description: >-
                The control plane manages user accounts per Silo. A Silo's
                identity mode is fixed at creation and cannot be changed: SAML
                with just-in-time user creation, SAML with SCIM provisioning, or
                local-only (username and password, with users managed by Silo
                Administrators). In a SAML with SCIM Silo the customer's
                identity provider creates, updates, and deactivates users and
                groups. Every rack also has a built-in recovery Silo with a
                local Fleet Admin account. Access authorizations are role
                assignments on the Fleet, a Silo, or a Project, made by an
                administrator at that level.

                In a SAML with just-in-time Silo, removing a user at the
                identity provider does not remove or deactivate the user on the
                rack; an administrator must invalidate that user's sessions and
                tokens. A single web console session cannot be revoked on its
                own, only all of a user's sessions and tokens together.
                Deactivated or deleted users keep SSH access to instances that
                already hold their SSH keys. The control plane has no approval
                workflow, no notification of account changes, and no periodic
                account review function.

                The audit log records authenticated, state-changing requests to
                the external API, and login attempts, which include account and
                role changes. Login entries do not identify the user and read
                requests are not recorded, which limits its use for monitoring
                account use (see AU-12).
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              remarks: >-
                The customer must carry out the following and document it in the
                SSP: (a) the account types permitted and prohibited in each
                Silo, and the identity mode chosen for each Silo; (b) the
                account managers (Silo and Fleet Administrators), including who
                holds the recovery Silo's local account; (c-e) criteria and an
                approval process for accounts and role membership; (f) removal
                procedures, which in just-in-time Silos must include
                invalidating a departed user's sessions and tokens on the rack,
                in local-only Silos deleting the user or disabling password
                login and invalidating sessions and tokens, and in every Silo
                removing the user's SSH keys from instances; (g-h) monitoring of
                account changes and notification of account managers, using the
                audit log fetched through the API; (j) periodic account review,
                including Fleet roles; (k) changing the password of any shared
                account, such as the recovery Silo account, when people leave
                the group.
              links:
                - href: "#2225a7e4-7713-4d6d-8640-9bf49222d9dd"
                  text: "Oxide Docs: Configuring Access (IAM)"
                  rel: reference
                - href: "#9f336352-7c4a-40e7-bbae-fec49f9fe38a"
                  text: "Oxide Docs: Identity Providers (SCIM)"
                  rel: reference
                - href: "#8b784fd3-5971-4336-b9ba-a1820242d48e"
                  text: "Oxide Docs: IAM Policy Concepts"
                  rel: reference
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
                - href: https://github.com/oxidecomputer/omicron/issues/7816
                  text: "omicron#7816: Per-session revocation"
                  rel: reference
            - uuid: 3c7195da-d951-433b-851e-be9690478658
              control-id: ac-2.2
              description: >-
                The control plane has no time-based account expiration and does
                not treat temporary or emergency accounts as a distinct
                category, so it does not remove or disable them automatically.

                In a SAML with SCIM Silo, the customer's identity provider can
                automate this: when it sets a user inactive, the control plane
                deletes the user's sessions and tokens and blocks login. In a
                SAML with just-in-time Silo, disabling the account at the
                identity provider stops new logins but does not remove or
                deactivate the user on the rack; existing sessions and tokens
                stay valid until they expire or an administrator invalidates
                them, and device access tokens do not expire by default. In a
                local-only Silo, a Silo Administrator must remove the account or
                disable its password login manually.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              remarks: >-
                The customer must define the time period and document it in the
                SSP with the procedure for each Silo type: identity provider
                automation for SCIM Silos; identity provider policy plus
                invalidation of the user's sessions and tokens on the rack for
                just-in-time Silos; manual removal or disablement, and
                invalidation of sessions and tokens, for local-only Silos. In
                every case the customer must remove the user's SSH keys from
                instances, because deactivated or deleted users keep SSH access
                to instances that already hold their keys.
              links:
                - href: "#9f336352-7c4a-40e7-bbae-fec49f9fe38a"
                  text: "Oxide Docs: Identity Providers (SCIM)"
                  rel: reference
                - href: "#63001433-c47a-40e1-9aff-a700f06d5d41"
                  text: "Oxide API: local_idp_user_delete"
                  rel: reference
                - href: "#641ea787-a624-439c-abd0-687e7c0bcd2b"
                  text: "Oxide API: user_logout"
                  rel: reference
            - uuid: 36b7aac7-998c-4496-862b-d378a40e7738
              control-id: ac-2.3
              statements:
                - statement-id: ac-2.3_smt.a
                  uuid: 20d1b226-9384-47c3-91e4-1db233633d54
                  description: >-
                    The control plane has no account expiration. Expiration is
                    enforced by the identity provider in SAML Silos, with the
                    just-in-time limitation stated in the description, and by
                    manual removal in local-only Silos.
                - statement-id: ac-2.3_smt.b
                  uuid: d538068b-90f6-4810-a51e-05edb4cd80ac
                  description: >-
                    In SAML with SCIM Silos, the identity provider deprovisions
                    accounts no longer associated with a user. In just-in-time
                    Silos a Silo Administrator must also invalidate the user's
                    sessions and tokens. In local-only Silos a Silo
                    Administrator deletes the account and invalidates its
                    sessions and tokens.
                - statement-id: ac-2.3_smt.c
                  uuid: f09a806c-0c4e-482d-98de-67070cbf31a5
                  description: >-
                    The control plane does not detect or act on violations of
                    organizational policy. When one is identified, the identity
                    provider can deactivate the account in SAML with SCIM Silos,
                    and a Silo Administrator can invalidate the user's sessions
                    and tokens in any Silo and, in a local-only Silo, delete the
                    account or disable its password login.
                - statement-id: ac-2.3_smt.d
                  uuid: ea55fec6-fb9e-481f-8022-a1b465539b32
                  description: >-
                    The control plane does not disable accounts for inactivity.
                    The web console idle timeout ends a session, not the
                    account. The audit log is of limited use for measuring
                    inactivity, because read requests are not recorded and login
                    entries do not identify the user. In SAML Silos the identity
                    provider can disable inactive accounts, with the
                    just-in-time limitation stated in the description.
              description: >-
                The control plane does not itself disable accounts on
                expiration, disassociation, policy violation, or inactivity;
                what is available depends on the Silo's identity mode. In a SAML
                with SCIM Silo the identity provider drives deactivation, and
                setting a user inactive deletes the user's sessions and tokens
                and blocks login. In a SAML with just-in-time Silo, disabling
                the account at the identity provider stops new logins but does
                not remove or deactivate the user on the rack, so an
                administrator must also invalidate the user's sessions and
                tokens. In a local-only Silo a Silo Administrator must act
                manually. In every Silo type, a Silo Administrator can
                invalidate all of a user's sessions and tokens at once.
                Deactivated or deleted users keep SSH access to instances that
                already hold their SSH keys.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              remarks: >-
                The customer must document in the SSP the time period and
                procedure for each of the four conditions and each Silo type:
                identity provider configuration for SCIM Silos; identity
                provider procedures plus invalidation of sessions and tokens on
                the rack for just-in-time Silos; manual procedures for
                local-only Silos. Inactivity must be determined from a source
                other than the audit log, such as identity provider records. In
                every case the customer must remove the user's SSH keys from
                instances.
              links:
                - href: "#9f336352-7c4a-40e7-bbae-fec49f9fe38a"
                  text: "Oxide Docs: Identity Providers (SCIM)"
                  rel: reference
                - href: https://docs.oxide.computer/guides/operator/faq#_access_management
                  text: "Oxide Docs: Access Management FAQ"
                  rel: reference
                - href: "#63001433-c47a-40e1-9aff-a700f06d5d41"
                  text: "Oxide API: local_idp_user_delete"
                  rel: reference
                - href: "#641ea787-a624-439c-abd0-687e7c0bcd2b"
                  text: "Oxide API: user_logout"
                  rel: reference
            - uuid: c5cdb668-0c35-4233-8277-d26c4abd39c9
              control-id: ac-2.4
              description: >-
                The control plane automatically records in the audit log
                authenticated, state-changing requests to the external API, and
                login attempts, for both successes and failures, with no
                administrator configuration. For account management this covers
                local user management, identity provider configuration, account
                changes made by the identity provider through SCIM, role and
                policy changes, and administrator-forced logout.

                The following limits bear on account actions. A record has no
                resource identifier and no request body, so the affected account
                appears only in the request URI and operation ID, and the
                content of a change is not recorded (see AU-3). Login entries
                identify neither the user nor the session created, so the
                creation of a user at first SAML login in a just-in-time Silo is
                not attributed to an account. Session and token expiry are not
                recorded. The alert mechanism does not deliver account events
                and the rack does not push audit records, so any notification of
                account actions depends on customer tooling that fetches the
                audit log.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              remarks: >-
                The customer must fetch the audit log through the API at a
                regular interval, before the 90-day on-rack retention period
                ends, and store it in a SIEM or log management system. Where the
                organization requires notification of account actions, the
                customer must implement alerting there and document the
                procedure in the SSP.
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
            - uuid: 0e0568e5-159b-4083-a9ad-8e76d55be378
              control-id: ac-2.5
              description: >-
                The control plane ends web console sessions after eight hours of
                inactivity, and after twenty-four hours regardless of activity.
                These values are fixed; there is no setting to change them.

                Device access tokens (used by the CLI and SDKs) have no
                inactivity logout and do not expire by default. A Silo
                Administrator can set a maximum token lifetime, which applies
                only to tokens created afterwards. Users can delete their own
                tokens at any time.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              remarks: >-
                The customer must assess whether the fixed eight-hour idle
                period meets the organization-defined period of expected
                inactivity; it cannot be shortened. The customer must set a
                maximum device access token lifetime as a compensating control,
                delete tokens created before the setting was applied, and
                document the configured value in the SSP.
              links:
                - href: https://docs.oxide.computer/api/auth_settings_update
                  text: auth_settings_update API
                  rel: reference
                - href: "#8c4910f2-c91f-420c-b1a6-7b79e9003578"
                  text: "Oxide API: current_user_access_token_delete"
                  rel: reference
            - uuid: 904b4389-f128-4234-9118-0d4ee29ab0d1
              control-id: ac-2.11
              description: >-
                The control plane enforces one kind of usage condition on
                accounts: role-based access. Operations on resources through the
                external API require an authenticated principal and are
                authorized against the roles assigned to the user or its groups
                on the Fleet, a Silo, or a Project, whichever client makes the
                request. Each Silo is isolated, with its own users. In SAML with
                SCIM Silos, group membership maintained at the identity provider
                takes effect through the roles assigned to those groups.

                One fleet-wide source-address allow-list restricts which
                addresses can reach the API and web console. Its default is
                "any", and it cannot be set per Silo or per account. The control
                plane does not enforce time-of-day restrictions, device type
                restrictions, or concurrent session limits.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              remarks: >-
                The customer must define the usage conditions for each account
                type and document them in the SSP; assign roles that reflect
                them; enforce the conditions the control plane does not (time of
                day, per-account or per-Silo location, device type, concurrent
                sessions) at the identity provider for SAML Silos or with
                external network controls; and review the fleet-wide
                source-address allow-list, which defaults to "any".
              links:
                - href: "#2225a7e4-7713-4d6d-8640-9bf49222d9dd"
                  text: "Oxide Docs: Configuring Access (IAM)"
                  rel: reference
                - href: "#8b784fd3-5971-4336-b9ba-a1820242d48e"
                  text: "Oxide Docs: IAM Policy Concepts"
                  rel: reference
                - href: "#9f336352-7c4a-40e7-bbae-fec49f9fe38a"
                  text: "Oxide Docs: Identity Providers (SCIM)"
                  rel: reference
            - uuid: 12cc778d-9054-47af-898f-2bd312a55425
              control-id: ac-2.12
              description: >-
                The Oxide Cloud Computer does not detect atypical account usage,
                generate alerts for it, or report it. It provides the audit log
                as a data source for customer tooling: authenticated,
                state-changing requests to the external API, and login attempts,
                are recorded for both successes and failures, including
                authorization denials.

                The following limits bear on account monitoring. Read requests
                (including denied reads), self-logout, session and token expiry,
                and requests rejected at authentication other than login
                attempts are not recorded. Login entries identify neither the
                user nor the session created. Use of the setup and recovery
                interface and the support shell at the technician ports, and
                management network unlock there, are not recorded in the audit
                log (see AC-17). System metrics are also available through the
                API, but they describe resources, not accounts, and metric
                queries are not audited.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
                - href: "#b66735eb-7655-4511-adf0-84616eb41209"
                  text: "Oxide Docs: Metrics OxQL Tutorial"
                  rel: reference
              remarks: >-
                The customer must fetch the audit log through the API at a
                regular interval (the rack does not push it, and entries are
                deleted after 90 days) into a SIEM or log management system;
                define atypical usage patterns and detection thresholds;
                implement alerting; and establish procedures for reporting
                atypical usage to designated personnel or roles. Monitoring of
                login behavior per user depends on the customer's identity
                provider records for SAML Silos.
            - uuid: 2f77f3c4-804c-4fd1-ac53-311c409088e8
              control-id: ac-3
              description: >-
                The control plane enforces access authorizations on requests to
                the external API, the one interface behind the web console, CLI,
                and SDKs. Operations on resources require an authenticated
                principal, and the control plane denies any operation for which
                the caller does not hold a sufficient role on the target
                resource. Roles are assigned on the Fleet, a Silo, or a Project,
                and Silo roles are inherited by the Projects in that Silo. Without
                authentication a client can reach only the login pages and login
                requests, the endpoints that start device authorization, a ping
                endpoint, and static console assets.

                Two access paths are outside this enforcement. First, a host
                attached to a switch technician port can reach a setup and
                recovery interface that requires no credential, applies no role
                check, and can update and power-control rack components. Its
                only safeguard is the customer's control of physical access to
                the technician ports and network access to anything cabled to
                them (see AC-17). Second, the internal interfaces between
                control plane services on the rack's underlay network have no
                authentication and no encryption; they rely on the underlay
                being separate from customer and guest networks.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#2225a7e4-7713-4d6d-8640-9bf49222d9dd"
                  text: "Oxide Docs: Configuring Access (IAM)"
                  rel: reference
                - href: "#8b784fd3-5971-4336-b9ba-a1820242d48e"
                  text: "Oxide Docs: IAM Policy Concepts"
                  rel: reference
              remarks: >-
                The customer must assign roles that reflect its least-privilege
                requirements; the control plane enforces the policy as
                configured. The customer must control physical access to the
                technician ports and network access to any jumpbox or other host
                cabled to them. How the underlay network is kept separate from
                guest and external networks is not described in Oxide's public
                documentation; customers for whom this matters should confirm it
                with Oxide Computer Company.
            - uuid: e8014530-b52a-4c3c-96af-d33c60f43d3c
              control-id: ac-3.4
              description: >-
                The control plane implements discretionary access control
                through delegated role assignment. A Silo Admin controls role
                assignments within the Silo and, in a local-only Silo, the
                Silo's users. A Project Admin controls role assignments within
                the Project. Silo role assignments are inherited by every
                Project in the Silo, and a Silo Collaborator holds the Admin
                role on every Project in the Silo, so it can assign Project
                roles.

                Only a Fleet Admin can assign Fleet roles. Fleet roles do not
                cascade into Silos, with these exceptions: a Fleet Admin can
                view and change any Silo's role policy, and a Silo can be
                created with a mapping that gives holders of its Silo roles a
                Fleet role.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#2225a7e4-7713-4d6d-8640-9bf49222d9dd"
                  text: "Oxide Docs: Configuring Access (IAM)"
                  rel: reference
                - href: "#8b784fd3-5971-4336-b9ba-a1820242d48e"
                  text: "Oxide Docs: IAM Policy Concepts"
                  rel: reference
              remarks: >-
                The customer is responsible for designating which users hold
                Fleet Admin, Silo Admin, Silo Collaborator, and Project Admin
                roles, for reviewing any Silo-to-Fleet role mapping, and for
                ensuring those administrators exercise their discretionary
                authority consistent with the organization's least-privilege
                and need-to-know policies.
            - uuid: d4146a4d-4ce6-429d-8fec-830f15955b0c
              control-id: ac-3.7
              description: >-
                The control plane enforces role-based access control on the
                external API. The roles are fixed, not customer-defined: Admin,
                Collaborator, and Viewer on the Fleet, a Silo, or a Project,
                plus Limited Collaborator on Silos and Projects. Roles are
                assigned to users or groups. The effective role is the strongest
                one held at that level or above, and Silo roles are inherited by
                every Project in the Silo. Operations on resources require an
                authenticated principal, and the control plane denies operations
                the caller's roles do not permit. The linked documentation lists
                what each role permits.

                Three features affect who holds access. A Silo Collaborator
                holds the Admin role on every Project in the Silo. Fleet roles
                do not cascade into Silos, except that a Fleet Admin can view
                and change any Silo's role policy, quotas, identity provider
                configuration, and SCIM tokens. A Silo can be created with a
                mapping that gives holders of its Silo roles a Fleet role.

                The setup and recovery interface at the switch technician ports
                is not subject to these roles: it requires no credential (see
                AC-17).
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#2225a7e4-7713-4d6d-8640-9bf49222d9dd"
                  text: "Oxide Docs: Configuring Access (IAM)"
                  rel: reference
                - href: "#8b784fd3-5971-4336-b9ba-a1820242d48e"
                  text: "Oxide Docs: IAM Policy Concepts"
                  rel: reference
              remarks: >-
                The customer must assign users and groups to roles in accordance
                with its access authorization decisions, including Fleet roles
                and any Silo-to-Fleet role mapping, and must control physical
                and network access to the technician ports, where the setup and
                recovery interface is not governed by roles.
            - uuid: 9eaae5ed-410a-48b7-8199-21253871444a
              control-id: ac-4
              description: >-
                The Oxide Cloud Computer enforces network flow control in the
                host OS on each sled, outside the guest. Traffic between VPCs
                must go through external IP addresses. Every instance network
                interface has a stateful firewall that by default denies inbound
                and allows outbound traffic, and customers define VPC firewall
                rules to control flows. A new VPC starts with default rules that
                allow inbound traffic from within the VPC, and SSH and ICMP from
                any source. Access to resources and their configuration through
                the API is governed by roles (see AC-3).

                The following flows are not protected by the rack. VPC traffic
                between sleds is encapsulated but not encrypted. Communication
                between control plane services on the rack's underlay network is
                not encrypted or authenticated, except trust quorum share
                exchange and bootstrap requests between sleds, which are
                mutually authenticated and encrypted; the other flows rely on
                the underlay being separate from customer and guest networks.
                Distributed disk data is encrypted before it leaves the
                instance's sled, but the storage connections that carry it are
                not authenticated, and during disk import unencrypted data
                crosses the underlay.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#b557fdcb-ae3c-41e4-8cd4-e849a911017d"
                  text: "Oxide Docs: Configuring Guest Networking"
                  rel: reference
                - href: "#2225a7e4-7713-4d6d-8640-9bf49222d9dd"
                  text: "Oxide Docs: Configuring Access (IAM)"
                  rel: reference
              remarks: >-
                The customer must define VPC firewall rules that reflect its
                information flow requirements, including reviewing the default
                rules that admit SSH and ICMP from any source, and must encrypt
                traffic between guests where required. How the underlay is kept
                separate from guest and external networks is not described in
                Oxide's public documentation; the customer should confirm it
                with Oxide Computer Company. The SSP should document the absence
                of encryption and authentication on internal control plane
                traffic and assess its residual risk.
            - uuid: cd283433-6b7a-4f3f-8856-ae740744e030
              control-id: ac-4.4
              description: >-
                The Oxide Cloud Computer's network enforcement (VPC firewall
                rules applied in the host OS on each sled) operates at Layer
                3/4; it enforces flows based on IP address, protocol, and port. The component
                does not perform content inspection on tenant network traffic
                and does not provide a mechanism to detect or block encrypted
                information flows based on payload content.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              remarks: >-
                If the customer's security policy requires that encrypted
                traffic not bypass content-inspection mechanisms, the customer
                must implement that capability within their network
                architecture, for example by routing traffic through an
                inspection appliance deployed as a guest workload or at the
                network boundary, and document it in the system SSP.
            - uuid: 6232a4a0-5972-40c1-b000-5072322a38a4
              control-id: ac-4.21
              description: >-
                The Oxide Cloud Computer separates information flows in three
                ways. VPCs are separated logically in the host OS on each sled,
                outside the guest: traffic between VPCs must go through external
                IP addresses, inbound traffic to an instance is denied by
                default, and customer-defined firewall rules restrict flows
                between subnets and instances within a VPC. Silos separate
                tenants at the control plane: each Silo is isolated, with its
                own users, identity configuration, and projects. Control plane
                traffic is carried on an underlay network separate from customer
                and guest networks.

                The following limits apply. A new VPC starts with default rules
                that admit traffic from within the VPC, and SSH and ICMP from
                any source. Underlay traffic is not encrypted or authenticated
                and relies on that separation. A Fleet Admin can view and change
                any Silo's role policy, quotas, identity provider configuration,
                and SCIM tokens.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#b557fdcb-ae3c-41e4-8cd4-e849a911017d"
                  text: "Oxide Docs: Configuring Guest Networking"
                  rel: reference
                - href: "#cd1ca6d1-fa72-4ed1-9fda-9b9766906355"
                  text: "Oxide Docs: VPC Subnet Routing"
                  rel: reference
                - href: "#ea34ad81-857c-4b6e-8ac3-50902881ef66"
                  text: "Oxide Docs: Silo Management"
                  rel: reference
              remarks: >-
                The customer must define which types of information require
                separation, express that as VPC topology, Silo structure, and
                firewall policy (replacing the default rules that admit SSH and
                ICMP from any source where they are not wanted), and document
                the architecture in the SSP. How the underlay network is kept
                separate from guest and external networks is not described in
                Oxide's public documentation; the customer should confirm it
                with Oxide Computer Company.
            - uuid: 5f36670a-d039-4cdf-b21a-c277273f6069
              control-id: ac-6
              description: >-
                The control plane's role model supports least privilege. Roles
                are assigned explicitly to users or groups and can be scoped to
                the narrowest level needed: a user can hold a role on one
                Project without holding a role on other Projects or on the Silo.
                Each level offers Viewer (read-only), Collaborator, and Admin
                (full control, including role assignment); Silos and Projects
                add Limited Collaborator, which cannot change VPC networking
                configuration. Fleet roles, which grant rack-wide
                administration, are distinct from Silo and Project roles and can
                be assigned only by a Fleet Admin.

                Some features widen privilege. A Silo Collaborator holds the
                Admin role on every Project in the Silo. A Fleet Admin can view
                and change any Silo's role policy, quotas, and identity provider
                configuration. A Silo can be created with a mapping that gives
                holders of its Silo roles a Fleet role. Roles do not govern the
                setup and recovery interface at the switch technician ports,
                which requires no credential (see AC-17).
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#2225a7e4-7713-4d6d-8640-9bf49222d9dd"
                  text: "Oxide Docs: Configuring Access (IAM)"
                  rel: reference
              remarks: >-
                The customer must assign roles at the narrowest scope and lowest
                privilege level consistent with each user's function, conduct
                periodic access reviews (including of Fleet roles and any
                Silo-to-Fleet role mapping), revoke access that is no longer
                required, and control access to the technician ports as
                described under AC-17.
            - uuid: 8d90e742-5676-4ae4-8497-521258aa1ea6
              control-id: ac-6.8
              description: >-
                The Oxide Cloud Computer enforces a privilege boundary between
                guest workloads and the host. Each instance runs in its own
                hardware-virtualized machine, which confines the guest to its
                own memory and isolates it from every other VM and from the
                host. The virtual machine monitor for each instance runs as its
                own process in its own operating system zone. Software in a
                guest, regardless of its privilege level within the guest OS,
                runs at guest privilege within this confinement.

                The Oxide Cloud Computer does not manage the operating system
                inside guest VMs. Privilege levels for software executing inside
                a VM are the responsibility of the customer operating it.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              remarks: >-
                The customer must control privilege levels for software
                executing within its guest VMs, restricting elevated privileges
                (for example root, setuid binaries, and privileged service
                accounts) to the minimum each workload requires.
            - uuid: eb0b8a9b-9f1a-4811-9417-5c825f63571f
              control-id: ac-6.9
              description: >-
                The control plane records in the audit log authenticated,
                state-changing requests to the external API, and login attempts,
                for both successes and failures, including authorization
                denials. This covers privileged functions performed through the
                API, such as Silo creation and deletion, role and policy
                changes, identity provider and user management, changes to the
                source-address allow-list, and system update operations. A
                record identifies the actor, time, source address, operation,
                and result, but not the content of the change (see AU-3).

                Two limits apply. Read requests are not recorded, including
                serial console access, support bundle downloads, and reads of
                the audit log itself. Privileged functions performed at the
                switch technician ports through the setup and recovery interface
                (which requires no credential and can update and power-control
                rack components) or the Oxide support shell are not recorded in
                the audit log, nor is unlocking of the management network there.
                API requests made through a technician port are audited like any
                other API request (see AC-17).
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
                - href: https://docs.oxide.computer/guides/system/system-setup
                  text: "Oxide Docs: System Setup"
                  rel: reference
              remarks: >-
                The customer must control physical access to the technician
                ports and network access to any jumpbox or other host cabled to
                them, which is the only safeguard for the setup and recovery
                interface. The customer must grant and terminate jumpbox and
                network access for each Oxide support session, keep its own
                record of that access and of any customer use of the technician
                ports, fetch audit log entries off the rack before the 90-day
                retention period ends, and document the unaudited technician
                port paths and their residual risk in the SSP.
            - uuid: 6a31a59c-2143-44e9-9d2e-6ab072e02e6e
              control-id: ac-6.10
              description: >-
                The control plane denies requests to the external API that the
                caller's roles do not permit. The roles are fixed, not
                configurable. Privileged functions require an Admin role at the
                relevant level: assigning roles; managing identity provider
                configuration and local users (Silo Admin, or Fleet Admin for
                any Silo); and running system updates (Fleet Admin only). Viewer
                roles are read-only.

                Two features affect which accounts hold privileged functions: a
                Silo Collaborator holds the Admin role on every Project in the
                Silo, and a Silo can be created with a mapping that gives
                holders of its Silo roles a Fleet role.

                This enforcement does not extend to the setup and recovery
                interface at the switch technician ports, which requires no
                credential and can update and power-control rack components.
                Prevention of privileged function use on that path rests on the
                customer's control of physical access to the technician ports
                and network access to anything cabled to them (see AC-17).
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#2225a7e4-7713-4d6d-8640-9bf49222d9dd"
                  text: "Oxide Docs: Configuring Access (IAM)"
                  rel: reference
                - href: "#8b784fd3-5971-4336-b9ba-a1820242d48e"
                  text: "Oxide Docs: IAM Policy Concepts"
                  rel: reference
              remarks: >-
                The customer must restrict Admin roles, the Silo Collaborator
                role, and any Silo-to-Fleet role mapping to personnel authorized
                to perform privileged functions, control physical access to the
                technician ports and network access to any jumpbox or other host
                cabled to them, and document both in the SSP.
            - uuid: 4ceca11c-5712-4618-865d-923f7a974140
              control-id: ac-7
              description: >-
                For SAML Silos, limits on unsuccessful logon attempts and
                lockout are enforced by the customer's identity provider; the
                control plane receives an assertion only if the identity
                provider permits the authentication.

                For local-only Silos (username and password), including the
                built-in recovery Silo and its Fleet Admin user, the control
                plane enforces no limit on consecutive failed logon attempts,
                does not lock accounts, and does not rate limit login attempts.
                Login attempts, successful and failed, are recorded in the audit
                log with the time and source address, but the entries do not
                identify the user, so failures cannot be counted per account.
                Requests rejected at authentication for a missing, invalid, or
                expired credential are not recorded in the audit log.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
                - href: "#15436ac7-c421-406f-a553-49bf2d566dcf"
                  text: "omicron#2307: Review password policy"
                  rel: reference
              remarks: >-
                For SAML Silos, the customer must configure lockout thresholds
                and automated responses in its identity provider and document
                them in the SSP.

                For local accounts the component does not implement this
                control, and every rack has at least one such account, the
                recovery Silo Fleet Admin. The customer should keep local
                accounts to the minimum, use SAML Silos for routine access,
                protect the recovery account's password by procedure, consider
                restricting the fleet-wide source-address allow-list (default
                "any"), alert on repeated failed logins by source address in its
                SIEM, and assess the remaining gap against its authorization
                requirements.
            - uuid: 0ecbb1dc-61d4-4c54-9fa4-a1b28bd3ee0f
              control-id: ac-8
              description: >-
                The Oxide API has no setting for a system use notification, and
                the Oxide web console does not display a customer-defined
                system use notification banner on the login page. This
                capability is planned for a future release (omicron#8201).
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: planned
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: https://github.com/oxidecomputer/omicron/issues/8201
                  text: "omicron#8201: Allow login page to be customizable"
                  rel: reference
              remarks: >-
                The component does not implement this control in the targeted
                release. Until it does, the customer is responsible for
                presenting the approved system use notification by other means,
                for example on the identity provider login page for SAML Silos
                or at a network access point in front of the rack. Once
                implemented, the customer is responsible for providing the
                approved system use notification text and configuring it for
                display on the login page. The notification must meet the
                content requirements of AC-8 as defined in the customer's
                authorization documentation.
            - uuid: c47cebb6-f266-411d-ab32-488c8cf40a78
              control-id: ac-10
              description: >-
                The control plane does not limit the number of concurrent
                sessions per user. A user can hold any number of simultaneous
                web console sessions and active device access tokens.

                Session duration is bounded instead. Web console sessions end
                after 8 hours of inactivity or 24 hours in total; these values
                have no setting. Device access tokens do not expire by default;
                a Silo Administrator can set a maximum lifetime, which applies
                only to tokens created afterwards. Users and Silo Administrators
                can list a user's sessions and tokens and invalidate all of them
                together. A single web console session cannot be revoked on its
                own.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#2225a7e4-7713-4d6d-8640-9bf49222d9dd"
                  text: "Oxide Docs: Configuring Access (IAM)"
                  rel: reference
              remarks: >-
                Organizations that require a concurrent session limit must
                assess whether the available mitigations (fixed session
                timeouts, a maximum device access token lifetime, and
                invalidation of all of a user's sessions and tokens) are
                sufficient for their authorization boundary, or implement
                compensating controls.
            - uuid: 31f516ec-d075-4485-bf60-e803551669fe
              control-id: ac-11
              description: >-
                Users reach the Oxide Cloud Computer through clients (a browser,
                the CLI, and SDKs) running on customer-operated devices. Locking
                the device is a function of those devices, not of the component.

                The control plane ends a web console session after 8 hours of
                inactivity, after which the user must re-authenticate, and after
                24 hours in total. These values are fixed; there is no setting
                to change them. Device access tokens have no inactivity timeout
                and do not expire by default. They remain valid until deleted,
                invalidated together with all of the user's sessions and tokens,
                or a maximum lifetime is reached, if a Silo Administrator has
                set one (it applies only to tokens created afterwards).
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#2225a7e4-7713-4d6d-8640-9bf49222d9dd"
                  text: "Oxide Docs: Configuring Access (IAM)"
                  rel: reference
              remarks: >-
                The customer must assess the fixed 8-hour idle timeout against
                the organization-defined inactivity period, enforce device lock
                on the workstations used to reach the component, set the
                shortest maximum device access token lifetime consistent with
                operational needs, and consider whether the absence of
                idle-based token invalidation is acceptable under its
                authorization requirements.
            - uuid: 8f608bd4-52b0-41ac-bb4b-5e662ff636cc
              control-id: ac-11.1
              description: >-
                This control does not apply to the Oxide Cloud Computer. The
                component's user interfaces (the web console, the CLI, and the
                setup and recovery text interface) are displayed on
                customer-operated client devices; concealing the display with a
                pattern-hiding image is a function of those devices.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: not-applicable
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
            - uuid: d51feda3-840d-45c7-b3ac-c780f7374382
              control-id: ac-12
              description: >-
                The control plane automatically terminates web console sessions
                after 8 hours of inactivity or 24 hours in total, whichever
                occurs first. These values have no setting.

                Device access tokens have no inactivity timeout and do not
                expire by default. A Silo Administrator can set a maximum
                lifetime, which applies only to tokens created afterwards, and
                can invalidate all of a user's sessions and tokens; a single web
                console session cannot be revoked on its own. In SAML Silos with
                just-in-time user creation, removing a user at the identity
                provider does not terminate that user's existing sessions or
                tokens.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#2225a7e4-7713-4d6d-8640-9bf49222d9dd"
                  text: "Oxide Docs: Configuring Access (IAM)"
                  rel: reference
              remarks: >-
                The customer must assess the fixed web console timeouts against
                the organization-defined conditions for session termination; set
                the maximum device access token lifetime to the shortest
                duration consistent with operational needs and delete tokens
                created before the setting was applied; factor the absence of
                inactivity-based token invalidation into its risk assessment;
                and, in just-in-time Silos, invalidate a departed user's
                sessions and tokens.
            - uuid: a885262e-0f40-4808-b4d0-48b6d629e9cd
              control-id: ac-12.1
              description: >-
                The control plane provides user-initiated logout. A user can log
                out of the web console, which ends the current session, delete
                individual device access tokens, and invalidate all of their own
                sessions and tokens at once.

                A web console session other than the current one cannot be
                revoked on its own; the only option is to invalidate all of the
                user's sessions and tokens together. User-initiated logout of
                the current session is not recorded in the audit log.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#8c4910f2-c91f-420c-b1a6-7b79e9003578"
                  text: "Oxide API: current_user_access_token_delete"
                  rel: reference
                - href: "#641ea787-a624-439c-abd0-687e7c0bcd2b"
                  text: "Oxide API: user_logout"
                  rel: reference
                - href: https://github.com/oxidecomputer/omicron/issues/7816
                  text: "omicron#7816: Per-session revocation"
                  rel: reference
              remarks: >-
                A user who suspects that another of their sessions is
                compromised must invalidate all of their own sessions and
                tokens, or ask a Silo Administrator to do so. SSP authors should
                document this limitation and the procedure.
            - uuid: 0458bec7-5687-4dad-a354-e24f9712d413
              control-id: ac-17
              description: >-
                Customer and operator functions are exposed through one HTTP
                API, reached over HTTPS by the web console, the REST API, and
                the CLI. Operations on resources require an authenticated
                principal, and the control plane enforces role-based access
                control on each request. A fleet-wide source-address allow-list
                restricts which addresses can reach the API and console; its
                default is "any". Authenticated, state-changing requests to the
                external API, and login attempts, are recorded in the audit log.

                Each switch also has two technician ports, used for initial rack
                setup, offline update, recovery, and Oxide support access. The
                attached host can be a laptop on site or a customer-provided
                jumpbox, so use of a technician port can be remote. A host
                attached to a technician port can reach a setup and recovery
                interface that requires no credential and can update and
                power-control rack components, an administrative shell that
                accepts only keys held on Oxide support hardware tokens, and the
                API using customer credentials. Use of the setup interface and
                the support shell is not recorded in the audit log. Direct
                access from a technician port to the rack's management network
                is locked; Oxide Computer Company states that on every customer
                rack, unlocking it requires a key held on an Oxide support
                hardware token. Unlocking is not recorded in the audit log.

                The rack has no phone-home feature and makes no connection back
                to Oxide Computer Company. Oxide Computer Company states that it
                has no standing access to customer environments and does not
                perform maintenance without a customer-initiated support
                engagement.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: https://docs.oxide.computer/guides/introduction
                  text: "Oxide Docs: Guides"
                  rel: reference
                - href: "#2225a7e4-7713-4d6d-8640-9bf49222d9dd"
                  text: "Oxide Docs: Configuring Access (IAM)"
                  rel: reference
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
                - href: https://docs.oxide.computer/guides/system/system-setup
                  text: "Oxide Docs: System Setup"
                  rel: reference
                - href: https://docs.oxide.computer/guides/operator/faq
                  text: "Oxide Docs: Operator FAQ"
                  rel: reference
              remarks: >-
                The customer must document usage restrictions and connection
                requirements for each access method in the SSP, authorize each
                type of remote access it permits, and configure the fleet-wide
                source-address allow-list.

                The customer must control physical access to the technician
                ports and network access to any jumpbox or other host cabled to
                them; this is the only safeguard for the setup and recovery
                interface. For each Oxide support session the customer grants
                and terminates jumpbox and network access and must keep its own
                record of that access. The customer must monitor the ports and
                attached hosts under its facility and network monitoring
                procedures, and document the technician port access model in the
                SSP.
            - uuid: 28c77c68-63a5-45b9-ac62-cb330aaac4f3
              control-id: ac-17.1
              description: >-
                The control plane authenticates remote access through the web
                console, API, and CLI, and records authenticated, state-changing
                requests to the external API, and login attempts, in the audit
                log, for both successes and failures. Read requests, and
                requests rejected at authentication other than login attempts,
                are not recorded, and login entries do not identify the user
                (see AU-12). The rack does not push audit records and its alert
                mechanism does not deliver audit or authentication events, so
                monitoring is automated only through customer tooling that
                fetches the audit log through the API.

                At the technician ports, use of the setup and recovery interface
                and the support shell, and management network unlock, are not
                recorded in the audit log; API requests made through those ports
                are (see AC-17).

                For control, a fleet-wide source-address allow-list (default
                "any") restricts which addresses can reach the API and console,
                and a Silo Administrator can invalidate all of a user's sessions
                and tokens, though not a single web console session.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
              remarks: >-
                The customer must monitor remote access by fetching the audit
                log through the API at a regular interval (entries are deleted
                from the rack after 90 days) into a SIEM, defining thresholds
                for anomalous remote access activity, and responding to
                anomalies. The customer must also monitor the technician ports
                and any jumpbox or other host cabled to them under its own
                facility and network monitoring procedures, and keep its own
                record of each Oxide support session.
            - uuid: 003d0ff3-1609-47ee-a76c-b62272b5ac9c
              control-id: ac-17.2
              description: >-
                The control plane protects remote access sessions to the
                external API and web console (and therefore the CLI) with TLS.
                They are served only over HTTPS; there is no plaintext HTTP
                listener and no redirect. The server certificate is supplied by
                the customer per Silo. API requests made through the technician
                ports use the same TLS configuration. The setup and recovery
                interface and the support shell at the technician ports are
                reached over SSH (see AC-17).

                FIPS 140 validation of the cryptographic modules involved, or
                their operation in a FIPS-approved mode, is not established by
                Oxide's public documentation.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              remarks: >-
                The customer must issue, renew, and replace the external TLS
                certificates and private keys, which are uploaded to and stored
                on the rack, and protect the network path (for example with a
                VPN) to any jumpbox cabled to the technician ports. Customers
                that require FIPS-validated cryptography for remote access
                should confirm the status of the component's cryptographic
                modules with Oxide Computer Company. These responsibilities must
                be documented in the SSP.
            - uuid: b2b9475a-ebf3-4173-bf62-142c0c9c7ae6
              control-id: ac-17.3
              description: >-
                The Oxide Cloud Computer does not provide network access control
                points; they are customer network infrastructure. It supports
                routing remote access through them with a fleet-wide
                source-address allow-list for the external API and web console.
                The allow-list defaults to "any"; a Fleet Admin can set it to
                the addresses of the customer's access control points, so that
                the API and console accept connections only from them.

                The allow-list does not govern the technician ports (see AC-17).
                The API remains reachable through them regardless of the
                allow-list, and the other technician port services are reached
                through whatever host the customer cables to the ports.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              remarks: >-
                The customer must route remote access to the rack through
                managed network access control points (for example a VPN gateway
                or jump host), set the source-address allow-list (default "any")
                to their addresses, control network access to any host cabled to
                the technician ports, and document the access control
                architecture in the SSP.
            - uuid: 0e0bdec0-71a4-498b-8b6f-0e79bc56db5a
              control-id: ac-18
              description: >-
                This control does not apply to the Oxide Cloud Computer. Oxide
                Computer Company states that the rack has no wireless network
                interfaces and that all network connectivity is wired.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: not-applicable
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
            - uuid: 08b2a5e1-6d5f-4a50-a549-b34d7cbe8dbb
              control-id: ac-18.1
              description: >-
                This control does not apply to the Oxide Cloud Computer. Oxide
                Computer Company states that the rack has no wireless network
                interfaces; wireless authentication and encryption requirements
                are not applicable.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: not-applicable
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
            - uuid: b62656db-c013-402a-bad7-fa5727669e10
              control-id: ac-18.3
              description: >-
                This control does not apply to the Oxide Cloud Computer. Oxide
                Computer Company states that the rack has no wireless network
                interfaces; wireless connection disabling requirements are not
                applicable.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: not-applicable
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
            - uuid: 85e3204d-263b-496e-9d10-88ff3676fcd2
              control-id: au-3
              description: >-
                The Oxide Cloud Computer records an audit log entry for
                authenticated, state-changing requests to the external API, and
                login attempts, for both successes and failures (including
                authorization denials). AU-12 describes this scope and its
                exceptions.

                Each entry carries an entry ID, time started and time completed,
                request ID, request URI, operation ID, source IP address, user
                agent, actor (silo user and silo; SCIM client and silo; built-in
                user; or unauthenticated), authentication method (session
                cookie, access token, SCIM token, or none), credential ID, and
                result (success with HTTP status; error with HTTP status, error
                code and message; or unknown).

                These fields relate to the AU-3 content items as follows. Type
                of event: operation ID and request URI. When the event occurred:
                time started and time completed. Where the event occurred:
                request URI, which names the API endpoint and resource path.
                Source of the event: source IP address and user agent. Outcome:
                result. Identity of the individual, subject or entity associated
                with the event: actor, authentication method and credential ID.

                The record content has these limits. There is no resource
                identifier field and no request or response body: the affected
                resource appears only in the request URI and operation ID, and
                the content of a change is not recorded. Entries for login
                attempts identify neither the user nor the session created. An
                entry whose outcome cannot be recorded is later closed with
                result unknown.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
              remarks: >-
                The customer is responsible for reviewing the field list against
                the record content it requires for AU-3, and for obtaining from
                other sources (for example identity provider logs for login
                identity) any content the entries do not carry. Customer-side
                responsibilities must be documented in the system SSP.
            - uuid: 50ef4102-0b39-4d41-9b4e-71363d80b5a8
              control-id: au-3.1
              description: >-
                Beyond the AU-3 baseline content, each Oxide Cloud Computer
                audit log entry carries a request ID, the user agent, the
                authentication method, the credential ID, and, for failed
                requests, the HTTP status, error code and error message (see
                AU-3 for the full field list).

                Entries have no resource identifier field and no request or
                response body, so request parameters and the state of a resource
                before and after a change are not recorded and cannot be derived
                from exported entries. Any other organization-defined additional
                information must be added by the customer after export, or
                captured by other means where it cannot be derived from the
                entries.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
              remarks: >-
                SSP authors should review the audit log fields against their
                organization-defined additional information requirements for
                AU-3(1) and document any gap. If required fields are absent, the
                customer must implement enrichment after export, or capture the
                information by other means where it cannot be derived from the
                entries.
            - uuid: a9f0d206-c10d-4a06-b1eb-8944b0b8a52e
              control-id: au-4
              description: >-
                The Oxide Cloud Computer keeps audit records on the rack for 90
                days from completion of each entry and then permanently deletes
                them. Internal retention is defined by time, not by an allocated
                storage capacity, and the period cannot be changed through the
                API, CLI or console.

                The rack does not push audit records. Records are fetched
                through the API, and Oxide Computer Company publishes
                OpenTelemetry Collector receivers that collect the audit log
                from the API and export it to OpenTelemetry-compatible
                destinations. Storage capacity for any longer retention is
                allocated by the customer in external storage.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
                - href: https://docs.oxide.computer/guides/integrations/opentelemetry
                  text: "Oxide Docs: OpenTelemetry Integration"
                  rel: reference
              remarks: >-
                Customers whose retention requirements exceed 90 days must fetch
                entries through the API at a regular interval and store them
                externally; records not exported within the 90-day window are
                permanently deleted. SSP authors should document the customer's
                export and archival mechanism and confirm it covers the full
                organization-defined retention period.
            - uuid: 7edb6578-de44-4482-95d3-ca34428c4b0c
              control-id: au-4.1
              description: >-
                The Oxide Cloud Computer does not transfer audit records to
                alternate storage and provides no alternate storage facility.
                Records are kept on the rack for 90 days and then permanently
                deleted (see AU-11). The audit log is available through the API,
                so customer-operated tooling can retrieve records and transfer
                them to a different system or media. The customer must implement
                this retrieval and transfer to satisfy AU-4(1).
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
              remarks: >-
                The customer is responsible for operating the alternate storage
                system and for retrieving audit records and transferring them
                before the 90-day internal retention window expires. SSP authors
                must document the alternate storage system, transfer frequency,
                and the mechanism used to ensure no records are missed between
                retrieval cycles.
            - uuid: 979b82b2-3566-4c62-85c5-add4d6d4a226
              control-id: au-5
              description: >-
                An audit log entry is created before the requested operation
                runs. If the entry cannot be created, the request fails, so a
                request in audit scope is not carried out without an entry. If
                the outcome of an operation cannot be recorded, the operation
                still completes, and the entry is closed with a result of
                unknown after four hours.

                The Oxide Cloud Computer does not alert personnel to audit
                logging process failures: its alert mechanism delivers only
                liveness probe and power shelf power supply events, and no audit
                events are delivered as alerts. A failure to create an audit
                entry is visible to the API caller as a failed request. Failures
                in customer-operated export pipelines are the customer's
                responsibility to detect and respond to.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
                - href: https://docs.oxide.computer/guides/alerts/overview
                  text: "Oxide Docs: Alerts Overview"
                  rel: reference
              remarks: >-
                The customer is responsible for detecting audit processing
                failures in its own tooling (for example by watching for entries
                with result unknown and for API requests that fail), for
                monitoring its audit log export pipeline, and for responding
                when records are not being retrieved. Customers should track the
                completion timestamp of the last successfully exported entry as
                a cursor to detect gaps and resume exports without missing
                records.
            - uuid: 32c27e20-aa2c-4d46-a871-f0589818cdb2
              control-id: au-5.1
              description: >-
                The Oxide Cloud Computer provides no storage capacity warning
                for the audit log. Internal retention is defined by time, not
                capacity: entries are kept for 90 days from completion and then
                permanently deleted, and the period is not configurable. Because
                its alert mechanism delivers only liveness probe and power shelf
                power supply events, no alert is raised for audit log storage
                volume, and no warning is given when unexported records approach
                the end of the retention window.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
                - href: https://docs.oxide.computer/guides/alerts/overview
                  text: "Oxide Docs: Alerts Overview"
                  rel: reference
              remarks: >-
                The customer is responsible for keeping its export pipeline
                operating so that records are archived before the 90-day window
                expires, and for applying AU-5(1) capacity warnings to the
                external storage that holds the exported records. SSP authors
                should document the monitoring the customer uses to detect
                export pipeline failures.
            - uuid: 9f283bfe-6c76-465f-a895-46ca7c0a6ae0
              control-id: au-5.2
              description: >-
                The Oxide Cloud Computer does not provide real-time alerts for
                audit failure events: its alert mechanism delivers only liveness
                probe and power shelf power supply events, and no audit events
                are delivered as alerts. The component's handling of audit
                processing failures (see AU-5) occurs without notification, and
                no alert is raised when records approach the 90-day deletion
                point. Real-time alerting on audit processing failures,
                including those of customer export pipelines, is the customer's
                responsibility.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
                - href: https://docs.oxide.computer/guides/alerts/overview
                  text: "Oxide Docs: Alerts Overview"
                  rel: reference
              remarks: >-
                The customer is responsible for implementing real-time alerting
                on its audit log export pipeline: detecting when records fail to
                be retrieved, when the pipeline stalls, or when the gap between
                the last exported record and the current time approaches the
                90-day deletion threshold.
            - uuid: 48435561-ce7b-4e75-856d-fd99dd6754c7
              control-id: au-6.4
              description: >-
                The Oxide Cloud Computer records authenticated, state-changing
                requests to the external API, and login attempts, in a single
                fleet-level audit log whose entries all share the same
                structured, machine-readable fields (see AU-12 for scope and
                AU-3 for content). Read-only requests are not recorded, and
                entries have no resource identifier field and no request body.

                The log is read through the API, the CLI or the web console by
                holders of the fleet viewer role. There is no silo-scoped view
                and no filtering other than by time range. The rack does not
                push audit records; Oxide Computer Company publishes
                OpenTelemetry Collector receivers that collect the audit log
                from the API and export it to OpenTelemetry-compatible
                destinations.

                The component provides no native central review, analysis or
                reporting capability. Integration with a SIEM and the associated
                review and response processes are customer responsibilities.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
                - href: https://docs.oxide.computer/guides/integrations/opentelemetry
                  text: "Oxide Docs: OpenTelemetry Integration"
                  rel: reference
              remarks: >-
                The customer is responsible for configuring export of the audit
                log to its centralized review platform, implementing correlation
                rules and analysis workflows, and integrating audit review
                findings into its incident investigation and response processes.
            - uuid: eb8f99b7-9073-4eb5-84ee-2b4e6efa3853
              control-id: au-7
              description: >-
                The Oxide Cloud Computer provides no native audit record
                reduction or report generation capability. The audit log is
                available through the API in a structured, machine-readable
                format that supports customer-implemented reduction and
                reporting in a SIEM or log management system. The API offers no
                filtering other than by time range.

                Completed audit entries are immutable, and there is no API to
                modify or delete them. Retrieval does not alter the original
                records, so customer-implemented reduction and reporting operate
                on copies.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
              remarks: >-
                The customer is responsible for implementing audit record
                reduction and report generation in its SIEM or log management
                system.
            - uuid: 5a079c8e-07de-4a22-944c-1fdeac7166ee
              control-id: au-7.1
              description: >-
                Audit records are produced in a structured, machine-readable
                format with the same fields in every record (see AU-3), which
                supports sorting, searching and aggregation by customer-operated
                tooling. Records have no resource identifier field; the affected
                resource appears only in the request URI and operation ID.

                The Oxide Cloud Computer provides no native automatic processing
                of audit records, and the audit log API offers no filtering
                other than by time range. Selection and processing of events of
                interest are performed by the customer in its SIEM or log
                management system after export.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
              remarks: >-
                The customer is responsible for exporting records and performing
                the selection, sorting, searching, and processing of events of
                interest in its own SIEM or log management tooling.
                Customer-side responsibilities must be documented in the system
                SSP.
            - uuid: d066f573-a405-422d-96e2-83c14ed0de1e
              control-id: au-8
              description: >-
                The Oxide Cloud Computer control plane generates the time stamps
                in audit records from its system clock. Each audit log entry
                carries two: time_started and time_completed. Both are in
                Coordinated Universal Time (UTC) and are returned by the API as
                RFC 3339 date-time strings with fractional seconds and a "Z"
                (UTC) designator, for example 2025-08-12T00:03:45.439Z. The
                control plane includes an NTP service among its components.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: implemented
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
              statements:
                - statement-id: au-8_smt.a
                  uuid: dcbd4534-0fa6-42c8-af99-36d0d5a3f10c
                  description: >-
                    The control plane generates the time_started and
                    time_completed time stamps of each audit log entry from its
                    system clock. The control plane includes an NTP service
                    among its components.
                - statement-id: au-8_smt.b
                  uuid: 8d53f49f-d75b-4a9c-a910-06ee77d9c8ac
                  description: >-
                    Each audit log entry records time_started and
                    time_completed in UTC, as RFC 3339 date-time strings with
                    fractional seconds.
              remarks: >-
                SSP authors should compare the sub-second resolution of audit
                time stamps with the organization-defined granularity of time
                measurement for AU-8. The public sources this component
                definition relies on do not establish how closely control plane
                clocks are synchronized; see SC-45 and SC-45(1) for time
                synchronization.
            - uuid: 3319000a-fefc-443d-97cb-04c2bb6eb5ac
              control-id: au-9
              description: >-
                Reading the audit log through the API, the CLI or the web
                console requires the fleet viewer role. There is no silo-scoped
                view, and only a fleet admin can assign fleet roles. Completed
                entries are immutable: there is no API to modify or delete them.
                Entries are permanently deleted by the system 90 days after
                completion, and the period is not configurable.

                These protections are those of the external API. Audit records
                carry no cryptographic integrity protection (see AU-9(3)). Reads
                of the audit log are not themselves recorded in the audit log.
                The component does not alert on access to, or modification or
                deletion of, audit information: its alert mechanism does not
                deliver audit events. Audit information exported to
                customer-operated storage is outside the component's protection.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
                - href: "#2225a7e4-7713-4d6d-8640-9bf49222d9dd"
                  text: "Oxide Docs: Configuring Access (IAM)"
                  rel: reference
              remarks: >-
                The customer is responsible for protecting exported audit
                records in its external storage (access controls, integrity
                checks and retention protections), and for any alerting on
                unauthorized access to audit information. Customers should also
                ensure that fleet role assignments for audit log access follow
                least-privilege principles, including any silo created with a
                mapping that gives holders of its silo roles a fleet role.
            - uuid: 0ea12ccf-037b-43d3-a37a-3e08925b4b2e
              control-id: au-9.2
              description: >-
                The Oxide Cloud Computer stores audit records within the rack,
                on the same physical system that generates them, and provides no
                separate physical storage system for audit records. Storage on a
                physically separate system is the customer's responsibility,
                accomplished by exporting records to customer-operated external
                storage before the 90-day internal retention window expires.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
              remarks: >-
                The customer is responsible for exporting audit records to a
                physically separate storage system. The external system must be
                outside the rack's physical boundary to satisfy AU-9(2). Exports
                should be continuous so that records are on the separate system
                before the internal copies are deleted.
            - uuid: 953ef3f6-ed95-450f-a373-ce536b184847
              control-id: au-9.3
              description: >-
                The Oxide Cloud Computer does not apply cryptographic integrity
                protection (such as digital signatures or hash chains) to audit
                records. The audit log API is served over HTTPS, which protects
                records in transit to the client, and completed entries cannot
                be modified or deleted through the API, but neither is a
                cryptographic proof of record integrity. Organizations requiring
                cryptographic integrity assurance must apply it to exported
                records after retrieval.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
              remarks: >-
                Organizations with a requirement for cryptographic integrity
                proof of audit records must implement signing or hashing of
                exported records in their external storage pipeline.
            - uuid: 3b08f001-75c2-4a0a-83e7-96be175e6bdd
              control-id: au-10
              description: >-
                The Oxide Cloud Computer supports non-repudiation for
                authenticated, state-changing requests to the external API. Each
                such request is recorded in an audit log entry that identifies
                the authenticated actor and the credential used (see AU-3). The
                entry is created before the operation runs, the request fails if
                the entry cannot be created, and completed entries cannot be
                modified or deleted through the API.

                This support has the following limits. Entries are not
                cryptographically signed or otherwise cryptographically bound to
                the actor. Entries carry no request body, so they record that an
                actor performed an operation on the resource named in the
                request URI, but not the content of the change. Read-only
                requests are not recorded. Login attempt entries identify
                neither the user nor the session created, and self-logout is not
                recorded.

                Use of the setup and recovery interface, the support shell, and
                management network unlock at the technician ports is not
                recorded in the audit log (see AC-17 and AU-12). The setup and
                recovery interface requires no credential, so actions taken
                through it are not attributable to an individual by the
                component. The support shell accepts only keys held on Oxide support
                hardware tokens (see AC-17 for management network unlock); Oxide Computer Company
                states that each token is assigned to a named support person.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
              remarks: >-
                The customer is responsible for controlling physical access to
                the technician ports and network access to any jumpbox or other
                host cabled to them, for keeping its own record of who is
                granted that access and of each Oxide support session, for
                retaining exported audit records, and for any stronger
                non-repudiation mechanism it requires (for example signing of
                exported records). SSP authors should document these limitations
                and assess residual risk in the context of their authorization
                boundary.
            - uuid: a87776ec-d57d-40bb-a52b-99ccfe77dd9c
              control-id: au-11
              description: >-
                The Oxide Cloud Computer retains audit records on the rack for
                90 days from completion of each entry and then permanently
                deletes them. The period cannot be changed through the API, CLI
                or console. The rack does not push audit records. Retention
                beyond 90 days can be met only by the customer fetching records
                through the API at a regular interval and archiving them in
                external storage; Oxide Computer Company publishes OpenTelemetry
                Collector receivers that collect the audit log from the API for
                this purpose.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
                - href: https://docs.oxide.computer/guides/integrations/opentelemetry
                  text: "Oxide Docs: OpenTelemetry Integration"
                  rel: reference
              remarks: >-
                The customer is responsible for any retention period longer than
                90 days, which must be met by fetching entries at a regular
                interval and storing them in customer-operated external storage.
                SSP authors must document the organization-defined retention
                period, the export mechanism used, the archival storage system,
                and procedures to ensure no records are lost between retrieval
                cycles before the 90-day on-rack window elapses.
            - uuid: 0ac9346e-fc29-4ec1-ab8b-d645f1ac97a4
              control-id: au-12
              description: >-
                The Oxide Cloud Computer records an audit log entry for
                authenticated, state-changing requests to the external API, and
                login attempts (local and SAML), for both successes and failures
                (including authorization denials). Requests made through the
                REST API, CLI, SDKs or web console all reach the same external
                API and are recorded on the same terms. The entry is created
                before the operation runs, and the request fails if the entry
                cannot be created. Record content is described in AU-3.

                The component provides no setting for selecting which event
                types are audited, so designated personnel cannot choose which
                events are logged.

                The following are not recorded in the audit log. Read-only (GET)
                requests: all reads, including denied reads, reads of the audit
                log itself, serial console access and support bundle downloads.
                Chunk uploads during disk import (the surrounding start, stop
                and finalize calls are audited) and read-only timeseries queries
                sent by POST. Self-logout, and the unauthenticated
                device-authorization steps. Requests rejected at authentication
                (missing, invalid or expired credentials), other than login
                attempts. Session and token expiry. The internal APIs between
                control plane services. Login attempt entries identify neither
                the user nor the session created.

                Three paths at the technician ports do not pass through the
                external API and are not recorded in the audit log: use of the
                setup and recovery interface (including offline update, power
                control and rack setup), Oxide support shell sessions, and
                management network unlock and re-lock. API requests made through
                the technician ports are audited like any other API request. See
                AC-17 for these paths, and AC-6(9).
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
              remarks: >-
                SSP authors should review the list of unaudited requests and
                paths against the events required by their AU-2 event selection,
                and supplement them where required (for example with identity
                provider logs for login identity). The customer is responsible
                for controlling physical access to the technician ports and
                network access to any jumpbox or other host cabled to them, for
                keeping its own record of technician port access and of each
                Oxide support session, and for fetching audit entries through
                the API for external retention and review. Customer-side
                responsibilities must be documented in the system SSP.
            - uuid: 248b21a6-278d-4851-a598-4b0082e35bc0
              control-id: au-12.1
              description: >-
                The Oxide Cloud Computer records authenticated, state-changing
                requests to the external API, and login attempts, in a single
                fleet-level audit log, regardless of which silo, project or rack
                resource the request affects. All entries share the same fields,
                including start and completion time stamps generated by the
                control plane in UTC (see AU-8), which supports ordering and
                time correlation of entries within the log.

                The audit log is not a trail of every system component. It does
                not include read-only requests, the internal APIs between
                control plane services, or the technician port paths that do not
                pass through the external API (see AU-12). Service logs written
                by control plane components are internal diagnostics and are not
                part of the audit log. The public sources this component
                definition relies on do not establish how closely control plane
                clocks are synchronized.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
              remarks: >-
                The customer is responsible for confirming the clock
                synchronization tolerance with Oxide Computer Company where an
                organization-defined time correlation tolerance must be
                assessed, for correlating the exported audit log with records
                from its other systems, and for keeping its own record of
                technician port access. Customer-side responsibilities must be
                documented in the system SSP.
            - uuid: ab7ccaec-ae5d-4d14-a128-f3401bd91936
              control-id: au-12.3
              description: >-
                The Oxide Cloud Computer does not provide a capability for
                designated personnel to change which events are logged. Audit
                record generation is automatic for authenticated, state-changing
                requests to the external API, and login attempts, with the
                exceptions described under AU-12; the component provides no
                setting to add or remove event types, adjust logging verbosity,
                or change logging for specific operations or components.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
              remarks: >-
                SSP authors should document this and assess whether their
                authorization requires the ability to change logging. If it
                does, that capability must be implemented at the SIEM layer on
                exported records; filtering at that layer cannot add events that
                the component does not record.
            - uuid: 5e102330-3405-4014-9bb4-3c3f5f727728
              control-id: au-14
              description: >-
                The Oxide Cloud Computer does not record or capture the content
                of user sessions. What it provides toward session audit is the
                audit log: each entry for an authenticated, state-changing
                request to the external API carries the authentication method
                and the credential ID used, so the state-changing requests made
                with one console session or token can be reconstructed by
                selecting entries on that field. The audit log API filters only
                by time range, so this selection is done in customer tooling.

                The reconstruction is limited to what the audit log records (see
                AU-12 and AU-3). Read-only requests, including serial console
                access, are not recorded, so what a user viewed in a session is
                not captured. Entries have no request body, so the content of a
                change is not recorded. Login attempt entries identify neither
                the user nor the session created, and self-logout and session
                and token expiry are not recorded, so the start and end of a
                session do not appear as entries tied to its credential ID.

                Use of the setup and recovery interface, the support shell, and
                management network unlock at the technician ports is not
                recorded in the audit log (see AC-17).
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
              remarks: >-
                The customer is responsible for exporting the audit log,
                selecting entries by credential ID in its own tooling, and
                implementing any session content capture its authorization
                requires (for example within guest operating systems or at its
                identity provider). The unaudited technician port paths are
                addressed under AU-12 and AC-6(9). Customer-side
                responsibilities must be documented in the system SSP.
            - uuid: 737fe13e-515d-419a-9b61-32105ee70014
              control-id: au-14.1
              description: >-
                Audit entry creation is part of request handling in the external
                API and requires no manual initialization or administrator
                action. The entry for an authenticated, state-changing request
                is created before the operation runs, and the request fails if
                the entry cannot be created, so such a request is not carried
                out without an audit entry at any point after the control plane
                begins serving the API.

                This applies only within the session audit scope described under
                AU-14. Session content is not captured, and read-only requests
                and the technician port paths that do not pass through the API
                are not recorded at any time.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
              remarks: >-
                SSP authors should document this scope in the system SSP.
            - uuid: 96dc204d-64fb-41e6-9aab-dc83a5f09ba0
              control-id: au-14.3
              description: >-
                The Oxide Cloud Computer does not provide a capability to
                remotely view or hear the content of an established user
                session. The nearest support is the audit log: holders of the
                fleet viewer role can fetch entries and select those carrying a
                given credential ID to see the authenticated, state-changing
                requests made in that session (see AU-14). The audit log API
                filters only by time range, so that selection is done in
                customer tooling.

                Near-real-time monitoring is possible by continuously polling
                the audit log API; there is no push-based streaming interface,
                and entries become visible only once complete. Read-only
                requests, including serial console access, are not recorded, and
                entries carry no request body, so what a user views and the
                content of changes do not appear. Sessions on the setup and
                recovery interface and the support shell at the technician ports
                are not recorded in the audit log.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
              remarks: >-
                The customer is responsible for implementing any tooling
                required to continuously poll and present session activity from
                the audit log API, and for any session content viewing
                capability its authorization requires.
            - uuid: 906eca24-0a9e-4621-88b4-eaa8bf50ab39
              control-id: ca-3.6
              description: >-
                The Oxide Cloud Computer supports verifying authorization for
                data transfers between interconnected systems as follows. For
                the API and console, the control plane enforces role-based
                access control on each request, and silo admins control which
                users and groups hold roles within their silo. A single
                fleet-wide source-address allow-list restricts which network
                sources can reach the API and console; it is not per silo and
                its default is any address.

                For guest workloads, customer-defined VPC firewall rules permit
                or deny traffic between instances and external systems. By
                default inbound traffic to an instance is denied and outbound
                traffic is allowed; a new VPC starts with rules that allow
                inbound traffic from within the VPC, and SSH and ICMP from any
                source.

                For connections to the vendor: the Oxide Cloud Computer has no
                phone-home feature and no background process that exports data
                outside the rack, and it makes no connection back to Oxide
                Computer Company. Oxide Computer Company states that it has no
                standing access to customer environments, that it can reach a
                rack only through access the customer provides, and that it does
                not perform maintenance without a customer-initiated support
                engagement. For a remote support session, the customer grants
                access through a customer-provided jumpbox cabled to the
                technician ports and terminates it afterwards (see AC-17).

                The component does not manage the organization's external
                network boundary or connections between the rack and external
                systems.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#2225a7e4-7713-4d6d-8640-9bf49222d9dd"
                  text: "Oxide Docs: Configuring Access (IAM)"
                  rel: reference
                - href: "#b557fdcb-ae3c-41e4-8cd4-e849a911017d"
                  text: "Oxide Docs: Configuring Guest Networking"
                  rel: reference
              remarks: >-
                The customer is responsible for defining information exchange
                policies for interconnections involving the rack, configuring
                role assignments, the API allow-list and VPC firewall rules to
                enforce those policies (including reviewing the default VPC
                rules that admit SSH and ICMP from any source), and documenting
                interconnection agreements in its SSP as required by CA-3. The
                customer is also responsible for granting and terminating
                jumpbox and network access for each Oxide support session,
                keeping its own record of that access, and controlling physical
                access to the technician ports and network access to any host
                cabled to them. Customer-side responsibilities must be
                documented in the system SSP.
            - uuid: 78552a53-ba23-4760-9288-60dfe57ea677
              control-id: ca-7
              description: >-
                The Oxide Cloud Computer provides data sources that support a
                customer's continuous monitoring program. Oxide Computer Company
                does not operate a continuous monitoring program on the
                customer's behalf.

                The audit log records authenticated, state-changing requests to
                the external API, and login attempts, in structured, exportable
                records. Read-only requests are not recorded, and use of the
                setup and recovery interface, the support shell and management
                network unlock at the technician ports is not recorded (see
                AU-12). The rack does not push audit records, and its alert
                mechanism delivers only liveness probe and power shelf power
                supply events, so ongoing visibility depends on the customer
                fetching the log into its own tooling.

                The control plane's metrics service collects system health and
                resource utilization telemetry that customers can query through
                the API. Telemetry is kept for 30 days, with no customer setting
                to change that.

                The principal Oxide-authored components are published as open
                source, which supports independent review; the host image build
                also draws on a small number of non-public inputs, including
                third-party binary firmware.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
                - href: "#b66735eb-7655-4511-adf0-84616eb41209"
                  text: "Oxide Docs: Metrics OxQL Tutorial"
                  rel: reference
                - href: https://docs.oxide.computer/guides/alerts/overview
                  text: "Oxide Docs: Alerts Overview"
                  rel: reference
              remarks: >-
                The customer is responsible for developing a continuous
                monitoring strategy, defining monitoring frequencies, and
                implementing the monitoring program. This includes configuring
                audit log export to a SIEM, defining detection rules, scheduling
                security control assessments, and documenting monitoring results
                as required by CA-7.
            - uuid: ca811609-bf75-4abe-943a-0f81c99c361d
              control-id: ca-7.4
              description: >-
                The Oxide Cloud Computer does not perform risk monitoring or
                generate risk-based alerts on the customer's behalf; its alert
                mechanism does not deliver audit, account or authentication
                events. It provides two data sources the customer can use.

                The audit log records authenticated, state-changing requests to
                the external API, and login attempts (including role and policy
                changes, resource creation and deletion, and configuration
                changes), in structured, exportable records that support
                customer-defined change monitoring and alerting in a SIEM.
                Read-only requests and the technician port paths that do not
                pass through the API are not recorded, and entries do not record
                the content of a change (see AU-12 and AU-3).

                The control plane's metrics service provides infrastructure
                telemetry, kept for 30 days, that the customer can query through
                the API.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
                - href: "#b66735eb-7655-4511-adf0-84616eb41209"
                  text: "Oxide Docs: Metrics OxQL Tutorial"
                  rel: reference
              remarks: >-
                The customer is responsible for defining which events and
                conditions are risk-relevant, configuring detection rules in its
                SIEM against the audit log, and establishing response procedures
                for risk-based alerts.
            - uuid: 8fd91f64-42cf-4fdb-9ac4-04261495aab6
              control-id: cm-3
              description: >-
                System software and firmware changes are applied as release
                update bundles through the software update mechanism (see
                SI-2). Update operations are restricted to the fleet admin
                role. Setting the target release starts the update; the system
                has no separate approval step, and the API has no operation to
                abort, pause or roll back an update. The documented recovery
                from a failed update is an offline update performed by Oxide
                Support.

                Customer configuration changes (role policies, Silo settings,
                VPC firewall rules) are made through the same API under
                role-based authorization. Update operations and configuration
                changes are authenticated, state-changing requests to the
                external API and are recorded in the audit log with the actor,
                time, operation and result. The record does not contain the
                content of a change, and entries are kept on the rack for 90
                days.

                Offline update through the setup and recovery interface at the
                technician ports requires no credential and is not recorded in
                the audit log (see AC-17). The Oxide Cloud Computer provides no
                change approval workflow, approval tracking or deviation
                documentation.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#eeb24ebd-edc5-47ec-8545-4272f16bbfc9"
                  text: "Oxide Docs: System Update"
                  rel: reference
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
              remarks: >-
                The customer is responsible for approving each update under
                its change control process before the target release is set,
                restricting the fleet admin role, validating the SHA checksum
                of each bundle against the value provided by Oxide Support
                before adding the bundle's trust root to the rack (see SI-2),
                removing trust roots that are no longer needed, and controlling
                physical and network access to the technician ports. The
                customer also defines which changes are
                configuration-controlled, documents change decisions and
                justifications, and retains change records for the
                organization-defined period in its own process; audit entries
                must be collected off the rack to be kept beyond 90 days.
            - uuid: 15e1fab0-c6b8-400e-bb84-85b7ed40b39b
              control-id: cm-5
              description: >-
                The Oxide Cloud Computer enforces logical access restrictions
                on changes made through its API using roles assigned on the
                fleet, a Silo, or a project. System updates and assignment of
                fleet roles require the fleet admin role. Changes to a Silo's
                configuration, identity provider settings and role policy
                require the silo admin role or the fleet admin role. Changes to
                project resources require a project role that permits them;
                viewer roles are read-only. These changes are authenticated,
                state-changing requests to the external API and are recorded
                in the audit log for both successes and failures, including
                authorization denials.

                The API is not the only path by which system software can be
                changed. The setup and recovery interface at the technician
                ports requires no credential and can update and power-control
                rack components. The support shell at the same ports accepts
                only keys held on Oxide support hardware tokens. Use of either
                is not recorded in the audit log (see AC-17). The access
                restriction for the setup and recovery interface is the
                customer's control of physical access to the technician ports
                and of network access to anything cabled to them.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#2225a7e4-7713-4d6d-8640-9bf49222d9dd"
                  text: "Oxide Docs: Configuring Access (IAM)"
                  rel: reference
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
              remarks: >-
                The customer is responsible for defining which personnel hold
                roles at each scope (in particular the fleet admin role, which
                can run system updates), documenting the access restrictions
                in its configuration management process, and establishing
                approval procedures for changes consistent with its CM policy.
                The customer is responsible for controlling physical access to
                the technician ports and network access to any jumpbox or
                other host cabled to them. Customer-side responsibilities must
                be documented in the system SSP.
            - uuid: 0e003229-25bc-435c-bb6f-2a268446ff0c
              control-id: cm-5.1
              description: >-
                For changes requested through its API, the Oxide Cloud Computer
                enforces access restrictions automatically and generates audit
                records of authenticated, state-changing requests without
                manual intervention. This automation does not extend to the
                setup and recovery interface at the technician ports, which
                has no logical access control and is not audit-logged (see
                AC-17).
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#2225a7e4-7713-4d6d-8640-9bf49222d9dd"
                  text: "Oxide Docs: Configuring Access (IAM)"
                  rel: reference
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
              statements:
                - statement-id: cm-5.1_smt.a
                  uuid: 4507cc39-ef90-4d7b-bdaa-56087c0730d7
                  description: >-
                    The control plane evaluates each API request that changes
                    configuration against the caller's role assignments and
                    denies requests that do not meet them, without human
                    review. The setup and recovery interface at the technician
                    ports is outside this enforcement: it requires no
                    credential and can update and power-control rack
                    components. Its safeguard is the customer's control of
                    physical access to the technician ports and network access
                    to anything cabled to them.
                - statement-id: cm-5.1_smt.b
                  uuid: 834264cf-af21-45fc-a246-3104d27f28d8
                  description: >-
                    Each authenticated, state-changing request to the external
                    API generates an audit record whether it succeeds or fails,
                    including authorization denials. The record identifies the
                    actor, time, operation and result; it does not contain the
                    content of the change (see AU-3). Read-only requests and
                    requests rejected at authentication are not recorded. Use
                    of the setup and recovery interface and the support shell
                    at the technician ports, and management network unlock,
                    are not recorded.
              remarks: >-
                The customer is responsible for controlling physical access to
                the technician ports and network access to any host cabled to
                them, which is the only safeguard for the setup and recovery
                interface, and for keeping its own record of technician port
                use. The customer is also responsible for fetching audit
                entries through the API before the 90-day on-rack retention
                period ends and for reviewing them in its own tooling.
            - uuid: a887d9fe-339b-494a-8733-7e7e7a66c9ad
              control-id: cm-6
              description: >-
                Oxide Computer Company ships each release's system software and
                firmware as one update bundle. Customer configuration of the
                Oxide Cloud Computer is managed through the API, after an
                initial rack setup performed through the setup and recovery
                interface at the technician ports. Configuration changes made
                through the API are authenticated, state-changing requests and
                are recorded in the audit log; the content of a change is not
                recorded.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#2225a7e4-7713-4d6d-8640-9bf49222d9dd"
                  text: "Oxide Docs: Configuring Access (IAM)"
                  rel: reference
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
              statements:
                - statement-id: cm-6_smt.a
                  uuid: bcbd5492-f156-47d1-89c7-2aea4320aca6
                  description: >-
                    The rack runs a defined software and firmware
                    configuration for each release. Shipped defaults that bear
                    on configuration settings include: a new VPC's default
                    firewall rules admit SSH and ICMP from any source, the API
                    source-address allow-list defaults to "any", and device
                    access tokens do not expire by default. The customer is
                    responsible for documenting this baseline configuration in
                    its SSP and for any additional configuration settings
                    applied through the API.
                - statement-id: cm-6_smt.b
                  uuid: fba00cc6-72b3-4c18-8d51-dd0a9b7b743b
                  description: >-
                    The system software and firmware configuration for a
                    release is installed through the update mechanism (see
                    SI-2). Customer-applied configuration settings (such as
                    role policies, network topology, and Silo settings) are
                    implemented through the API.
                - statement-id: cm-6_smt.c
                  uuid: 49e30d44-1e8d-4d83-a285-f5108a3fec18
                  description: >-
                    The Oxide Cloud Computer has no mechanism for tracking
                    approved deviations from the configuration baseline.
                    Identifying, documenting, and approving deviations is the
                    customer's responsibility, managed through its
                    configuration management process.
                - statement-id: cm-6_smt.d
                  uuid: 6ae9dd7f-0179-4755-9832-e1d23f390e0e
                  description: >-
                    Configuration changes made through the API can be monitored
                    through the audit log, which records the actor, time,
                    operation and result of each change but not its content.
                    Entries are kept for 90 days. Current configuration state
                    can be queried through the API for comparison with the
                    documented baseline.
              remarks: >-
                The customer is responsible for documenting the baseline
                configuration in its SSP, including the shipped defaults it
                must review (default VPC firewall rules that admit SSH and
                ICMP from any source, an API allow-list that defaults to
                "any", and device tokens that do not expire by default),
                applying and managing additional configuration settings
                through the API, defining and approving any deviations from
                baseline, and monitoring configuration changes through the
                audit log, which the customer must fetch and store externally
                to keep beyond 90 days.
            - uuid: aa8b1d9e-8d62-4793-bbb8-d05651079505
              control-id: cm-7
              description: >-
                The Oxide Cloud Computer limits the functions, ports, protocols
                and services it exposes at the firmware, the external API, the
                technician ports and the guest network, as described in the
                statements below.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#b557fdcb-ae3c-41e4-8cd4-e849a911017d"
                  text: "Oxide Docs: Configuring Guest Networking"
                  rel: reference
              statements:
                - statement-id: cm-7_smt.a
                  uuid: 125794f5-c105-48c3-bcc2-b8f0cb59529c
                  description: >-
                    No BIOS or UEFI firmware runs on the host x86 cores;
                    Oxide-authored software performs platform initialization.
                    AMD-supplied processor firmware runs before any Oxide code
                    on the host CPU, and other third-party firmware such as
                    NIC firmware is present in the host image. The service
                    processor is a microcontroller that runs a set of firmware
                    tasks fixed at build time, not a general-purpose baseboard
                    management controller software stack. The API and web
                    console listen only on HTTPS; there is no plaintext HTTP
                    listener. Each switch's technician ports additionally
                    expose a setup and recovery interface that requires no
                    credential, a support shell that accepts only keys held on
                    Oxide support hardware tokens, and a proxy to the same
                    HTTPS API (see AC-17). No other account can log in over
                    SSH at those ports.
                - statement-id: cm-7_smt.b
                  uuid: 8c0c1778-d494-4cc0-b0d3-6073f8e85f91
                  description: >-
                    Network access to and from guest instances is restricted
                    by VPC firewall rules enforced in the host OS on each
                    sled. Each instance network interface denies inbound and
                    allows outbound traffic by default, but a new VPC starts
                    with rules that allow inbound traffic from within the VPC,
                    and SSH and ICMP from any source. Access to the API and
                    web console can be restricted by one fleet-wide
                    source-address allow-list, which defaults to "any".
              remarks: >-
                The customer is responsible for configuring VPC firewall rules
                to restrict guest workload network access to only the
                protocols and ports required by its applications, including
                reviewing the default rules in each new VPC, which admit SSH
                and ICMP from any source; for setting the API source-address
                allow-list; and for controlling physical access to the
                technician ports and network access to anything cabled to
                them.
            - uuid: 32f86994-a983-4153-a41b-00d801694fc3
              control-id: cm-7.1
              description: >-
                Current VPC firewall rules, role assignments, Silo settings
                and network configuration can be retrieved through the API,
                which supports customer-conducted reviews against the
                documented baseline. The audit log shows what has changed
                (actor, time, operation and result, but not the content of a
                change), with entries kept on the rack for 90 days.

                The Oxide Cloud Computer does not perform periodic reviews or
                identify unnecessary functions, ports, protocols or services.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: https://docs.oxide.computer/api/vpc_firewall_rules_view
                  text: "Oxide API: vpc_firewall_rules_view"
                  rel: reference
                - href: https://docs.oxide.computer/api/vpc_firewall_rules_update
                  text: "Oxide API: vpc_firewall_rules_update"
                  rel: reference
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
              remarks: >-
                The customer is responsible for establishing a periodic review
                schedule, querying current configuration state through the
                API, comparing it against the documented least-functionality
                baseline, and disabling or removing any functions, ports,
                protocols, or services no longer required. Reviews should
                include the default firewall rules of each VPC, which admit
                SSH and ICMP from any source. A review period longer than 90
                days depends on the customer fetching audit entries and
                storing them externally.
            - uuid: 1e8a4ae8-8872-4081-86bf-54b99bec6a61
              control-id: cm-7.2
              description: >-
                Role-based authorization restricts which users can create and
                start instances; users holding only viewer roles cannot. Each
                instance runs under hardware virtualization that confines it
                to its own memory, and its virtual machine monitor runs as a
                separate process in its own OS zone with access only to that
                instance's devices and local disk volumes. Nested
                virtualization is not supported.

                The Oxide Cloud Computer does not control which programs
                execute inside guest operating systems. Preventing
                unauthorized software execution inside an instance is the
                responsibility of the tenant operating it.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#2225a7e4-7713-4d6d-8640-9bf49222d9dd"
                  text: "Oxide Docs: Configuring Access (IAM)"
                  rel: reference
              remarks: >-
                The customer is responsible for controlling program execution
                within its guest instances using guest OS mechanisms such as
                application allowlisting, mandatory access control, or
                execution prevention policies.
            - uuid: 5380403f-9288-45ad-97b3-0c037ae5bc6f
              control-id: cm-7.5
              description: >-
                The software authorized to run on the Oxide Cloud Computer's
                control plane and firmware components is the set delivered in
                a release's update bundle. Enforcement of that set differs by
                component (see SI-7 for boot integrity and SI-2 for update).
                Root of trust firmware must carry a valid signature to
                execute. Service processor firmware is not signature-verified
                at update or boot; the root of trust measures it for
                attestation and does not prevent it from booting. Firmware
                images contain a fixed set of tasks, which cannot be created
                or individually updated at run time. Host OS and control plane
                software are installed through the update mechanism, which
                for API-driven updates verifies repository signatures once at
                upload and checks artifacts by hash at installation. The host
                boot loader does not verify the kernel it loads, and this
                narrative makes no claim that the host OS is verified or
                measured at boot.

                Offline update through the setup and recovery interface at the
                technician ports requires no credential and does not consult
                the rack's update trust store (see AC-17).

                Software execution within guest instances is outside this
                boundary. The customer determines what operating systems and
                applications run inside its instances.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#eeb24ebd-edc5-47ec-8545-4272f16bbfc9"
                  text: "Oxide Docs: System Update"
                  rel: reference
              remarks: >-
                The customer is responsible for validating the SHA checksum of
                each bundle against the value provided by Oxide Support, which
                is the only step that ties the bundle to Oxide Computer
                Company, and for controlling physical and network access to
                the technician ports. The customer is responsible for
                implementing authorized software controls within its guest
                instances using guest OS mechanisms such as application
                allowlisting, mandatory access control, or execution
                prevention policies.
            - uuid: 9f0354a4-2ae3-469a-9570-c605a4affbe1
              control-id: cm-14
              description: >-
                Signature verification of the software and firmware installed
                on the Oxide Cloud Computer differs by component (see SI-7 for
                boot integrity, SI-2 for the update process and SC-17 for the
                vendor PKI).

                Root of trust firmware and its bootloader are signed under
                Oxide Computer Company's code-signing PKI, and the root of
                trust verifies that signature at boot; an image that fails is
                not booted.

                No signature on service processor firmware is verified at
                update or boot. The root of trust measures it for attestation
                and does not prevent it from booting.

                For service processor firmware, the host OS and control plane
                software, no signature under a persistent Oxide Computer
                Company key is verified. An update bundle's metadata is signed
                with a key generated for that build, and the trust root the
                operator adds to the rack is taken from the bundle itself. For
                updates driven through the API, the control plane verifies
                those signatures once, at upload, and afterwards checks each
                artifact by hash. The signature therefore shows that a bundle
                is consistent with the root shipped inside it, not that it
                came from Oxide Computer Company; the operator's comparison of
                the bundle checksum with the value provided by Oxide Support
                is the only step that ties a bundle to Oxide Computer Company.
                A process to sign release builds, with a PKI and trust policy,
                is identified as future work in the release engineering
                documentation.

                The host boot loader does not verify the kernel it loads, and
                this narrative makes no claim that the host OS is verified or
                measured at boot. Offline update at the technician ports
                requires no credential and does not check the repository
                against the rack's trust store (see AC-17); root of trust
                boot-time signature verification still applies on that path.
                SSD firmware is not included in update bundles. Software
                inside customer instances is outside Oxide Computer Company's
                signing scope.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#eeb24ebd-edc5-47ec-8545-4272f16bbfc9"
                  text: "Oxide Docs: System Update"
                  rel: reference
                - href: https://github.com/oxidecomputer/omicron/blob/rel/v23/docs/releng.adoc
                  text: "Omicron: release engineering documentation"
                  rel: reference
              remarks: >-
                The customer is responsible for validating the SHA checksum of
                each bundle against the value provided by Oxide Support before
                adding the bundle's trust root to the rack, controlling
                physical and network access to the technician ports,
                restricting the fleet admin role, removing trust roots that
                are no longer needed, and documenting this procedure in the
                system SSP. Whether root of trust or service processor
                firmware enforces anti-rollback is not established in public
                sources; customers for whom this matters should confirm it
                with Oxide Computer Company.
            - uuid: dac644ce-964d-4c93-8257-5c20330e5b07
              control-id: ia-2
              description: >-
                Control plane users. Operations on resources through the API
                and web console require an authenticated principal. Users
                authenticate with a username and password in local-only
                Silos, or through the customer's SAML 2.0 identity provider in
                SAML Silos; a Silo's identity mode is fixed at creation. Each
                user has an identity unique within their Silo. After
                authentication, requests carry a web console session or a
                device access token (CLI and SDKs); the customer's identity
                provider uses a SCIM bearer token for provisioning. The
                built-in `recovery` Silo and its fleet admin user are
                local-only. The Oxide Cloud Computer has no built-in
                multi-factor authentication; for SAML Silos, MFA is whatever
                the customer's identity provider enforces.

                Technician ports. The setup and recovery interface performs no
                identification or authentication. The support shell accepts
                only keys held on hardware tokens used by Oxide support, and
                Oxide Computer Company states that on every customer rack as
                shipped, unlocking direct access to the management network
                requires one of the same keys. The API proxy uses the
                customer's ordinary API credentials. Use of the setup and
                recovery interface, the support shell and unlock is not
                recorded in the audit log (see AC-17).
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#2225a7e4-7713-4d6d-8640-9bf49222d9dd"
                  text: "Oxide Docs: Configuring Access (IAM)"
                  rel: reference
                - href: "#496d895e-fd77-4f15-9020-22a2b19e380c"
                  text: "Oxide Docs: Identity Providers (SAML, SCIM)"
                  rel: reference
              remarks: >-
                The customer is responsible for choosing each Silo's identity
                mode at creation (local or SAML), integrating its identity
                provider for SAML Silos, and managing user accounts and
                credentials, including the local `recovery` Silo fleet admin
                account. The customer is responsible for controlling physical
                access to the technician ports and network access to any
                jumpbox or other host cabled to them, for granting and
                terminating jumpbox and network access for each Oxide support
                session, for keeping its own record of that access, and for
                documenting the technician port access model in the system
                SSP.
            - uuid: 3c15646e-cc8e-45b9-ac24-fbc9aff0bd31
              control-id: ia-2.1
              description: >-
                The Oxide Cloud Computer has no built-in multi-factor
                authentication for control plane accounts, privileged or
                otherwise. For SAML Silos, MFA is whatever the customer's
                identity provider enforces before it issues the SAML
                assertion. Local-only Silos authenticate with username and
                password only; this includes the built-in `recovery` Silo and
                its fleet admin user, which is a privileged account.

                Oxide support access at the technician ports is a separate
                population. The support shell uses keys held on hardware tokens from which the private keys
                cannot be extracted; Oxide Computer Company states that a PIN
                is required to use a key. The setup and recovery interface at
                the technician ports requires no credential at all (see
                AC-17).
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#496d895e-fd77-4f15-9020-22a2b19e380c"
                  text: "Oxide Docs: Identity Providers (SAML, SCIM)"
                  rel: reference
              remarks: >-
                For SAML Silos, the customer must configure MFA enforcement at
                its identity provider for all privileged accounts. Local-only
                Silos, including the `recovery` Silo's fleet admin user, are
                password only; the customer is responsible for restricting
                use of local accounts and applying compensating procedures.
                The customer is responsible for controlling physical access to
                the technician ports and network access to anything cabled to
                them.
            - uuid: 606d7166-dd41-4e71-9078-64f7d05b73d2
              control-id: ia-2.2
              description: >-
                The Oxide Cloud Computer has no built-in multi-factor
                authentication. For SAML Silos, MFA for non-privileged
                accounts is whatever the customer's identity provider enforces
                before it issues the SAML assertion. Local-only Silos
                (username and password) have no second authentication factor.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#496d895e-fd77-4f15-9020-22a2b19e380c"
                  text: "Oxide Docs: Identity Providers (SAML, SCIM)"
                  rel: reference
              remarks: >-
                For SAML Silos, the customer must configure MFA enforcement at
                its identity provider for all users, including non-privileged
                accounts. Customers with this requirement should use SAML
                federation with an MFA-capable identity provider rather than
                local-only Silos; a Silo's identity mode is fixed at creation.
            - uuid: f115d0a5-3d2b-42b0-8ea7-b22c1fc79500
              control-id: ia-2.5
              description: >-
                Control plane access through the API and web console is
                authenticated per user. Every user has their own identity
                within their Silo and authenticates with their own
                credentials, and console sessions and device access tokens
                are issued to the authenticated user. SCIM bearer tokens are
                credentials of the customer's identity provider and do not
                identify an individual user.

                Two shared accounts exist at the switch technician ports (see
                AC-17). The account for the setup and recovery interface
                requires no key or password, so its users are not
                individually authenticated. The support shell account is a
                single account used by Oxide support; it accepts only keys
                held on hardware tokens, and Oxide Computer Company states
                that each token is assigned to a named support person.
                Sessions on either account are not recorded in the audit log.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#2225a7e4-7713-4d6d-8640-9bf49222d9dd"
                  text: "Oxide Docs: Configuring Access (IAM)"
                  rel: reference
              remarks: >-
                The customer is responsible for not sharing local accounts
                (including the `recovery` Silo fleet admin account) among
                individuals, for controlling physical access to the
                technician ports and network access to anything cabled to
                them, and for keeping its own record of who uses the
                technician ports.
            - uuid: 59f0339e-8275-493a-b146-307d9628619b
              control-id: ia-2.6
              description: >-
                The Oxide Cloud Computer has no built-in multi-factor
                authentication for control plane users, so it provides no
                separate-device factor of its own for them. For SAML Silos,
                any second factor, and whether it is implemented on a device
                separate from the system being accessed, is determined by the
                customer's identity provider. Local-only Silos, including the
                built-in `recovery` Silo, have no second authentication factor
                and no separate-device authenticator.

                For Oxide support access at the technician ports, the support
                shell uses keys held on hardware
                tokens, which are devices separate from the rack and from
                which the private keys cannot be extracted. Oxide Computer
                Company states that a PIN is required to use a key. The setup
                and recovery interface at the technician ports requires no
                credential (see AC-17).
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#496d895e-fd77-4f15-9020-22a2b19e380c"
                  text: "Oxide Docs: Identity Providers"
                  rel: reference
              remarks: >-
                The customer is responsible for configuring MFA at the
                identity provider for SAML Silos and ensuring the
                authenticator used meets the separate-device requirement.
                Customers with this requirement must use SAML federation with
                an MFA-capable identity provider and restrict use of local
                accounts. The hardware tokens used for Oxide support access
                are managed by Oxide Computer Company; assessors should
                evaluate that mechanism, and the credential-free setup and
                recovery interface, against their requirements.
            - uuid: 13206cd2-a42c-40f8-8907-53eece8798f6
              control-id: ia-2.8
              description: >-
                All API and web console authentication traffic is carried over
                TLS, which protects authentication exchanges against capture
                and replay in transit. There is no plaintext HTTP listener.

                For SAML Silos, the Oxide Cloud Computer does not track
                previously used assertion IDs, so a captured, unexpired SAML
                assertion can be replayed. This is tracked as an open issue.

                At the technician ports, the support shell authenticates by
                public key with keys held on hardware tokens, and management
                network unlock uses a single-use, short-lived random
                challenge. The setup and recovery interface performs no
                authentication (see AC-17).
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#496d895e-fd77-4f15-9020-22a2b19e380c"
                  text: "Oxide Docs: Identity Providers (SAML, SCIM)"
                  rel: reference
                - href: "https://github.com/oxidecomputer/omicron/issues/7820"
                  text: "omicron#7820: Prevent SAML replay attacks by tracking
                    used assertion IDs"
                  rel: reference
              remarks: >-
                Customers relying on SAML authentication should configure
                short assertion validity windows at their identity provider
                as a compensating measure, because assertion-level replay
                resistance is not enforced by the Oxide Cloud Computer.
            - uuid: 3571567f-afbf-48c7-9baa-339ca230afe9
              control-id: ia-2.12
              description: >-
                The Oxide Cloud Computer does not natively accept or
                electronically verify PIV credentials. For SAML Silos,
                PIV-based authentication can be achieved by federating with an
                identity provider that accepts PIV credentials and issues a
                SAML assertion on successful verification. In that
                configuration, PIV acceptance and verification occur at the
                customer's identity provider; the Oxide Cloud Computer trusts
                the resulting assertion and maps it to a Silo user.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#496d895e-fd77-4f15-9020-22a2b19e380c"
                  text: "Oxide Docs: Identity Providers (SAML, SCIM)"
                  rel: reference
              remarks: >-
                To satisfy IA-2(12), the customer must configure Silo SAML
                federation with an identity provider that accepts PIV
                credentials and enforces PIV authentication for the relevant
                user population. Local-only Silos cannot satisfy this control.
            - uuid: da052cd3-c98e-4e43-87a0-26dfe348510c
              control-id: ia-3
              description: >-
                The Oxide Cloud Computer identifies and authenticates compute
                sleds to each other before they exchange trust quorum
                messages. This narrative is scoped to that sled-to-sled
                authentication.

                Each sled's hardware root of trust holds an identity key that
                never leaves it and is certified during manufacturing under
                Oxide Computer Company's platform identity PKI (see SC-17),
                with the sled's part number and serial number. Sleds connect
                to each other over mutually authenticated TLS in which each
                side verifies the other's certificate chain and a signed
                attestation of its root of trust and service processor
                firmware measurements, which must match reference
                measurements. A peer that fails any check gets no connection,
                and a connected peer that is not a trust quorum member
                receives no key share.

                Limits of this mechanism: the attestation covers root of trust
                and service processor firmware only; host OS and control
                plane software are not measured. Other control plane traffic
                between services on the underlay network is not authenticated
                and relies on the underlay being separate from customer and
                guest networks. External API clients (workstations and
                automation systems) are authenticated as users, not as
                devices; the external API has no client-certificate
                authentication.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#a3cf381f-9d9c-434e-a49d-e38651e5e9ea"
                  text: "RFD 238: Trust Quorum"
                  rel: reference
                - href: https://rfd.shared.oxide.computer/rfd/0605
                  text: "RFD 605"
                  rel: reference
              remarks: >-
                Customers requiring device-level authentication for
                workstations or automation systems accessing the API must
                implement network-level controls (such as certificate-based
                access policies or network segmentation) outside the Oxide
                Cloud Computer, and can restrict API source addresses with the
                fleet-wide allow-list. How the underlay network is kept
                separate from guest and external networks is not established
                in public sources, and customers should confirm it with Oxide
                Computer Company. Customer-side responsibilities must be
                documented in the system SSP.
            - uuid: 8c16fd2e-dea9-4809-b767-d069ba57aa11
              control-id: ia-3.1
              description: >-
                Sleds authenticate each other cryptographically and in both
                directions before exchanging trust quorum messages: each side
                verifies the other's certificate chain and attested root of
                trust and service processor firmware measurements, using keys
                that stay in each sled's hardware root of trust (see IA-3).
                Other control plane traffic between services on the underlay
                network is not authenticated.

                A guest instance can request an attestation from the platform
                root of trust that binds 32 bytes of guest-chosen data to the
                instance's identity data. The signed measurements cover root
                of trust and service processor firmware only; the instance
                identity data is asserted by the virtual machine monitor,
                which is not measured. The platform does not generate or
                validate instance keys, and the mechanism does not
                authenticate the relying party to the instance.

                For external API clients, the Oxide Cloud Computer presents a
                TLS server certificate, which lets clients authenticate the
                server. The external API has no client-certificate
                authentication, so the connecting device is not
                cryptographically authenticated.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#a3cf381f-9d9c-434e-a49d-e38651e5e9ea"
                  text: "RFD 238: Trust Quorum"
                  rel: reference
                - href: https://rfd.shared.oxide.computer/rfd/0605
                  text: "RFD 605"
                  rel: reference
              remarks: >-
                Customers requiring bidirectional device authentication for
                API clients must enforce it through network-level controls
                outside the Oxide Cloud Computer. Requesting, verifying, and
                appraising instance attestations, and the guest-side and
                verifier-side protocol built on them, are customer
                responsibilities.
            - uuid: 4b1233ae-a4df-4178-ac61-1af136508756
              control-id: ia-5
              statements:
                - statement-id: ia-5_smt.e
                  uuid: f62db1e5-c1f3-44ee-bcd7-dfd7cfebe7ff
                  description: >-
                    The Oxide Cloud Computer has no default password for
                    control plane accounts: the password for the built-in
                    recovery user is entered by the operator during rack
                    setup, and local user passwords are set explicitly by a
                    silo or fleet administrator. The setup and recovery
                    interface at the technician ports has no authenticator to
                    change (see the description).
              description: >-
                Authenticators are managed by three parties. The Oxide Cloud
                Computer manages on-rack authenticators: local Silo passwords,
                web console sessions, device access tokens, SCIM bearer
                tokens, and the stored copy of the external TLS certificate
                and private key. The customer manages authenticators at its
                identity provider, including user credentials and the SAML
                signing certificate. Oxide Computer Company manages the
                hardware-token keys used for support access at the technician
                ports.

                On-rack authenticators. For local-only Silos, a silo or fleet
                administrator sets each user's password and can disable
                password login for a user. There is no self-service password
                change, no expiry, and no lockout or login rate limiting
                (password rules are in IA-5(1)). Device access tokens do not
                expire by default; Silo administrators can set a maximum
                lifetime, which applies only to tokens created afterwards. Web
                console sessions end after fixed idle and total time limits
                that are not configurable (see IA-11). Users can list their
                own sessions and tokens, delete a single device token, and
                invalidate all their sessions and tokens at once; Silo
                administrators can list and invalidate all sessions and
                tokens for any user in the Silo. One console session cannot
                be revoked on its own. SCIM bearer tokens are managed by Silo
                administrators. The customer supplies the external TLS
                certificate and private key, which is stored in the control
                plane database (see SC-12).

                Support-access authenticators. The setup and recovery
                interface at the technician ports has no authenticator. The
                support shell uses keys held on
                hardware tokens used by Oxide support, from which the private
                keys cannot be extracted. Oxide Computer Company states that a
                PIN is required to use a key and that each token is assigned to a
                named support person and tracked. The set of trusted keys is fixed in the
                system software and has no runtime interface, so adding or
                revoking a key requires a software update. Customers cannot
                manage these keys (see AC-17).
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#2225a7e4-7713-4d6d-8640-9bf49222d9dd"
                  text: "Oxide Docs: Configuring Access (IAM)"
                  rel: reference
                - href: "#8435f6dd-9a2d-46dd-97ee-5affa80fb2ed"
                  text: "Oxide API: current_user_access_token_list"
                  rel: reference
                - href: "#15436ac7-c421-406f-a553-49bf2d566dcf"
                  text: "omicron#2307: Review password policy"
                  rel: reference
                - href: https://github.com/oxidecomputer/omicron/issues/2184
                  text: "omicron#2184"
                  rel: reference
              remarks: >-
                The customer is responsible for setting a maximum device token
                lifetime for each Silo; managing the lifecycle of the external
                TLS certificates and private keys it supplies, including
                renewal before expiration; managing SAML credentials and the
                signing certificate at its identity provider; and revoking
                authenticators promptly when users depart or credentials are
                compromised. For local accounts the customer compensates by
                procedure (password selection, distribution and periodic
                replacement by administrators) and by restricting use of local
                accounts. Revocation of an Oxide support key is not immediate
                because it requires a software update; assessors should
                evaluate this constraint against their IA-5 expectations. The
                customer is responsible for controlling physical access to the
                technician ports and network access to any jumpbox or other
                host cabled to them, for granting and terminating access for
                each Oxide support session, and for keeping its own record of
                that access.
            - uuid: 4704b192-ed46-4869-b54d-a895363a6536
              control-id: ia-5.1
              statements:
                - statement-id: ia-5.1_smt.a
                  uuid: 85497e8a-740e-4cd8-b3d0-6f7213f6653e
                  description: >-
                    The Oxide Cloud Computer does not maintain a list of
                    commonly-used, expected, or compromised passwords for
                    rejection when a password is set.
                - statement-id: ia-5.1_smt.b
                  uuid: b4684e19-dd44-456d-83f9-d62bf52ee232
                  description: >-
                    Verification of new passwords against a compromised password
                    list is not performed.
                - statement-id: ia-5.1_smt.c
                  uuid: 472e89e6-064d-4d1c-878a-27f08271a48c
                  description: >-
                    Passwords are transmitted to the control plane only over
                    TLS. The API and web console listen only on HTTPS; there
                    is no plaintext HTTP listener and no redirect.
                - statement-id: ia-5.1_smt.d
                  uuid: 36dda0e7-a8f6-442e-9b41-445860ca7f4b
                  description: >-
                    Passwords are stored as Argon2id hashes. Audit log entries
                    carry no request body.
                - statement-id: ia-5.1_smt.e
                  uuid: afe61a99-f765-49f4-850c-b14f9dab45c6
                  description: >-
                    A silo or fleet administrator can set a new password for a
                    user, which is the account recovery path. The Oxide Cloud
                    Computer has no self-service password change, so it does
                    not require or allow the user to select a new password
                    after recovery; the user's password remains the one the
                    administrator set.
                - statement-id: ia-5.1_smt.f
                  uuid: 097aa4b7-afeb-4e4a-866a-3ca5bddb23e6
                  description: >-
                    The only password length rule is a maximum of 512 bytes,
                    which permits long passphrases. No composition rules
                    restrict which characters may be used.
                - statement-id: ia-5.1_smt.h
                  uuid: daa86b38-2b8b-4ebe-a686-026e598c7d66
                  description: >-
                    The Oxide Cloud Computer enforces no password composition
                    or complexity rules and no minimum password length; the
                    only rule is the 512-byte maximum. There is no setting for
                    these.
              description: >-
                The Oxide Cloud Computer implements password-based
                authentication for accounts in local-only Silos, including the
                built-in `recovery` Silo. Passwords are transmitted over TLS
                and stored as Argon2id hashes. A silo or fleet administrator
                sets each user's password and can disable password login for a
                user; there is no self-service password change. The only
                length rule is a 512-byte maximum: there is no minimum length
                or complexity requirement, no check against a list of
                commonly-used or compromised passwords, no expiry, and no
                lockout or login rate limiting. Local password policy is
                tracked as an open issue. Password management for SAML Silos
                is handled entirely by the customer's identity provider.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#15436ac7-c421-406f-a553-49bf2d566dcf"
                  text: "omicron#2307: Review password policy"
                  rel: reference
                - href: https://github.com/oxidecomputer/omicron/issues/2184
                  text: "omicron#2184"
                  rel: reference
              remarks: >-
                Customers using local-only Silos must compensate by procedure
                for the absent checks (smt.a, smt.b, smt.e, smt.h):
                administrators select strong passwords when setting them,
                convey them to users securely, and replace them periodically
                if rotation is required, since users cannot change their own
                passwords. Customers should restrict local accounts to those
                that are necessary, such as the `recovery` Silo account, and
                enforce all password requirements for SAML Silos at their
                identity provider.
            - uuid: 8f115613-9560-48f2-8132-fc5a68f87117
              control-id: ia-5.2
              description: >-
                The Oxide Cloud Computer uses public key-based authentication
                in two contexts.

                For SAML Silos, the control plane verifies the signature on
                each SAML assertion against the identity provider signing
                certificate configured for the Silo and rejects responses
                that fail. The authenticated identity is mapped to the
                corresponding Silo user. The assertion signing private key is
                held by the customer's identity provider and is not given to
                the Oxide Cloud Computer.

                For Oxide support access at the technician ports, the support
                shell accepts public key authentication only, against a fixed
                set of authorized keys. The private keys are held on hardware
                tokens used by Oxide support and cannot be extracted; Oxide
                Computer Company states that a PIN is required to use a key
                and that each token is assigned to a named support person.
                The authenticated identity maps to one shared support
                account, not to a customer-managed account. The trusted key
                set can be changed only by a software update. The setup and
                recovery interface at the technician ports uses no
                authenticator (see AC-17).
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#496d895e-fd77-4f15-9020-22a2b19e380c"
                  text: "Oxide Docs: Identity Providers (SAML, SCIM)"
                  rel: reference
              remarks: >-
                For SAML Silos, the customer is responsible for managing the
                identity provider's signing certificate lifecycle, including
                rotation, and updating the Silo's identity provider
                configuration when certificates change. Customers should
                ensure their identity provider signing key is stored in a
                hardware security module or equivalent protected storage.
                Revocation of an Oxide support key requires a software update
                and is therefore not immediate.
            - uuid: 9f374e00-f54d-418e-b899-15f268d2c05d
              control-id: ia-5.13
              description: >-
                The Oxide Cloud Computer does not store a copy of identity
                provider credentials for later use: it verifies local
                passwords itself and accepts SAML logins only on presentation
                of a signed assertion from the customer's identity provider.
                After login, access continues under credentials the control
                plane issued: a web console session, which ends after 8 hours
                idle or 24 hours in total, or a device access token, which
                does not expire by default unless a Silo administrator has
                set a maximum lifetime (applying only to tokens created
                afterwards). These remain valid without a further exchange
                with the identity provider until they expire or are
                invalidated. In SAML Silos with just-in-time user creation, a
                user removed at the identity provider is not removed or
                deactivated on the rack; in SAML Silos with SCIM,
                deactivating a user deletes that user's sessions and tokens
                and blocks login.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              remarks: >-
                The customer is responsible for setting a maximum device token
                lifetime that meets its organization-defined period, and, in
                SAML Silos with just-in-time user creation, for ending a
                departed user's access by invalidating that user's sessions
                and tokens, because removal at the identity provider does not
                end sessions or tokens already issued. Customer-side
                responsibilities must be documented in the system SSP.
            - uuid: 1c388703-74e3-43fa-88d3-3ff311ce8c34
              control-id: ia-6
              description: >-
                Interactive password entry for the Oxide Cloud Computer takes
                place in the web console login page, which is served over
                HTTPS. Audit entries carry no request body, so submitted
                credentials do not appear in the audit log. This narrative
                makes no further statement about the content of
                authentication feedback.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              remarks: >-
                Masking of password characters in the console login form and
                the content of failed-authentication responses are not
                documented in the public sources this component definition
                relies on. Customers should confirm this behavior with Oxide
                Computer Company or by inspection before documenting the
                control in the system SSP.
            - uuid: 92867532-7ea3-464c-bd13-165abee99e1a
              control-id: ia-7
              description: >-
                The Oxide Cloud Computer uses cryptographic mechanisms for
                authentication as follows. API and web console authentication
                traffic is carried over TLS. Passwords for local-only Silo
                accounts are verified against Argon2id hashes. SAML assertion
                signatures are verified against the configured identity
                provider certificate. Sleds authenticate each other over
                mutually authenticated TLS with private keys that stay in the
                hardware root of trust. At the technician ports, the support
                shell uses public key
                signatures with private keys held on hardware tokens; the
                setup and recovery interface uses no cryptographic
                authentication (see SC-13 for algorithms).

                The FIPS 140 validation status of the cryptographic modules in
                the Oxide Cloud Computer, and operation of any component in a
                FIPS-approved mode, are not established in public
                documentation.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#6514d564-b2c2-47e0-b0c1-3049ca659406"
                  text: Oxide Public Sector Solutions Overview
                  rel: reference
              remarks: >-
                SSP authors with requirements mandating FIPS-validated modules
                should verify the validation status of the cryptographic
                modules with Oxide Computer Company before asserting the
                control as satisfied or documenting it as a gap requiring a
                POA&M entry.
            - uuid: dd534976-6345-4bc9-857c-c3eddfa42093
              control-id: ia-8
              description: >-
                The Oxide Cloud Computer identifies and authenticates
                non-organizational users through the same mechanisms as
                organizational users (see IA-2); it does not distinguish
                between the two. A non-organizational user (a contractor,
                partner, or other external individual) is a Silo user like any
                other, with a unique identity within the Silo. In a local-only
                Silo an administrator creates the account and sets its
                password. In a SAML Silo the user is created at first login
                through the customer's identity provider or, where the Silo
                was created with SCIM provisioning, by the identity provider.
                The Oxide Cloud Computer has no built-in multi-factor
                authentication.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#2225a7e4-7713-4d6d-8640-9bf49222d9dd"
                  text: "Oxide Docs: Configuring Access (IAM)"
                  rel: reference
                - href: "#9f336352-7c4a-40e7-bbae-fec49f9fe38a"
                  text: "Oxide Docs: SCIM Provisioning"
                  rel: reference
              remarks: >-
                The customer is responsible for provisioning non-organizational
                user accounts in the Silo, assigning appropriate roles
                consistent with least privilege, and deprovisioning accounts
                when access is no longer required. In SAML Silos with
                just-in-time user creation, removal at the identity provider
                does not remove or deactivate the user on the rack, so the
                customer must end that user's access by invalidating the
                user's sessions and tokens. Deactivated or deleted users keep
                SSH access to instances that already hold their keys; the
                customer is responsible for removing those keys.
            - uuid: e4830255-e338-4302-b0d8-1f17e3db9380
              control-id: ia-8.1
              description: >-
                The Oxide Cloud Computer does not natively accept or verify
                PIV credentials. For SAML Silos, PIV credentials, including
                those issued by other agencies, can be accepted by federating
                with an identity provider that accepts them and issues a SAML
                assertion on successful verification. Acceptance and
                verification occur at the customer's identity provider; the
                Oxide Cloud Computer trusts the resulting assertion and maps
                it to a Silo user.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#496d895e-fd77-4f15-9020-22a2b19e380c"
                  text: "Oxide Docs: Identity Providers (SAML, SCIM)"
                  rel: reference
              remarks: >-
                To satisfy IA-8(1), the customer must configure Silo SAML
                federation with an identity provider that accepts PIV
                credentials from other agencies and enforces PIV
                authentication for the relevant user population. Local-only
                Silos cannot satisfy this control.
            - uuid: 956320ab-e595-463a-bcec-5a603c99d841
              control-id: ia-8.2
              description: >-
                The Oxide Cloud Computer supports SAML 2.0 as its external
                authenticator mechanism. A SAML Silo can use any SAML 2.0
                identity provider; the control plane validates the signature on each
                assertion against the certificate configured for the Silo's
                identity provider and rejects unsigned or signature-invalid
                assertions. It does not track assertion IDs, so an unexpired
                assertion can be replayed (see IA-2(8)).

                The Oxide Cloud Computer does not evaluate whether a
                configured identity provider or its authenticators meet NIST
                SP 800-63 requirements.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#496d895e-fd77-4f15-9020-22a2b19e380c"
                  text: "Oxide Docs: Identity Providers (SAML, SCIM)"
                  rel: reference
              remarks: >-
                The customer is responsible for verifying that its SAML
                identity provider and the authenticators it accepts meet
                applicable NIST SP 800-63 requirements, and for documenting
                the accepted external authenticators in its SSP.
            - uuid: abfbb4c3-fd0f-4592-92fb-92f040a92d82
              control-id: ia-8.4
              description: >-
                The Oxide Cloud Computer supports SAML 2.0 federation with the
                customer's identity provider. For a SAML Silo, the assurance
                level at which users authenticate is determined by the
                identity provider. The Oxide Cloud Computer trusts the SAML
                assertion issued by the configured identity provider and maps
                it to a Silo user; it does not itself enforce a NIST SP 800-63
                identity, authenticator, or federation assurance level.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#496d895e-fd77-4f15-9020-22a2b19e380c"
                  text: "Oxide Docs: Identity Providers (SAML, SCIM)"
                  rel: reference
              remarks: >-
                The customer is responsible for configuring and operating its
                SAML identity provider at the identity management profile
                required by its authorization (for example NIST SP 800-63
                IAL2/AAL2).
            - uuid: 4ce8708a-3470-481d-a879-33694dfacd4c
              control-id: ia-9
              description: >-
                The Oxide Cloud Computer authenticates itself to connecting
                clients with TLS server certificates. Every connection to the
                API and web console is served over HTTPS, so clients can
                verify the endpoint before transmitting credentials or data.
                Certificates are supplied by the customer per Silo and
                selected by the requested Silo hostname. The same certificate
                is presented when the API is reached through the technician
                port proxy.

                Service-to-service authentication inside the rack is limited
                to trust quorum traffic between sleds, which is mutually
                authenticated (see IA-3). Other control plane services,
                including the control plane database, communicate on the
                underlay network without TLS and without authenticating each
                other, and rely on the underlay being separate from customer
                and guest networks.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#1cda6846-b7f7-48e1-a859-34186be19d4b"
                  text: "Oxide API: certificate_create"
                  rel: reference
              remarks: >-
                The customer is responsible for supplying a valid TLS
                certificate and private key for each Silo, ensuring the
                certificate's Subject Alternative Names match the configured
                Silo DNS names, and managing certificate renewal before
                expiration. The private key is uploaded to the rack and stored
                in the control plane database (see SC-12). How the underlay
                network is kept separate from guest and external networks is
                not established in public sources, and customers should
                confirm it with Oxide Computer Company.
            - uuid: 5d15cd96-c621-4a8d-8c86-a8cf5893bff8
              control-id: ia-11
              description: >-
                Web console sessions end after eight hours of inactivity or
                twenty-four hours from creation, whichever occurs first, and
                the user must then re-authenticate. These values are not
                configurable.

                Device access tokens do not expire by default and have no
                inactivity timeout. A Silo administrator can set a maximum
                token lifetime; it applies only to tokens created afterwards,
                and a token that reaches it must be replaced by
                authenticating again.

                A user can delete their own device access tokens and can
                invalidate all of their own sessions and tokens, and Silo
                administrators can invalidate all sessions and tokens for any
                user in the Silo, which requires that user to re-authenticate.
                One console session cannot be revoked on its own, only all of
                a user's sessions and tokens together.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "https://docs.oxide.computer/api/auth_settings_update"
                  text: "Oxide API: auth_settings_update"
                  rel: reference
                - href: "#641ea787-a624-439c-abd0-687e7c0bcd2b"
                  text: "Oxide API: user_logout"
                  rel: reference
                - href: "#8c4910f2-c91f-420c-b1a6-7b79e9003578"
                  text: "Oxide API: current_user_access_token_delete"
                  rel: reference
              remarks: >-
                The customer is responsible for configuring the maximum device
                access token lifetime to meet its organization-defined
                re-authentication requirements (tokens created before the
                setting is applied are not affected), and for documenting the
                configured value and re-authentication policy in the SSP.
            - uuid: 7027f13e-acb7-43bc-97d8-406f1bc02639
              control-id: ia-13
              description: >-
                The Oxide Cloud Computer supports identity provider
                integration for user identification and authentication. A
                Silo can be created to use SAML 2.0 federation with a
                customer-operated identity provider; the control plane then
                acts as the SAML service provider and validates the signature
                on each assertion against the identity provider's signing
                certificate. A SAML Silo can be created with SCIM
                provisioning so that the identity provider drives user and
                group lifecycle. Local-only Silos are the alternative for
                environments that do not federate. A Silo's identity mode is
                fixed at creation and cannot be changed. Oxide Computer
                Company does not operate an identity provider on the
                customer's behalf. Sled identities within the rack are
                established by each sled's hardware root of trust, not by an
                identity provider (see IA-3).
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#496d895e-fd77-4f15-9020-22a2b19e380c"
                  text: "Oxide Docs: Identity Providers (SAML, SCIM)"
                  rel: reference
              remarks: >-
                The customer is responsible for selecting, operating, and
                maintaining the identity provider used for SAML federation
                and, where applicable, SCIM provisioning, and for establishing
                any trust agreement with the identity provider operator where
                it is a third party. The customer must choose each Silo's
                identity mode at creation, since it cannot be changed, and
                document the selected identity provider, its assurance level
                (see IA-8(4)), and the scope of trust in its SSP.
            - uuid: cf678394-f1fc-455d-905e-3abba9ca109b
              control-id: ia-13.1
              description: >-
                For SAML authentication, the Oxide Cloud Computer holds only
                the identity provider's signing certificate; the private
                signing key remains at the customer's identity provider.
                Device access tokens and session cookies are protected in
                transit between clients and the control plane by TLS on the
                API and web console (see SC-23). The private key of the
                external TLS certificate is supplied by the customer and
                stored in the control plane database, which is encrypted at
                rest (see SC-28). Within the rack, the database runs without
                TLS and without client authentication, and control plane
                services reach it over the underlay network; that traffic is
                protected by network isolation, not cryptography.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#496d895e-fd77-4f15-9020-22a2b19e380c"
                  text: "Oxide Docs: Identity Providers (SAML, SCIM)"
                  rel: reference
              remarks: >-
                The customer is responsible for generating, protecting, and
                managing the SAML signing keys at its identity provider, and
                for updating the signing certificate configured on the rack
                when the identity provider's key is rotated. The customer is
                also responsible for the issuance, renewal and replacement of
                the external TLS certificate and private key, a copy of which
                the rack stores. The customer should document identity
                provider key management practices in its SSP.
            - uuid: 01a27c56-3480-463f-bca4-183b1473b0a2
              control-id: ia-13.2
              description: >-
                The Oxide Cloud Computer verifies identity assertions and
                access tokens before granting access. For SAML authentication,
                it requires each assertion to be signed, validates the
                signature against the identity provider signing certificate
                configured for the Silo, and rejects responses that fail;
                rejected responses do not result in a user session. It does
                not track assertion IDs, so it does not detect a replayed,
                unexpired assertion (see IA-2(8)). For credentials issued by
                the control plane (device access tokens and web console
                sessions), each API request carries the credential over
                HTTPS, and credentials that are missing, invalid or expired
                are rejected.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#496d895e-fd77-4f15-9020-22a2b19e380c"
                  text: "Oxide Docs: Identity Providers (SAML, SCIM)"
                  rel: reference
              remarks: >-
                Because assertion IDs are not tracked, customers should
                configure short assertion validity windows at their identity
                provider as a compensating measure. Customer-side
                responsibilities must be documented in the system SSP.
            - uuid: f943af19-491b-4af2-9252-32d8006ebf16
              control-id: ia-13.3
              description: >-
                The Oxide Cloud Computer manages access tokens and sessions
                across their lifecycle as follows. Generation and issuance:
                device access tokens and web console sessions are generated by
                the control plane and issued only after the user authenticates
                with local credentials or a verified SAML assertion. Refresh:
                there is no refresh mechanism; an expired session or token is
                replaced by authenticating again. Revocation: a user can
                delete a single device access token and can invalidate all of
                their own sessions and tokens, and Silo administrators can
                invalidate all sessions and tokens for any user in the Silo.
                One console session cannot be revoked on its own. Time
                restriction: web console sessions end after eight hours idle
                or twenty-four hours in total; device access tokens do not
                expire by default, and a maximum lifetime set by the Silo
                administrator applies only to tokens created afterwards.
                Audience restriction: there is no separate audience
                restriction; a token or session acts as the Silo user to whom
                it was issued, and each request is authorized against that
                user's role assignments.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "https://docs.oxide.computer/api/auth_settings_update"
                  text: "Oxide API: auth_settings_update"
                  rel: reference
                - href: "#641ea787-a624-439c-abd0-687e7c0bcd2b"
                  text: "Oxide API: user_logout"
                  rel: reference
                - href: "#8c4910f2-c91f-420c-b1a6-7b79e9003578"
                  text: "Oxide API: current_user_access_token_delete"
                  rel: reference
              remarks: >-
                The customer is responsible for setting and documenting the
                organization-defined policy that governs the device token
                maximum lifetime (tokens do not expire by default) and the
                operational practices for periodic session revocation.
            - uuid: 91dcd1e0-feb3-44da-86ca-46fae6d267b9
              control-id: sc-2
              description: >-
                The Oxide Cloud Computer separates management functions from
                user functions through role-based access control, which the
                control plane enforces on each API request. Fleet roles govern
                system management (Silo creation, system update, and fleet
                role assignment), the Silo Admin role governs a Silo's
                identity configuration, users, and role policy, and Project
                roles govern workload operations on instances, disks, and
                networking. Management and user functions are served by the
                same API and web console; the separation is by role, not by a
                separate interface.

                Fleet roles do not cascade into Silos, except that a Fleet
                Admin can view and change any Silo's role policy, quotas,
                identity provider configuration, and SCIM tokens. A Silo can
                be created with a mapping that gives holders of its Silo roles
                a Fleet role; where such a mapping exists, Silo role
                assignment also confers Fleet-level access.

                The setup and recovery interface at the switch technician
                ports is outside the API role model and requires no credential
                (see AC-17).
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#2225a7e4-7713-4d6d-8640-9bf49222d9dd"
                  text: "Oxide Docs: Configuring Access (IAM)"
                  rel: reference
              remarks: >-
                The customer is responsible for assigning management roles
                (Fleet Admin, Silo Admin) only to individuals who require
                them, for assigning Project-scoped roles to users who perform
                only workload operations, for reviewing any Silo-to-Fleet role
                mapping set at Silo creation, and for controlling physical
                access to the technician ports and network access to any host
                cabled to them (see AC-17).
            - uuid: 22eb4e51-ad39-464f-8ede-1859c5688d72
              control-id: sc-3
              description: >-
                The Oxide Cloud Computer keeps its security functions outside
                the guest VM, in separate hardware and software layers.

                Each sled has a hardware root of trust: a dedicated
                microcontroller, separate from the host CPU and the service
                processor, that holds the sled's hardware identity and
                verifies its own firmware (see SI-7). The host has no direct
                interface to it; requests pass through the service processor.
                The firmware on both microcontrollers runs each task in its
                own memory-protected regions.

                The hypervisor confines each guest to its own memory, and each
                running VM is served by its own process in its own zone on the
                host OS. The control plane, which enforces access control and
                generates audit records, runs in zones on the host OS, and VPC
                firewall rules are enforced in the host OS on each sled. Both
                are outside the guest.

                Control plane services communicate with each other on the
                rack's underlay network without TLS and without
                authentication, and the control plane database accepts
                connections without TLS or client authentication. Isolation of
                these internal interfaces rests on the underlay being separate
                from customer and guest networks, not on cryptography or
                authentication.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#6514d564-b2c2-47e0-b0c1-3049ca659406"
                  text: Oxide Public Sector Solutions Overview
                  rel: reference
                - href: "https://github.com/oxidecomputer/hubris"
                  text: "Hubris: Oxide RoT and Service Processor OS (source)"
                  rel: reference
                - href: "#d23924f9-837c-4e0f-84c6-6be26711875c"
                  text: "Oxide Docs: OS, Hypervisor, and Storage Architecture"
                  rel: reference
              remarks: >-
                Public sources do not document how the underlay network is
                kept separate from guest and external networks; customers who
                rely on that separation should confirm it with Oxide Computer
                Company. The customer is responsible for controlling physical
                access to the technician ports and network access to any host
                cabled to them, because the setup and recovery interface there
                requires no credential (see AC-17). Customer-side
                responsibilities must be documented in the system SSP.
            - uuid: db667973-3784-4c29-8cca-3933a1ea2037
              control-id: sc-4
              description: >-
                The Oxide Cloud Computer limits information transfer through
                shared compute, storage, and network resources as follows.

                Memory: the hypervisor confines each VM to its own memory
                using the processor's hardware virtualization support, which
                isolates it from every other VM and from the host.

                Storage: distributed disk blocks are encrypted on the
                instance's sled before they are sent to the sleds that store
                them, and those sleds are never given the key (see SC-28). A
                snapshot holds the same key as its disk, and a disk created
                from a snapshot or image embeds the source volume with the
                source key. Disk keys are held unwrapped in the control plane
                database and are sent between control plane services over the
                unencrypted underlay network (see SC-12). Local disks, which
                are stored only on the instance's own sled, have no built-in
                encryption.

                Network: VPC boundaries are enforced in the host OS on each
                sled, outside the guest. Traffic between VPCs must go through
                external IP addresses, and every instance network interface
                has a stateful firewall that denies inbound traffic by
                default. A new VPC's default rules admit traffic from within
                the VPC, and SSH and ICMP from any source. VPC traffic between
                sleds is encapsulated but not encrypted.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#6514d564-b2c2-47e0-b0c1-3049ca659406"
                  text: Oxide Public Sector Solutions Overview
                  rel: reference
                - href: "#d23924f9-837c-4e0f-84c6-6be26711875c"
                  text: "Oxide Docs: OS, Hypervisor, and Storage Architecture"
                  rel: reference
                - href: "#be8d6076-4c17-4636-aae7-419d7bb5701c"
                  text: "Oxide Docs: Disks and Snapshots (Data Encryption)"
                  rel: reference
              remarks: >-
                The customer is responsible for encrypting local disks in the
                guest or application, for reviewing the default VPC firewall
                rules (which admit SSH and ICMP from any source), for
                encrypting guest traffic where confidentiality between sleds
                is required, and for accounting for the sharing of disk keys
                between a disk, its snapshots, and disks derived from them.
                Customer-side responsibilities must be documented in the
                system SSP.
            - uuid: 78bcde4a-da96-4313-b439-540fb0dcf416
              control-id: sc-5
              description: >-
                The Oxide Cloud Computer provides two mechanisms that limit
                the effects of denial-of-service conditions. VPC firewall
                rules, enforced in the host OS on each sled, let the customer
                restrict traffic to and from guest VM interfaces; a new VPC's
                default rules admit SSH and ICMP from any source. Silo quotas
                cap the vCPU, memory, and storage a Silo can consume. They are
                set when the Silo is created, can be changed by a Fleet Admin,
                and cause requests that would exceed them to be refused, which
                limits how much rack capacity one Silo's workloads can take.
                Projects have no quotas of their own.

                These are the denial-of-service protections the component
                provides; protection of the rack's network uplinks against
                volumetric attacks must come from upstream network
                infrastructure outside the component. Local password
                login has no lockout or rate limiting.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "https://docs.oxide.computer/guides/deploying-workloads"
                  text: "Oxide Docs: Deploying Workloads"
                  rel: reference
                - href: "#ea34ad81-857c-4b6e-8ac3-50902881ef66"
                  text: "Oxide Docs: Silo Management"
                  rel: reference
              remarks: >-
                The customer is responsible for configuring VPC firewall rules
                to restrict unnecessary inbound traffic to guest VMs, setting
                Silo resource quotas appropriate to their capacity and
                availability requirements, and providing upstream network-level
                DoS protection for the rack's external connections.
            - uuid: c00c40be-9408-45b2-9c5e-aeeaf3da96c0
              control-id: sc-7
              description: >-
                Guest networks: each VPC is an isolated network whose boundary
                is enforced in the host OS on each sled, between instances and
                the physical network interfaces, so enforcement does not
                depend on the guest. Traffic between VPCs must go through
                external IP addresses. Every instance network interface has a
                stateful firewall, configured per VPC, that by default denies
                inbound and allows outbound traffic. A new VPC is created with
                rules that admit traffic from within the VPC, and SSH and ICMP
                from any source.

                Management interface: the control plane API and web console
                are the managed interface for customer and operator functions.
                They are served only over HTTPS, and operations on resources
                require an authenticated principal. One fleet-wide
                source-address allow-list restricts which addresses can reach
                them; its default is "any".

                Technician ports: each switch has two technician ports, which
                are a second management interface (see AC-17). A host attached
                to one can reach a setup and recovery interface that requires
                no credential, and can reach the API with customer credentials
                even when the allow-list blocks access. Use of the setup and
                recovery interface and of the Oxide support shell at these
                ports is not recorded in the audit log.

                Internal networks: control plane services communicate on the
                rack's underlay network without TLS and without
                authentication; their protection is the separation of the
                underlay from customer and guest networks.

                The rack has no phone-home feature and no background process
                that exports data outside the rack; it makes no connection
                back to Oxide Computer Company. Oxide Computer Company states
                that it has no standing access to customer environments, that
                it can reach a rack only through access the customer provides,
                and that it performs no maintenance without a
                customer-initiated support engagement.

                The rack's physical uplinks to the customer's network are its
                external boundary, which the customer protects.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#b557fdcb-ae3c-41e4-8cd4-e849a911017d"
                  text: "Oxide Docs: Configuring Guest Networking"
                  rel: reference
                - href: "https://docs.oxide.computer/guides/architecture/networking"
                  text: "Oxide Docs: Networking Architecture"
                  rel: reference
                - href: "https://docs.oxide.computer/guides/system/system-setup"
                  text: "Oxide Docs: System Setup"
                  rel: reference
                - href: "https://docs.oxide.computer/guides/operator/faq"
                  text: "Oxide Docs: Operator FAQ"
                  rel: reference
              remarks: >-
                The customer is responsible for configuring VPC firewall rules
                to enforce its boundary protection policy (the default rules
                admit SSH and ICMP from any source), setting the API
                allow-list, designing VPC topology, and protecting the rack's
                external network boundary with upstream network
                infrastructure. The customer is responsible for controlling
                physical access to the technician ports and network access to
                any jumpbox or other host cabled to them, which is the only
                safeguard for the setup and recovery interface, and for
                granting, terminating, and recording access for each Oxide
                support session. Public sources do not document how the
                underlay network is kept separate from guest and external
                networks; customers who rely on that separation should confirm
                it with Oxide Computer Company. Customer-side responsibilities
                must be documented in the system SSP.
            - uuid: d524b716-0bd5-4b95-8c53-b9641319b2a5
              control-id: sc-7.3
              description: >-
                Customer and operator management access over the network has
                one access point: the control plane API and web console. The
                switch technician ports are a second management access point,
                where a setup and recovery interface requires no credential
                (see AC-17). They are not connected to the customer's network
                unless the customer cables a host to them, and they need not
                be connected for the rack to operate. The attached host can be
                a jumpbox, so use of a technician port can be remote.

                The rack has no phone-home feature and initiates no connection
                to Oxide Computer Company (see SC-7).

                External connections for customer workloads are determined by
                the customer's VPC configuration, and the number of physical
                connections from the rack to the customer's network is
                determined by the customer's network design.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#b557fdcb-ae3c-41e4-8cd4-e849a911017d"
                  text: "Oxide Docs: Configuring Guest Networking"
                  rel: reference
                - href: "https://docs.oxide.computer/guides/system/system-setup"
                  text: "Oxide Docs: System Setup"
                  rel: reference
                - href: "https://docs.oxide.computer/guides/operator/faq"
                  text: "Oxide Docs: Operator FAQ"
                  rel: reference
              remarks: >-
                The customer is responsible for limiting external network
                connections to workloads through VPC firewall rules and routing
                configuration, and for controlling the number and scope of
                physical network connections between the rack and external
                networks. The customer decides whether a host or jumpbox is
                cabled to the technician ports, and is responsible for
                controlling physical access to the ports and network access to
                any such host.
            - uuid: fe4700f8-9d17-44f1-8fd2-364f1021426b
              control-id: sc-7.5
              description: >-
                Every instance network interface has a stateful firewall,
                enforced in the host OS on each sled outside the guest, that
                by default denies inbound traffic and allows outbound traffic.
                A new VPC is created with inbound allow rules for traffic from
                within the VPC, SSH from any source, and ICMP from any source.
                The default configuration is therefore not deny-all: the
                customer must replace or narrow these rules and add outbound
                rules to meet a deny-by-default, allow-by-exception policy.

                At the control plane API and console, the fleet-wide
                source-address allow-list defaults to "any".
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#b557fdcb-ae3c-41e4-8cd4-e849a911017d"
                  text: "Oxide Docs: Configuring Guest Networking"
                  rel: reference
                - href: "https://github.com/oxidecomputer/omicron/blob/rel/v23/nexus/defaults/src/lib.rs"
                  text: "Omicron (rel/v23): default VPC firewall rules"
                  rel: reference
              remarks: >-
                The customer is responsible for removing or restricting the
                permissive default VPC firewall rules, adding rules that
                restrict outbound traffic, defining explicit allow rules for
                required traffic flows only, and setting the API allow-list to
                authorized source addresses.
            - uuid: 54f3c08a-1ac2-4f0d-8f2c-b6a4bc695602
              control-id: sc-7.7
              description: >-
                The Oxide Cloud Computer does not manage the devices or VPN
                configurations that remote users and administrators use to
                reach the control plane API, and does not prevent split
                tunneling on them. That is determined by the customer's remote
                access infrastructure.

                For guest VM traffic, VPC routers and firewall rules are
                customer-configured and are applied in the host OS on each
                sled, outside the guest. The customer can use them to direct
                guest traffic through a central egress point.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cd1ca6d1-fa72-4ed1-9fda-9b9766906355"
                  text: "Oxide Docs: VPC Subnet Routing"
                  rel: reference
              remarks: >-
                The customer is responsible for preventing split tunneling on
                remote devices used to access the control plane, through its
                remote access policy and VPN configuration. Where split
                tunneling prevention is required for guest traffic, the
                customer must configure VPC routing to send that traffic
                through managed egress points.
            - uuid: f314c650-9462-42f6-a2c6-a99f480bd396
              control-id: sc-7.8
              description: >-
                The Oxide Cloud Computer does not provide an authenticated
                proxy service. It provides customer-configured VPC routers and
                firewall rules, applied in the host OS on each sled outside
                the guest, which the customer can use to direct guest VM
                traffic to a customer-deployed proxy server before it reaches
                external networks.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cd1ca6d1-fa72-4ed1-9fda-9b9766906355"
                  text: "Oxide Docs: VPC Subnet Routing"
                  rel: reference
              remarks: >-
                The customer is responsible for deploying a proxy server within
                the VPC or at a network egress point, configuring VPC routing to
                direct required traffic through that proxy, and enforcing
                authentication at the proxy for connections to external
                networks.
            - uuid: 8aab27d7-b5db-4d91-a825-25b316c8519a
              control-id: sc-7.9
              description: >-
                The customer can add VPC firewall rules that restrict outbound
                traffic from guest workloads, and can use VPC routers to
                direct outbound traffic to a customer-deployed monitoring or
                inspection appliance. Both are applied in the host OS on each
                sled, outside the guest. Outbound traffic is allowed by
                default, so any restriction is a rule the customer adds.

                The Oxide Cloud Computer does not provide threat detection,
                intrusion prevention, or deep packet inspection, and it does
                not record firewall deny events: the audit log covers
                authenticated, state-changing requests to the external API,
                and login attempts. Detecting threatening outbound traffic,
                and obtaining audit records of denied outbound connections,
                require customer-deployed tooling in the traffic path.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#b557fdcb-ae3c-41e4-8cd4-e849a911017d"
                  text: "Oxide Docs: Configuring Guest Networking"
                  rel: reference
                - href: "#cd1ca6d1-fa72-4ed1-9fda-9b9766906355"
                  text: "Oxide Docs: VPC Subnet Routing"
                  rel: reference
              remarks: >-
                The customer is responsible for defining firewall rules that
                deny outbound traffic posing a threat to external systems,
                deploying any threat detection or inspection tooling required to
                identify threatening traffic dynamically, and capturing audit
                records of denied outbound connections through network
                monitoring deployed in the traffic path.
            - uuid: e0f3359e-9dbe-4e2d-aacc-eee91c8cbb0d
              control-id: sc-7.10
              description: >-
                The customer can add VPC firewall rules that restrict outbound
                connections from guest workloads, and can use VPC routers to
                direct outbound traffic to a customer-deployed inspection or
                data loss prevention appliance. Both are applied in the host
                OS on each sled, outside the guest. Outbound traffic is
                allowed by default, so restrictions are rules the customer
                adds.

                The rack itself has no phone-home feature and no background
                process that exports data outside the rack (see SC-7).

                The Oxide Cloud Computer does not provide data loss
                prevention, content inspection, or exfiltration detection.
                Preventing exfiltration over permitted network paths requires
                customer-deployed tooling.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#b557fdcb-ae3c-41e4-8cd4-e849a911017d"
                  text: "Oxide Docs: Configuring Guest Networking"
                  rel: reference
                - href: "#cd1ca6d1-fa72-4ed1-9fda-9b9766906355"
                  text: "Oxide Docs: VPC Subnet Routing"
                  rel: reference
              remarks: >-
                The customer is responsible for configuring VPC firewall rules
                to restrict outbound traffic to authorized destinations only,
                routing outbound traffic through inspection appliances where
                content-aware exfiltration prevention is required, and deploying
                data loss prevention tooling for detection and blocking of
                exfiltration over permitted network paths.
            - uuid: 2497aca5-0838-4ab6-9846-beeb637b5312
              control-id: sc-7.11
              description: >-
                Each instance network interface has a stateful firewall,
                enforced in the host OS on each sled outside the guest, that
                admits inbound traffic only where a VPC firewall rule allows
                it. A new VPC is created with rules that admit traffic from
                within the VPC, and SSH and ICMP from any source, so
                restricting incoming traffic to authorized sources requires
                the customer to replace or narrow these defaults. Traffic from
                another VPC must arrive through external IP addresses and is
                subject to the same rules.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#b557fdcb-ae3c-41e4-8cd4-e849a911017d"
                  text: "Oxide Docs: Configuring Guest Networking"
                  rel: reference
                - href: "#cd1ca6d1-fa72-4ed1-9fda-9b9766906355"
                  text: "Oxide Docs: VPC Subnet Routing"
                  rel: reference
              remarks: >-
                The customer is responsible for configuring VPC firewall rules
                that permit inbound traffic only from authorized sources to
                authorized destinations (including replacing the default rules
                that admit SSH and ICMP from any source), and for reviewing and
                maintaining those rules as authorized sources and workload
                destinations change.
            - uuid: 7392c5c9-d094-4984-9726-a5474d4fd593
              control-id: sc-7.12
              description: >-
                On its own hosts, the Oxide Cloud Computer runs control plane
                services in zones on the host OS and runs each VM's virtual
                machine monitor process in its own zone. It enforces the VPC
                firewall at each instance network interface in the host OS on
                each sled, outside the guest.

                It does not deploy or manage protection software inside guest
                operating systems. Host-based firewalls, endpoint protection
                agents, and OS-level access controls within the guest are the
                customer's responsibility.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#d23924f9-837c-4e0f-84c6-6be26711875c"
                  text: "Oxide Docs: OS, Hypervisor, and Storage Architecture"
                  rel: reference
              remarks: >-
                The customer is responsible for implementing host-based boundary
                protection within their guest VMs, including guest OS firewall
                configuration, endpoint protection agents, and any other
                host-based security controls required by their security
                baseline.
            - uuid: 9d9bc84e-1e30-454b-b92b-e10a61cb1a3d
              control-id: sc-7.13
              description: >-
                Each sled's root of trust and service processor are
                microcontrollers separate from the host CPU. Service
                processors are reached over a management network that has its
                own switch in each rack switch, and the root of trust is
                reached through its service processor. The technician ports
                attach to that management network switch; a setup and recovery
                interface reachable from them requires no credential (see
                AC-17).

                Control plane services communicate with each other on the
                underlay network without TLS and without authentication; the
                protection of that traffic is the separation of the underlay
                from customer and guest networks.

                For customer-deployed security tools (monitoring agents,
                intrusion detection systems, log collectors), the customer can
                place the tools in dedicated VPCs or subnets and control their
                interfaces to workload networks with VPC firewall rules.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#6514d564-b2c2-47e0-b0c1-3049ca659406"
                  text: Oxide Public Sector Solutions Overview
                  rel: reference
                - href: "https://docs.oxide.computer/guides/architecture/networking"
                  text: "Oxide Docs: Networking Architecture"
                  rel: reference
              remarks: >-
                The customer is responsible for placing customer-deployed
                security tools in dedicated VPCs or subnets and configuring
                managed interfaces between security tool networks and workload
                networks using VPC firewall rules and routing policy. The
                customer is responsible for controlling physical access to the
                technician ports and network access to any host cabled to
                them. Public sources do not document how the underlay network
                is kept separate from guest and external networks; customers
                who rely on that separation should confirm it with Oxide
                Computer Company.
            - uuid: 112b1b12-40e9-4f55-9012-4dc836c4352f
              control-id: sc-7.14
              description: >-
                Protection against unauthorized physical connections to the
                switch technician ports rests first on the customer's control
                of physical access to the ports and of network access to any
                host cabled to them. The rack is installed in a
                customer-controlled facility, and physical access to all of
                its ports, including the network uplinks, is controlled by the
                customer's facility security.

                The component's own controls on a host connected to a
                technician port differ by service (see AC-17). The setup and
                recovery interface requires no credential and can view rack
                inventory, run an offline update, and power-control any sled,
                switch, or power shelf controller. The administrative shell
                accepts only keys held on Oxide support hardware tokens, and
                the API requires customer credentials. Direct access from the
                port to the rest of the management network is locked each time
                the switch service processor starts. Unlocking it requires a
                key held on an Oxide support hardware token when the switch is
                in its release configuration, and Oxide Computer Company
                states that every customer rack ships in that configuration.
                The lock does not restrict the three services above.

                Use of the setup and recovery interface, use of the support
                shell, and management network unlock are not recorded in the
                audit log.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "https://docs.oxide.computer/guides/system/system-setup"
                  text: "Oxide Docs: System Setup"
                  rel: reference
              remarks: >-
                The customer is responsible for controlling physical access to
                the rack through facility security measures (locked cages,
                access control, surveillance) to prevent unauthorized physical
                connections to rack ports, and for controlling network access
                to any jumpbox or other host cabled to the technician ports;
                this is the only safeguard for the setup and recovery
                interface. Because use of that interface, the support shell,
                and management network unlock is not recorded in the audit
                log, the customer must monitor the ports and attached hosts
                under its own facility and network monitoring procedures.
                Physical security of the facility is documented under PE
                controls in the customer's SSP.
            - uuid: 4284450d-2ea9-40d0-8053-e064e4cc3f42
              control-id: sc-7.15
              description: >-
                Networked privileged access to the Oxide Cloud Computer is
                routed through the control plane API and web console, served
                over HTTPS. Operations on resources require an authenticated
                principal and are authorized against the roles that principal
                holds. A fleet-wide source-address allow-list (default "any")
                restricts which addresses can reach the interface. The audit
                log records authenticated, state-changing requests to the
                external API, and login attempts; read-only (GET) requests and
                requests rejected at authentication are not recorded.

                The switch technician ports are a second path for privileged
                access, usable over a network when the customer cables a
                jumpbox to them (see AC-17). API requests made through a
                technician port are subject to the same authentication,
                authorization, and audit logging. The setup and recovery
                interface, which requires no credential, and the Oxide support
                shell, which accepts only keys held on Oxide support hardware
                tokens, are outside the API's access control. Their use, and
                management network unlock, are not recorded in the audit log.

                The rack has no phone-home feature and makes no connection
                back to Oxide Computer Company. Oxide Computer Company states
                that it has no standing access to customer environments and
                performs no maintenance without a customer-initiated support
                engagement. For a remote support session, the customer grants
                network credentials and jumpbox accounts and terminates the
                access afterwards.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
                - href: "https://docs.oxide.computer/guides/system/system-setup"
                  text: "Oxide Docs: System Setup"
                  rel: reference
              remarks: >-
                The customer is responsible for setting the API allow-list,
                for routing administrators' access to the API through its own
                managed access path where required, and for controlling
                physical access to the technician ports and network access to
                any jumpbox cabled to them, which is the only safeguard for
                the setup and recovery interface. The customer is responsible
                for authorizing, recording, and terminating each Oxide support
                session, because the component's audit log does not record
                it. Customer-side responsibilities must be documented in the
                system SSP.
            - uuid: 561746fe-275c-47d7-88e3-912c8b6c557f
              control-id: sc-7.18
              description: >-
                Two boundary protection behaviors default to the restrictive
                state. The firewall on each instance network interface denies
                inbound traffic that no rule allows; outbound traffic is allowed
                by default. Direct access from a technician port to the
                management network is locked each time the switch service
                processor starts. That lock does not cover the
                setup and recovery interface on the ports, which requires no
                credential in any state (see AC-17).
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#b557fdcb-ae3c-41e4-8cd4-e849a911017d"
                  text: "Oxide Docs: Configuring Guest Networking"
                  rel: reference
              remarks: >-
                The customer is responsible for the fail-secure behavior of upstream boundary protection devices
                outside the rack, and for configuring VPC firewall rules for
                outbound traffic, which is allowed by default. Customer-side
                responsibilities must be documented in the system SSP.
            - uuid: 0f28ae94-f08a-4772-a206-3a09f590ef07
              control-id: sc-7.20
              description: >-
                Customers can isolate a workload component at any time by
                changing the firewall rules or routers of its VPC, or by
                stopping the instance, through the control plane API. VPC
                rules are enforced in the host OS on each sled, outside the
                guest. These changes are authenticated, state-changing API
                requests and are recorded in the audit log.

                At the infrastructure level, a sled whose hardware identity or
                firmware attestation fails verification, or that is not a
                member of the rack's trust quorum, is refused storage key
                shares by its peers without operator action. Removing a sled
                from the trust quorum is not available in the operator API and
                does not produce an audit log entry.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#b557fdcb-ae3c-41e4-8cd4-e849a911017d"
                  text: "Oxide Docs: Configuring Guest Networking"
                  rel: reference
                - href: "#cd1ca6d1-fa72-4ed1-9fda-9b9766906355"
                  text: "Oxide Docs: VPC Subnet Routing"
                  rel: reference
              remarks: >-
                The customer is responsible for defining which components
                require dynamic isolation capability and for operating the
                mechanisms (firewall rule updates, instance lifecycle
                operations) when isolation is needed.
            - uuid: 5baf24c5-5699-45e2-8b45-9f6ee7a3259c
              control-id: sc-7.21
              description: >-
                The Oxide Cloud Computer provides boundaries at three levels
                that customers can use to separate components supporting
                different missions or business functions.

                Silos are the tenancy boundary: each has its own users,
                identity configuration, projects, and quotas. Fleet roles do
                not cascade into Silos, except that a Fleet Admin can view and
                change any Silo's role policy, quotas, identity provider
                configuration, and SCIM tokens. Within a Silo, Projects
                separate resources by role: a user can act on a Project's
                resources only with a role on that Project or a Silo role,
                which applies to every Project in the Silo.

                VPCs are isolated networks: traffic between VPCs must go
                through external IP addresses and is subject to each VPC's
                firewall rules. Each VM is confined to its own memory by the
                hypervisor.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#ea34ad81-857c-4b6e-8ac3-50902881ef66"
                  text: "Oxide Docs: Silo Management"
                  rel: reference
                - href: "#b557fdcb-ae3c-41e4-8cd4-e849a911017d"
                  text: "Oxide Docs: Configuring Guest Networking"
                  rel: reference
              remarks: >-
                The customer is responsible for designing their Silo, Project,
                and VPC topology to separate system components according to
                their mission and business function requirements, and for
                configuring the boundary protection mechanisms (RBAC, firewall
                rules, routing) that enforce the intended separation.
            - uuid: 96d07dba-a7a8-4a26-b75d-cc90100838ca
              control-id: sc-8
              description: >-
                The Oxide Cloud Computer cryptographically protects some
                transmission paths and relies on network separation for the
                others.

                Protected. The API and web console are reachable only over
                HTTPS, using TLS certificates supplied by the customer; there is
                no plaintext HTTP listener. API access through the technician
                ports uses the same TLS configuration. Distributed-disk data is
                encrypted on the sled that runs the instance before it is sent
                to the sleds that store it. The data is encrypted; the storage
                connection is not, and that connection is unauthenticated. The
                encryption authenticates each block's contents but not its
                position or freshness. Trust quorum traffic between sleds,
                including key share exchange, is encrypted and mutually
                authenticated, with each sled's private key held in its hardware
                root of trust.

                Not protected. Control plane services communicate with each
                other and with the control plane database on the rack's internal
                (underlay) network over HTTP without TLS and without
                authentication. Distributed-disk keys and, during disk import,
                plaintext disk data cross these channels. These channels rely on
                the underlay being separate from customer and guest networks.
                Guest network traffic between sleds is encapsulated but not
                encrypted by the rack. Sessions with the setup and recovery
                interface at the technician ports are carried over SSH but
                require no credential (see AC-17).

                Encryption of traffic between guest VMs, and between guest VMs
                and external services, is not managed by the Oxide Cloud
                Computer.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#d23924f9-837c-4e0f-84c6-6be26711875c"
                  text: "Oxide Docs: OS, Hypervisor, and Storage Architecture"
                  rel: reference
                - href: "#a3cf381f-9d9c-434e-a49d-e38651e5e9ea"
                  text: "RFD 238: Trust Quorum"
                  rel: reference
                - href: "https://docs.oxide.computer/guides/architecture/networking"
                  text: "Oxide Docs: Networking Architecture"
                  rel: reference
                - href: "https://github.com/oxidecomputer/omicron/blob/rel/v23/nexus/src/lib.rs"
                  text: "Omicron (rel/v23): Nexus server configuration"
                  rel: reference
                - href: "https://github.com/oxidecomputer/omicron/blob/rel/v23/smf/cockroachdb/method_script.sh"
                  text: "Omicron (rel/v23): CockroachDB start method"
                  rel: reference
              remarks: >-
                The customer is responsible for encrypting traffic between guest
                VMs and between guest VMs and external services, including
                traffic that crosses the rack between sleds, and for supplying,
                renewing, and replacing TLS certificates for the API and console
                that meet its cryptographic requirements. Public sources do not
                document how separation of the underlay network is enforced; a
                customer that relies on it should confirm it with Oxide Computer
                Company. Customer-side responsibilities must be documented in
                the system SSP.
            - uuid: 98e66d2d-efce-4595-9e00-f8ead5a9546f
              control-id: sc-8.1
              description: >-
                The Oxide Cloud Computer implements cryptographic protection in
                transit on these paths: TLS for the API and web console,
                including API access through the technician ports, with a server
                certificate supplied by the customer; SSH for the support shell
                and for the setup and recovery interface at the technician
                ports, the latter requiring no credential; encryption of
                distributed-disk data before it leaves the instance's sled, over
                a storage connection that is itself neither encrypted nor
                authenticated; and mutually authenticated TLS between sleds for
                trust quorum traffic, including key share exchange.

                It does not implement cryptographic protection for traffic
                between control plane services or to the control plane database
                on the underlay network, or for guest network traffic between
                sleds. Distributed-disk keys and, during disk import, plaintext
                disk data cross the unprotected control plane channels. SC-8
                describes each path; SC-13 lists the algorithms.

                No public source establishes FIPS 140 validation of any
                cryptographic module in the Oxide Cloud Computer, or operation
                in a FIPS-approved mode (see IA-7).
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#d23924f9-837c-4e0f-84c6-6be26711875c"
                  text: "Oxide Docs: OS, Hypervisor, and Storage Architecture"
                  rel: reference
                - href: "#a3cf381f-9d9c-434e-a49d-e38651e5e9ea"
                  text: "RFD 238: Trust Quorum"
                  rel: reference
                - href: "https://github.com/oxidecomputer/omicron/blob/rel/v23/nexus/src/lib.rs"
                  text: "Omicron (rel/v23): Nexus server configuration"
                  rel: reference
              remarks: >-
                FIPS 140 validation of the cryptographic modules used for TLS
                and SSH, and operation in a FIPS-approved mode, are not
                established by public sources; a customer that requires them
                should confirm with Oxide Computer Company (see IA-7). The
                customer is responsible for cryptographic protection of traffic
                between guest VMs and between guest VMs and external services,
                and for supplying TLS certificates for the API and console.
                Public sources do not document how separation of the underlay
                network is enforced. Customer-side responsibilities must be
                documented in the system SSP.
            - uuid: 04f23c9b-c4b3-48cd-a5bc-b2c38ddf03a5
              control-id: sc-8.2
              description: >-
                Before and after transmission, the Oxide Cloud Computer protects
                information through encryption and integrity checking in
                storage, with the exceptions below. Distributed-disk data is
                encrypted inside the instance's hypervisor process, so the sleds
                that store it hold ciphertext, and the storage service verifies
                every block it reads and does not return data that fails
                verification. Control plane data, including the control plane
                database, is stored on encrypted datasets. SC-28 describes
                encryption at rest and SC-12 the keys.

                Exceptions. Local disks and the sleds' boot drives are not
                encrypted at rest. Data received by the API is handled by
                control plane services that exchange it on the underlay network
                over HTTP without TLS and without authentication, and the
                control plane database accepts connections without TLS or client
                authentication. During disk import, plaintext disk data passes
                through the control plane over unencrypted HTTP. Protection of
                this handling relies on the underlay being separate from
                customer and guest networks (see SC-8).

                Data on client systems before submission to the API and after
                retrieval is outside the component's boundary.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
