            - uuid: 98931063-bfe0-4e64-abb8-975790d065b0
              control-id: si-4.24
              description: >-
                Oxide Computer Company publishes security advisories for
                vulnerabilities in Oxide products where customer data may be at
                risk and customer action may be required, together with
                informational announcements and an RSS feed. The Oxide Cloud
                Computer does not itself discover, collect, or distribute
                indicators of compromise: it does not operate a threat
                intelligence function, its alert mechanism does not deliver
                audit, authentication, or integrity events, and it makes no
                connection back to Oxide Computer Company.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#952a7e36-0e1f-4f7c-bc50-ad3757cd5541"
                  text: Oxide Security Advisories
                  rel: reference
              remarks: >-
                The customer is responsible for subscribing to Oxide security
                advisories, incorporating relevant information from them into
                its monitoring rules and threat intelligence platform, and
                distributing indicators of compromise to the appropriate
                detection systems in its environment.
            - uuid: 71fed220-6d95-43b7-9d71-a80106d1af74
              control-id: si-6
              description: >-
                The Oxide Cloud Computer verifies specific security functions
                at start-up. Each time the hardware root of trust starts, it
                verifies the signature on its own firmware and does not run an
                image that fails. At each sled boot, peer sleds authenticate
                the sled and appraise its attested root of trust and service
                processor firmware measurements against reference values
                before releasing the key shares it needs; a sled that fails is
                refused, cannot unlock its encrypted storage, and starts no
                control plane services. Service processor firmware is measured
                but no signature on it is verified, and verification or
                measurement of the host operating system at boot is not
                established for this release (see SI-7).

                The component does not alert personnel to failed verification.
                Failed root of trust verification, failed peer authentication
                or appraisal, and trust quorum alarms are written only to
                internal service logs; they produce no audit record or alert
                and are not surfaced through the API. The audit log covers
                authenticated, state-changing requests to the external API,
                and login attempts, including authorization denials.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#6514d564-b2c2-47e0-b0c1-3049ca659406"
                  text: Oxide Public Sector Solutions Overview
                  rel: reference
                - href: "#d997e812-b360-4598-8df7-b892b5133273"
                  text: "Hubris: Oxide service processor firmware"
                  rel: reference
                - href: "#a3cf381f-9d9c-434e-a49d-e38651e5e9ea"
                  text: "RFD 238: Trust Quorum"
                  rel: reference
              remarks: >-
                The customer is responsible for collecting the audit log
                through the API and alerting on authorization denials in their
                own monitoring infrastructure, for detecting sleds that do not
                return to service after a boot, and for establishing
                procedures for responding when security function verification
                fails, including engaging Oxide Support. Customer-side
                responsibilities must be documented in the system SSP.
            - uuid: 943b4cf2-5f79-457d-8491-59cad012c68f
              control-id: si-7
              description: >-
                Each sled has a hardware root of trust and a service
                processor, both microcontrollers separate from the host CPU.

                The root of trust verifies the signature on its own firmware
                before running it, against a trust anchor fixed in the device.
                An image that fails is not run, and if no image passes, the
                root of trust does not boot. Oxide Computer Company states
                that production hardware accepts only images signed under its
                release roots and that the trust anchor is locked at the end
                of manufacturing (see SC-17). The immutable boot ROM where
                verification begins is itself not verified or measured.

                Service processor firmware is measured, not verified. The root
                of trust records a measurement of it when the service processor
                resets, holds no expected value, and never prevents
                the service processor from booting; if measurement fails, the
                service processor boots unmeasured. No signature on service
                processor firmware is verified at update or at boot, so its
                integrity depends on a verifier appraising the attested
                measurement. Peer sleds do this: a sled whose measurements are
                outside the reference set is refused and receives no key
                shares, so it cannot unlock its encrypted storage.

                Attestation covers root of trust and service processor
                firmware only. Vendor (AMD) firmware runs on the host CPU
                before any Oxide code. Verification or measurement of the host
                operating system image at boot is not established for this
                release; control plane software is not verified, measured, or
                attested at boot, and runtime integrity monitoring of it is
                not a documented capability. Protection against rollback of
                root of trust or service processor firmware is not
                established.

                Software update is checked against customer-installed trust
                roots at upload and by hash afterwards; the bundle is not
                signed under a persistent Oxide Computer Company key, and offline update at the
                technician ports does not consult the trust roots, requires no
                credential, and is not audited (see SI-2 and AC-17). For
                stored data, checksums detect corruption and the storage
                service does not return a block that fails verification; no
                scrubs are scheduled. Instance attestation includes a boot
                disk digest only for a read-only distributed boot disk and is
                verified outside the platform (see SI-7(9)).
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#6514d564-b2c2-47e0-b0c1-3049ca659406"
                  text: Oxide Public Sector Solutions Overview
                  rel: reference
                - href: "#d997e812-b360-4598-8df7-b892b5133273"
                  text: "Hubris: Oxide service processor firmware"
                  rel: reference
                - href: "#a3cf381f-9d9c-434e-a49d-e38651e5e9ea"
                  text: "RFD 238: Trust Quorum"
                  rel: reference
                - href: https://github.com/oxidecomputer/bootleby
                  text: "bootleby: Oxide RoT stage0 bootloader"
                  rel: reference
                - href: https://rfd.shared.oxide.computer/rfd/0605
                  text: "RFD 605: VM Instance Identity and Attestation"
                  rel: reference
                - href: "#eeb24ebd-edc5-47ec-8545-4272f16bbfc9"
                  text: "Oxide Docs: System Update"
                  rel: reference
              remarks: >-
                The customer is responsible for validating the checksum of
                each update bundle against the value provided by Oxide Support
                before adding the bundle's trust root to the rack, for
                controlling physical access to the technician ports and
                network access to any host cabled to them, for requesting,
                verifying, and appraising instance attestations where they are
                relied upon, and for deploying any runtime software integrity
                verification required for guest workloads within their VMs.
                Customer-side responsibilities must be documented in the
                system SSP.
            - uuid: 28f3dfff-6f7a-4b74-a9f2-4cb5b5cdd5a6
              control-id: si-7.1
              description: >-
                Integrity checks run at start-up for two classes of firmware,
                automatically and without operator action (see SI-7). The
                hardware root of trust verifies the signature on its own
                firmware each time it starts. Service processor firmware is
                measured by the root of trust when the service processor resets;
                 the measurement does not gate boot, no signature
                is verified, and the measurement is appraised only when the
                sled next connects to a peer, which refuses a sled whose
                measurements are outside its reference set. If measurement
                does not occur, the service processor boots unmeasured.

                No integrity check of the host boot image, host operating
                system, or control plane software at start-up is established
                for this release. At instance start, a digest of the boot disk
                is computed for instance attestation only when the boot disk
                is a read-only distributed disk; local, writable, or absent
                boot disks are not measured.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#6514d564-b2c2-47e0-b0c1-3049ca659406"
                  text: Oxide Public Sector Solutions Overview
                  rel: reference
                - href: "#520eb256-1563-4637-8ca9-3012c366c30b"
                  text: "phbl: Oxide Pico Host Boot Loader"
                  rel: reference
              remarks: >-
                The customer is responsible for defining the software,
                firmware, and information subject to integrity checks in their
                system, for appraising instance attestations where they are
                relied upon, and for any additional integrity checks their
                baseline requires at startup or on a defined frequency.
                Customer-side responsibilities must be documented in the
                system SSP.
            - uuid: b08541e8-256f-4e17-8324-1f5b693c855f
              control-id: si-7.2
              description: >-
                The Oxide Cloud Computer does not deliver automated
                notifications of integrity violations. A root of trust
                firmware image that fails signature verification is not run,
                and a sled whose root of trust or service processor firmware
                measurements are outside a peer's reference set is refused by
                that peer (see SI-7). These events are written only to
                internal service logs and produce no audit record or alert.
                The alert mechanism carries no integrity or attestation
                events, so notification of integrity violations depends on
                customer monitoring.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#6514d564-b2c2-47e0-b0c1-3049ca659406"
                  text: Oxide Public Sector Solutions Overview
                  rel: reference
              remarks: >-
                The customer is responsible for operating its own notification
                of integrity violations: detecting sleds that do not return to
                service after a boot or update, configuring alerts in their
                own monitoring infrastructure, and engaging Oxide Support to
                diagnose a sled that is refused by its peers. Customer-side
                responsibilities must be documented in the system SSP.
            - uuid: bb5589c1-8f25-4b1b-b8ef-7886d68a5764
              control-id: si-7.5
              description: >-
                The automated response to an integrity violation is refusal.
                A root of trust firmware image that fails signature
                verification is not run; another image that passes is booted
                if there is one, and otherwise the root of trust does not
                boot. A sled whose attested root of trust or service processor
                firmware measurements are outside a peer's reference set is
                refused by its peers and receives no key shares, so it cannot
                unlock its encrypted storage, starts no control plane
                services, and does not join the rack's internal network.
                During update, an artifact whose hash differs from the
                verified repository metadata is rejected. The storage service
                does not return a block that fails verification on read, and
                repairs from its replicas.

                Service processor firmware boots regardless of its measurement
                (see SI-7). The component does not shut down or restart a sled
                in response to these violations and takes no quarantine or
                remediation action beyond the refusal. No automated response
                exists for the host operating system or control plane
                software, which are not verified or measured at boot.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#6514d564-b2c2-47e0-b0c1-3049ca659406"
                  text: Oxide Public Sector Solutions Overview
                  rel: reference
                - href: "#d997e812-b360-4598-8df7-b892b5133273"
                  text: "Hubris: Oxide service processor firmware"
                  rel: reference
              remarks: >-
                The customer is responsible for any additional response
                actions their baseline requires when an integrity violation
                is discovered.
            - uuid: bfd878c8-b739-4fa2-ade3-0af4cc884690
              control-id: si-7.7
              description: >-
                Incorporating the detection of unauthorized changes into an
                incident response capability is an organizational activity
                performed by the customer. The Oxide Cloud Computer supplies a
                limited set of detection signals and does not push any of
                them.

                The audit log records authenticated, state-changing requests
                to the external API, and login attempts. This includes changes
                to update trust roots, update repository upload, changes to
                the target release, role and policy assignments, identity
                provider configuration, and firewall rules. An entry shows
                that a change was requested, by whom, and whether it
                succeeded, but not the content of the change (see AU-3).
                Read-only requests and requests rejected at authentication are
                not recorded. Entries are retained for 90 days and are
                collected by polling.

                Some changes produce no record. Use of the setup and recovery
                interface (including offline update and power control), the
                support shell, and management network unlock at the technician
                ports is not recorded in the audit log (see AC-17), and
                removing a sled from the trust quorum produces no audit log
                entry. Peers refuse a sled whose root of trust or service
                processor firmware measurements are outside the reference set
                (see SI-7), but the refusal is written only to an internal
                service log.

                Alerts carry no audit, integrity, or attestation events, so
                timely detection depends on customer tooling reading the audit
                log. Oxide Computer Company's public incident response plan
                excludes incidents in customer environments.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
                - href: https://docs.oxide.computer/guides/integrations/opentelemetry
                  text: "Oxide Docs: OpenTelemetry Integration"
                  rel: reference
                - href: https://docs.oxide.computer/guides/alerts/overview
                  text: "Oxide Docs: Alerts"
                  rel: reference
                - href: "#a3cf381f-9d9c-434e-a49d-e38651e5e9ea"
                  text: "RFD 238: Trust Quorum"
                  rel: reference
                - href: https://rfd.shared.oxide.computer/rfd/0733
                  text: "RFD 733: Security Incident Response Plan"
                  rel: reference
              remarks: >-
                The customer is responsible for defining which
                security-relevant changes are covered by this control, for
                collecting the audit log off the rack at an interval short
                enough to meet its detection objectives (and within the 90-day
                retention period), for alerting on the entries it defines as
                unauthorized changes, and for routing those detections into
                its incident response process. Because audit entries do not
                contain the content of a change, the customer may need to
                query the API for current state when investigating. The
                customer is also responsible for authorizing, recording, and
                reviewing every technician port session and for controlling
                physical access to those ports. Customer-side responsibilities
                must be documented in the system SSP.
            - uuid: 6de46aa4-78dd-4fd1-844c-8c14ccce952f
              control-id: si-7.8
              description: >-
                The component does not generate an audit record or alert when
                a firmware integrity check fails. Root of trust verification
                results, service processor measurements, and a peer's refusal
                of a sled whose measurements are outside the reference set
                (see SI-7) are written only to internal service logs.

                The audit log covers authenticated, state-changing requests to
                the external API, and login attempts. Within that scope it
                records the API-driven update operations that change firmware
                and software (update trust root changes, repository upload,
                and target release changes), for both success and failure,
                including authorization denials. The content of a change is
                not recorded (see AU-3), and read-only requests are not
                audited. Offline update and power control through the setup
                and recovery interface at the technician ports, use of the
                support shell, and management network unlock are not audited
                (see AC-17).
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#cc4e75ec-db8d-4d03-9678-14b1ac9cebd9"
                  text: "Oxide Docs: Audit Log"
                  rel: reference
              remarks: >-
                The customer is responsible for collecting the audit log
                through the API (the rack does not push it), monitoring it for
                update operations and authorization denials, exporting records
                to long-term storage before the 90-day retention period ends,
                controlling and recording access to the technician ports, and
                documenting these responsibilities in the system SSP.
            - uuid: ca9ff190-5711-4746-b69a-e5fd81311f63
              control-id: si-7.9
              description: >-
                Verification of the boot process covers only the hardware root
                of trust's own firmware: its signature is verified before it
                runs, and an image that fails is not run. The immutable boot
                ROM that starts this check is itself neither verified nor
                measured. Service processor firmware is measured by the root
                of trust and appraised afterwards by peer sleds; no signature
                on it is verified, and the measurement never prevents it from
                booting. On the host CPU, closed vendor (AMD) firmware runs
                before any Oxide code, the host boot loader does not verify
                the operating system kernel it loads, and no verification or
                measurement of the host boot image or host operating system at
                boot is established for this release. See SI-7.

                A guest instance can request an attestation signed by the root
                of trust of the sled it runs on. It includes a digest of the
                instance's boot disk only when that disk is a read-only
                distributed disk; local, writable, or absent boot disks are
                not measured. The signed measurements cover root of trust and
                service processor firmware only. The instance identity data,
                including the boot disk digest, is asserted by host software
                that is not measured. Verification is performed outside the
                platform.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#520eb256-1563-4637-8ca9-3012c366c30b"
                  text: "phbl: Oxide Pico Host Boot Loader"
                  rel: reference
                - href: "#d997e812-b360-4598-8df7-b892b5133273"
                  text: "Hubris: Oxide service processor firmware"
                  rel: reference
                - href: https://rfd.shared.oxide.computer/rfd/0605
                  text: "RFD 605: VM Instance Identity and Attestation"
                  rel: reference
              remarks: >-
                Requesting, verifying, and appraising instance attestations
                are customer responsibilities. Customers relying on host or
                VM-level boot integrity assurance should assess whether this
                verification and measurement scope is acceptable for their use
                case and document the result in the system SSP.
            - uuid: 3e024482-6c52-4c52-80bd-4ce682cdc167
              control-id: si-7.10
              description: >-
                No BIOS or UEFI firmware runs on the x86 cores. Protection of
                boot firmware differs by processor (see SI-7). Root of trust
                firmware is signature-verified against a trust anchor fixed in
                the device each time the root of trust starts, so an image
                that has been modified, or that is not signed under an
                accepted root, does not run, whichever path wrote it. No
                signature on service processor firmware is verified at update
                or at boot, so it is not protected against modification by a
                party able to write it; a modified image is detectable only
                when a verifier, such as a peer sled, appraises the attested
                measurement. The host boot image, which includes vendor (AMD)
                firmware, is not verified or measured at boot in this release.

                Boot firmware is written through software update. Through the
                API, update is restricted to the fleet admin role, and images
                are checked against customer-installed trust roots at upload
                and by hash afterwards (see SI-2). Offline update at the
                technician ports does not consult those trust roots, requires
                no credential, and is not recorded in the audit log; on that
                path the protections are control of access to the ports and,
                for root of trust images only, signature verification at start
                (see AC-17). Protection against rollback of root of trust or
                service processor firmware to an earlier signed version is not
                established for this release.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: https://github.com/oxidecomputer/bootleby
                  text: "bootleby: Oxide RoT stage0 bootloader"
                  rel: reference
                - href: "#d997e812-b360-4598-8df7-b892b5133273"
                  text: "Hubris: Oxide service processor firmware"
                  rel: reference
                - href: "#520eb256-1563-4637-8ca9-3012c366c30b"
                  text: "phbl: Oxide Pico Host Boot Loader"
                  rel: reference
                - href: "#eeb24ebd-edc5-47ec-8545-4272f16bbfc9"
                  text: "Oxide Docs: System Update"
                  rel: reference
              remarks: >-
                The customer is responsible for restricting the fleet admin
                role, for managing the update trust roots, and for controlling
                physical access to the technician ports and network access to
                any jumpbox cabled to them, which is the only safeguard on the
                offline update path. Customers that define boot firmware
                protection mechanisms for this control should assess whether
                this scope is acceptable and document the result, and these
                customer-side responsibilities, in the system SSP.
            - uuid: 394b04c8-4e03-4bcf-84e1-3bf25ecdfa43
              control-id: si-7.15
              description: >-
                Cryptographic authentication under a persistent Oxide Computer
                Company key applies to root of trust firmware only. That
                firmware is signed under Oxide Computer Company's code-signing
                PKI (see SC-17). The root of trust verifies the signature
                before running an image, and the control plane offers a device
                only images that match its trust anchor (see SI-7).

                No signature on service processor firmware is verified at
                update or at boot, and for host operating system and control
                plane artifacts no signature under a persistent Oxide Computer Company key is
                verified. For updates driven through the API, the repository's
                signatures are verified once, at upload, against trust roots
                the customer has installed, and each artifact is then checked
                by hash before and during installation; an artifact whose hash
                differs is rejected. The repository is signed with a key
                generated during its build and carries its own trust root, so
                the customer's comparison of the bundle checksum with the
                value provided by Oxide Support is the only step that ties a
                bundle to Oxide. Metadata expiry is not enforced. Offline
                update at the technician ports does not consult the trust
                roots and requires no credential (see SI-2 and AC-17). A
                process to sign release builds is identified as future work.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#6514d564-b2c2-47e0-b0c1-3049ca659406"
                  text: Oxide Public Sector Solutions Overview
                  rel: reference
                - href: "#d997e812-b360-4598-8df7-b892b5133273"
                  text: "Hubris: Oxide service processor firmware"
                  rel: reference
                - href: "#eeb24ebd-edc5-47ec-8545-4272f16bbfc9"
                  text: "Oxide Docs: System Update"
                  rel: reference
                - href: https://github.com/oxidecomputer/omicron/blob/rel/v23/docs/releng.adoc
                  text: "Omicron: release engineering documentation"
                  rel: reference
              remarks: >-
                Oxide Computer Company distributes update bundles through a customer-specified
                file transfer. The customer is responsible for validating the
                checksum of each bundle against the value provided by Oxide
                Support before adding the bundle's trust root to the rack, for
                controlling physical and network access to the technician
                ports, for removing trust roots that are no longer needed, and
                for documenting this procedure in the system SSP. See SI-2 for
                the update integrity model.
            - uuid: f1910bad-5a6a-4db0-ac27-efb0f85ce978
              control-id: si-8
              description: >-
                The Oxide Cloud Computer is a rack-scale infrastructure system.
                It does not provide email, messaging, or communication relay
                services, and it has no system entry or exit points through
                which unsolicited messages transit. Spam protection is not
                applicable to this component.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: not-applicable
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
            - uuid: 6f679a02-ee2a-4829-839e-a879f6a38a67
              control-id: si-8.2
              description: >-
                As SI-8 is not applicable to this component, automatic updates
                of spam protection mechanisms are similarly not applicable. The
                Oxide rack has no spam protection mechanisms to update.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: not-applicable
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
            - uuid: 991ff0b6-9aae-407f-b11e-403aea264bfe
              control-id: si-10
              description: >-
                The control plane validates inputs to the external API against
                the schemas in the Oxide OpenAPI specification, which
                documents the acceptable types, formats, and allowable values
                for each operation. Validation is enforced server-side;
                requests that fail are rejected before processing with a
                structured error response. Inputs to guest virtual machine
                instances are outside the scope of the control plane.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              remarks: >-
                Customer obligation: organizations are responsible for
                validating inputs to applications running within guest virtual
                machine instances.
              links:
                - href: "#97705d85-63ac-41b1-b2fc-074dfd2a89c7"
                  text: "Oxide API: Guides Introduction"
                  rel: reference
                - href: "#675b3313-3da6-4529-9be1-8b4ddec3a3c5"
                  text: Oxide Nexus OpenAPI Specification
                  rel: reference
            - uuid: dc20b478-55cc-423a-a71a-5c61dc7b39eb
              control-id: si-10.3
              description: >-
                The control plane behaves predictably when it receives invalid
                input on the external API: requests that fail schema
                validation are rejected before processing, and the control
                plane returns a structured error response with an error code
                and a message, as documented in the Oxide OpenAPI
                specification.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: implemented
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#97705d85-63ac-41b1-b2fc-074dfd2a89c7"
                  text: "Oxide API: Guides Introduction"
                  rel: reference
                - href: "#675b3313-3da6-4529-9be1-8b4ddec3a3c5"
                  text: Oxide Nexus OpenAPI Specification
                  rel: reference
            - uuid: 52da4944-41bc-4d8f-9535-e0c634a223b2
              control-id: si-10.6
              description: >-
                The control plane limits exposure to injection through the way
                it handles external API input. The API accepts structured JSON
                validated against the Oxide OpenAPI specification, and the
                control plane builds its database queries with a typed query
                builder that passes values as bound parameters and does not
                concatenate them into SQL text. Injection prevention within
                guest virtual machine instances is outside the scope of the
                control plane.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              remarks: >-
                Customer obligation: organizations are responsible for injection
                prevention within applications running inside guest virtual
                machine instances.
              links:
                - href: https://github.com/diesel-rs/diesel
                  text:
                    Diesel - A safe, extensible ORM and Query Builder for Rust
                  rel: reference
                - href: "#49fe9ee3-4c38-453d-9922-dd4d4308c4f3"
                  rel: reference
            - uuid: ebf1154e-f351-46a9-b6ff-e0e7b348aeb8
              control-id: si-11
              statements:
                - statement-id: si-11_smt.a
                  uuid: 7b667427-5c98-4360-86bf-6c8b314dd5e6
                  description: >-
                    The control plane generates structured error responses on
                    the external API that include an HTTP status code, a
                    machine-readable error code, and a human-readable message
                    intended to support corrective action. The format is
                    defined in the Oxide OpenAPI specification.
                - statement-id: si-11_smt.b
                  uuid: d0823f94-ed8f-4a52-bfa6-2e3ffa208865
                  description: >-
                    An error response is returned to the client that made the
                    request. For authenticated, state-changing requests to the
                    external API, and login attempts, the HTTP status, error
                    code, and error message of a failed request are also
                    recorded in the audit log entry for that request, which
                    is readable by holders of the fleet viewer role.
              description: >-
                The control plane generates structured error responses on the
                external API containing a status code, an error code, and a
                message. Error responses are returned to the requesting
                client, and for audited requests the error code and message
                are also recorded in the audit log, which is readable by the
                fleet viewer role.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#97705d85-63ac-41b1-b2fc-074dfd2a89c7"
                  text: "Oxide API: Guides Introduction"
                  rel: reference
                - href: "#675b3313-3da6-4529-9be1-8b4ddec3a3c5"
                  text: Oxide Nexus OpenAPI Specification
                  rel: reference
              remarks: >-
                The customer is responsible for reviewing the content of error
                messages against its policy on information exposure, for
                defining who may see them, and for restricting the roles that
                can read the audit log accordingly. Customer-side
                responsibilities must be documented in the system SSP.
            - uuid: 8a451eb9-32da-41cf-a5ed-5da3a51b99d3
              control-id: si-15
              description: >-
                The control plane constrains external API output through typed
                response definitions: the fields a response can contain are
                fixed by its declared type, and the Oxide OpenAPI
                specification is generated from the same definitions. Output
                from applications running within guest virtual machine
                instances is outside the scope of the control plane.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              remarks: >-
                Customer obligation: organizations are responsible for
                validating the output of applications running within guest
                virtual machine instances.
              links:
                - href: "#675b3313-3da6-4529-9be1-8b4ddec3a3c5"
                  text: Oxide Nexus OpenAPI Specification
                  rel: reference
                - href: "#49fe9ee3-4c38-453d-9922-dd4d4308c4f3"
                  rel: reference
            - uuid: 39c84563-48af-46be-b9f1-9ede6e3cded5
              control-id: si-16
              description: >-
                The Oxide Cloud Computer protects memory at the firmware and
                hypervisor layers. In the root of trust and service processor
                firmware, each task, including device drivers, runs
                unprivileged and is confined by memory protection hardware to
                the regions assigned to it at build time; a task cannot
                directly access kernel memory or another task's memory. At the
                hypervisor, hardware virtualization with nested page tables
                confines each VM to its own memory, isolating it from every
                other VM and from the host, and each VM's monitor process runs
                in its own operating system zone.

                The software Oxide Computer Company wrote for the product is predominantly
                Rust. Safe Rust avoids, by construction, memory-safety defect
                classes such as out-of-bounds access and use-after-free. Code
                in `unsafe` blocks and non-Rust components, including the host
                operating system kernel and hypervisor, the control plane
                databases, and vendor firmware, are outside that guarantee, so
                host memory protection also depends on the C kernel. Memory
                protections within guest operating systems are the
                responsibility of the organization.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              remarks: >-
                Customer obligation: organizations are responsible for
                configuring memory protections (such as non-executable memory
                and address space layout randomization) within guest operating
                systems and applications.
              links:
                - href: "#a6344b03-7564-4ae4-b496-49d41164a047"
                  text: "RFD 26: Oxide Architecture"
                  rel: reference
                - href: "#d23924f9-837c-4e0f-84c6-6be26711875c"
                  text: "Oxide Docs: OS, Hypervisor, and Storage Architecture"
                  rel: reference
                - href: "#d997e812-b360-4598-8df7-b892b5133273"
                  rel: reference
                - href: "#5e8dc9cc-f97e-492e-b7d0-33f7e4adf402"
                  rel: reference
                - href: "#49fe9ee3-4c38-453d-9922-dd4d4308c4f3"
                  rel: reference
            - uuid: b8140fe1-b326-4238-b664-41a647623f8c
              control-id: sr-3
              statements:
                - statement-id: sr-3_smt.a
                  uuid: d9dccfc4-6761-427c-8277-f9ed9f222c4b
                  description: >-
                    Oxide Computer Company's public incident response plan
                    covers the software and hardware it distributes to
                    customers and the systems that build, sign, and distribute
                    them. Security issues in Oxide products can be reported to
                    a published security contact, and Oxide Computer Company
                    publishes security advisories. The principal
                    Oxide-authored components are open source, and release
                    build inputs are pinned by version and hash. Not all build
                    inputs are public, and proprietary third-party firmware
                    (AMD CPU firmware and Chelsio T6 NIC firmware) is consumed
                    as vendor binaries.
                - statement-id: sr-3_smt.b
                  uuid: 0e5e5afc-0ca1-49c0-9cbe-afd551dff0f1
                  description: >-
                    The supply chain controls described here are scoped to
                    root of trust firmware and platform identity. For both,
                    root keys certify the separate keys used for routine
                    signing (see SC-17 and SC-12), and operations on the root
                    keys are performed in scripted, recorded key ceremonies
                    using public tooling. Oxide Computer Company states that
                    the root keys are held in a physically protected offline
                    keystore and are used only during ceremonies, that each
                    ceremony is witnessed and its records are retained, and
                    that ceremony records, which are not public, are available
                    to customers and assessors through Oxide support under
                    confidentiality arrangements.

                    These controls do not extend to other software. No
                    signature on service processor firmware is verified at
                    update or at boot, and for host operating system and
                    control plane artifacts no signature under a persistent
                    Oxide Computer Company key is verified. The customer's comparison of the
                    update bundle checksum with the value provided by Oxide
                    Support is the only step that ties a bundle to Oxide (see
                    SI-2). A process to sign release builds is identified as
                    future work.
              description: >-
                Oxide Computer Company's supply chain controls for the Oxide
                Cloud Computer, as described here, are scoped to root of trust
                firmware and platform identity: offline roots, separate keys
                for routine signing, and scripted, recorded key ceremonies.
                The ceremony tooling is public; ceremony records are not. For
                service processor, host operating system, and control plane
                artifacts, no signature under a persistent Oxide Computer Company key is
                verified, and the step that ties an update bundle to Oxide Computer Company is
                the customer's checksum comparison. Not all build inputs are
                public, and proprietary third-party firmware is present.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              remarks: >-
                Oxide Computer Company distributes update bundles through a customer-specified
                file transfer; the customer is responsible for validating the
                checksum of each bundle against the value provided by Oxide
                Support before adding the bundle's trust root to the rack. The
                customer is also responsible for their own acquisition and
                component-authenticity procedures, for the organizational
                supply chain risk management plan in which these processes are
                documented (SR-3c), and for recording these scope limits when
                inheriting this control in the system SSP.
              links:
                - href: "#49fe9ee3-4c38-453d-9922-dd4d4308c4f3"
                  rel: reference
                - href: "#d997e812-b360-4598-8df7-b892b5133273"
                  rel: reference
                - href: "#952a7e36-0e1f-4f7c-bc50-ad3757cd5541"
                  text: Oxide Security Advisories
                  rel: reference
                - href: https://rfd.shared.oxide.computer/rfd/0733
                  text: RFD 733
                  rel: reference
                - href: https://rfd.shared.oxide.computer/rfd/0585
                  text: RFD 585
                  rel: reference
                - href: https://github.com/oxidecomputer/offline-keystore
                  text: "offline-keystore: Oxide key ceremony tooling"
                  rel: reference

