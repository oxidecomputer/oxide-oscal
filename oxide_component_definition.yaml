            - uuid: 2c17579d-10fa-4ca7-b2a7-9fbef0dbded5
              control-id: sc-20
              description: >-
                The control plane runs an authoritative DNS service for a domain
                the customer delegates to the rack. It serves the API and web
                console hostname of each silo. Oxide Computer Company states
                that this service does not implement DNSSEC, so its responses
                carry no origin authentication or integrity artifacts and it
                does not take part in a DNSSEC chain of trust.

                The names it serves are endpoints reached only over HTTPS with a
                customer-supplied certificate, so a client that validates the
                certificate against the expected hostname authenticates the
                endpoint it reaches.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
