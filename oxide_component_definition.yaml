                  text: "RFD 238: Trust Quorum"
                  rel: reference
              remarks: >-
                The customer is responsible for maintaining backups of the TLS
                private keys and SAML identity provider signing credentials used
                with the Oxide Cloud Computer, for recovery procedures if those
                keys are lost or compromised, and for replacing certificates
                before they expire. Because data encrypted under the rack
                secret, including the database that holds the distributed-disk
                keys, is lost if fewer than K shares survive, the customer is
                responsible for backing up, outside the rack, any data whose
                loss it cannot accept. Availability of any key the customer uses
                to encrypt local disks is the customer's responsibility.
            - uuid: 02b3282b-da2f-4542-be2b-7fdaa935f086
              control-id: sc-13
              description: >-
                The Oxide Cloud Computer uses cryptography for the following
                purposes.

                API and web console transport: TLS 1.3 and TLS 1.2, with
                customer-supplied X.509
                certificates. Technician port sessions: SSH; the support shell
                accepts public key authentication only, with keys held on
                hardware tokens, and the setup and recovery interface requires
                no credential.

                Distributed-disk encryption: AES-256-GCM-SIV, applied to each
                block, with a 256-bit key.

                Control plane storage encryption: AES-256-GCM, with one 256-bit
                key per storage drive derived from the rack secret using
                HKDF-SHA3-256.

                Trust quorum: Shamir secret sharing of the rack secret, with
                SHA3-256 digests to check shares. Traffic between sleds uses
                mutually authenticated TLS 1.3 (X25519, ChaCha20-Poly1305,
                Ed25519 certificates).

                Sled identity and attestation: Ed25519 keys held in each sled's
                hardware root of trust, certified under an ECDSA P-384 root
                operated by Oxide Computer Company. An attestation is an Ed25519
                signature over a SHA3-256 digest.

                Firmware: the hardware root of trust verifies its own bootloader
                and firmware with RSA-4096 PKCS#1 v1.5 signatures over a SHA-256
                digest. Service processor firmware is measured as a SHA3-256
                digest; no signature on it is verified at update or boot.

                Software update: Ed25519 signatures on update repository
                metadata, verified at upload, and SHA-256 hashes of the
                artifacts.

                Other uses: Argon2id to hash passwords of local-only silo
                accounts; signatures on SAML assertions, which must use an
                allow-listed algorithm; an HMAC on webhook alert payloads.

                Not protected by cryptography: traffic between control plane
                services and to the control plane database, guest network
                traffic between sleds, local disks, and the sleds' boot drives
                (see SC-8 and SC-28).

                No public source establishes FIPS 140 validation of any
                cryptographic module used by the Oxide Cloud Computer, or
                operation of any component in a FIPS-approved mode, and this
                narrative asserts neither; see IA-7.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
