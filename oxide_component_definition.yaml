            - uuid: 1bb1eab7-24ba-4c02-89cd-ba5e0fe8fafc
              control-id: si-4.14
              description: >-
                Oxide Computer Company states that the rack has no wireless
                network interfaces and that all network connectivity is wired.
                Wireless intrusion detection is not applicable to this
