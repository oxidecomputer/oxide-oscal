              remarks: >-
                Security and privacy attribute association for information
                exchanged between customer applications is the customer's
                responsibility and must be implemented at the application layer
                within guest workloads. SSP authors should document SC-16
                implementation in the context of their applications and data
                handling processes, not in the context of this infrastructure
                component.
