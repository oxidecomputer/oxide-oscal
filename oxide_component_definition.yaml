                  text: "Oxide API: current_user_access_token_delete"
                  rel: reference
                - href: "#641ea787-a624-439c-abd0-687e7c0bcd2b"
                  text: "Oxide API: user_logout"
                  rel: reference
                - href: https://github.com/oxidecomputer/omicron/issues/7816
                  text: "omicron#7816"
                  rel: reference
              remarks: >-
                The customer is responsible for setting a maximum device token
                lifetime where its policy requires tokens to expire, and for
                invalidating the sessions and tokens of departed users in SAML
                silos that use just-in-time user creation.
            - uuid: 4b542962-c138-4fe1-bd38-9b573549a071
              control-id: sc-23.3
              description: >-
                The control plane generates the identifiers for external API
                sessions; clients do not supply their own. A web console session
                token is created at login from 160 bits of random data. Device
                access tokens are also generated by the control plane. A request
                presenting a value the control plane did not issue, or one that
                has expired or been invalidated, is rejected at authentication.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: implemented
              responsible-roles:
