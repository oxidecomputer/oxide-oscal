            - uuid: f40adb97-5f6a-4133-85e3-30eba0569534
              control-id: sc-23
              description: >-
                The external API and web console are served only over HTTPS,
                using the customer-supplied certificate for the requested silo
                hostname; there is no plaintext listener. Each request must
                present a credential issued by the control plane (a console
                session cookie, a device access token, or a SCIM bearer token)
                over that connection. Requests through the technician port API
                proxy use the same certificate, credentials, and authorization.

                Limitations. In SAML silos the control plane requires each
                assertion to be signed but does not track assertion identifiers,
                so an unexpired assertion can be replayed. Control plane
                services, including the control plane database, communicate on
                the underlay network without TLS and without authentication,
                except for key share exchange and bootstrap requests between
                sleds, which are mutually authenticated; the other sessions rely
                on the underlay being separate from customer and guest networks.
                The setup and recovery interface at the technician ports
                requires no credential (see AC-17).
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
                    - 1fd0ef7d-e65f-483c-8ce0-f6d99eb6516e
              links:
                - href: "#1cda6846-b7f7-48e1-a859-34186be19d4b"
                  text: "Oxide API: certificate_create"
                  rel: reference
                - href: https://docs.oxide.computer/api/guides/authentication
                  text: "Oxide API: Authentication Guide"
                  rel: reference
                - href: "#496d895e-fd77-4f15-9020-22a2b19e380c"
                  text: "Oxide Docs: Identity Providers"
                  rel: reference
                - href: https://github.com/oxidecomputer/omicron/issues/7820
                  text: "omicron#7820"
                  rel: reference
              remarks: >-
                The customer is responsible for supplying and renewing the TLS
                certificates for the external endpoints, for configuring clients
                to validate them, and, in SAML silos, for identity provider
                settings that limit assertion lifetime. The customer is also
                responsible for controlling physical access to the technician
                ports and network access to any host cabled to them. These
                responsibilities must be documented in the system SSP.
            - uuid: e42de219-51ab-4a68-bf11-48ef0cd20e49
              control-id: sc-23.1
              description: >-
                The control plane invalidates console sessions and device access
                tokens on the server. Logging out ends the current console
                session, and console sessions also end at fixed idle and
                absolute time limits that have no setting (see AC-12). A user
                can delete one of their device access tokens or invalidate all
                of their sessions and tokens at once; a silo administrator can
                invalidate all sessions and tokens of any user in the silo. In a
                silo provisioned through SCIM, deactivating a user deletes that
                user's sessions and tokens. A request presenting an expired or
                invalidated credential is rejected.

                Limitations. Device access tokens do not expire by default; a
                silo administrator can set a maximum lifetime, which applies
                only to tokens created afterwards. An administrator cannot
                revoke a single console session, only all of a user's sessions
                and tokens together. In SAML silos with just-in-time user
                creation, removing a user at the identity provider does not end
                the user's sessions or tokens; an administrator must invalidate
                them.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
