              control-id: si-4.15
              description: >-
                Oxide Computer Company states that the rack has no wireless
                network interfaces and that all network connectivity is wired,
                so there is no wireless-to-wireline path. This control is not
                applicable to this component.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: not-applicable
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
