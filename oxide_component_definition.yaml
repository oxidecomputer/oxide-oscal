            - uuid: 0aa3e5ef-d5e4-4cf5-922f-2f92a6c8b7cf
              control-id: sc-16
              description: >-
                SC-16 is not applicable to the Oxide Cloud Computer at the
                infrastructure layer. The Oxide control plane does not associate
                security or privacy attribute labels with information exchanged
                through the API, over VPC networks, or in storage operations.
                Security attribute labeling (such as data classification
                markings that travel with information as it moves between
                systems) is an application-layer concern implemented by
                workloads running on the infrastructure, not by the
                infrastructure itself.

                The product's RBAC model assigns roles to principals and enforces
                access control on resources, but does not label the content of
                data exchanged through those resources with security attributes.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: not-applicable
              responsible-roles:
                - role-id: component-provider
                  party-uuids:
