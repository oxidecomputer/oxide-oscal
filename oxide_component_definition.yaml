                policy requires, because the component encrypts neither, and for
                ensuring that cryptographic algorithms and key lengths used by
                applications deployed in guest VMs meet its organization-defined
                requirements.
            - uuid: c1866228-f8b7-4171-a437-e0e5b4f8b1e7
              control-id: sc-15
              description: >-
                SC-15 is not applicable to the Oxide Cloud Computer. The system
                is datacenter infrastructure with no collaborative computing
                devices or applications. It has no microphones, cameras,
                speakers, display outputs, or other collaborative computing
                peripherals. No user is physically present at the device during
                normal operation; the system is managed through the control
                plane API and web console, and through the switch technician
                ports for setup and recovery. The conditions SC-15
                addresses (remote activation of collaborative devices and
                indication of use to physically present users) do not apply to
                this component.
