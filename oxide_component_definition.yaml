                The customer is responsible for: encrypting local disks in the
                guest or application and managing those keys; generating,
                issuing, renewing and replacing the API and console TLS
                certificates and private keys; managing the signing certificate
                lifecycle at its SAML identity provider; protecting or wiping
                removed sleds and drives under its media procedures, because
                wiping the M.2 drives of a removed sled is a procedure, not a
                function of the component; and validating the SHA checksum of
                each update bundle against the value provided by Oxide support
                before adding its trust root. The customer is responsible for
                documenting this key model in the system SSP.
            - uuid: 1581f002-ae7b-4bc9-9b9a-7e2616f35c72
              control-id: sc-12.1
              description: >-
                The Oxide Cloud Computer maintains availability of the keys it
                holds through the trust quorum threshold and replication of the
                control plane database.

                Control plane storage keys are derived from the rack secret,
                which the trust quorum splits into one share per member sled.
                The secret can be reconstructed while a threshold number (K) of
                members' shares is available; K is just over half the member
                count (for example, 9 in a 16-sled rack). If fewer than K shares
                survive, everything encrypted under the rack secret is lost.

                Distributed-disk keys are stored in the control plane database,
                which is replicated across sleds on that encrypted storage.
                Their availability therefore depends on the database and on the
                rack secret.

                If an API or console TLS certificate expires, or its private key
                is lost or compromised, the customer can upload a replacement
                certificate and private key through the API.
