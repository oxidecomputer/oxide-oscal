                scanning guest VMs for unauthorized listening services using
                tools deployed within its workloads.
            - uuid: 75768481-0e83-41d9-a724-3e1e371dc2cf
              control-id: si-4.23
              description: >-
                The Oxide Cloud Computer does not provide a customer-facing
                host-based monitoring mechanism for its sleds, and it does not
                support customer-installed monitoring agents on the host OS.
                The host OS includes DTrace, a tracing framework used for
                debugging and performance analysis. DTrace is a diagnostic
                tool, not an audit or monitoring record: the system does not
                guarantee that a tracing enabling stays active. Oxide Computer
                Company does not deploy monitoring agents in guest virtual
                machine instances.
              props:
                - name: implementation-status
                  ns: https://fedramp.gov/ns/oscal
                  value: partial
