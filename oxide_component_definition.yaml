                  rel: reference
              remarks: >-
                The customer is responsible for setting a maximum device token
                lifetime that meets its organization-defined network disconnect
                requirements, and for deleting or invalidating tokens issued
                before the setting was applied. A customer whose defined
                inactivity period is shorter than 8 hours must enforce it
                outside the component (for example at the identity provider or
                network access layer).
            - uuid: f4b3303a-2fe8-47a8-84df-579b68259dce
              control-id: sc-12
              description: >-
                Keys fall into two groups: keys generated or stored on the rack
                in the customer's facility, and signing keys held by Oxide
                Computer Company.

                Distributed-disk keys. Generated by the control plane and stored
                in its database, not wrapped by any other key; their only
                protection at rest is the encryption of the database's storage.
                They are sent to the services that use them over the unencrypted
                underlay network (see SC-8). A snapshot holds the same key as
                its disk, and a disk created from a snapshot or image embeds the
                source key. There is no key rotation or rekey operation. These
                keys are held by the rack, not by the customer and not by the
                trust quorum.

                Control plane storage keys. Derived on each sled, one per
                storage drive, from the rack secret; not stored persistently.

                Rack secret. Generated on the rack and split by the trust quorum
                into one share per member sled; a threshold number (K) of shares
                reconstructs it. Shares are released only to member sleds, over
                mutually authenticated connections. Each sled stores its shares
                unencrypted on its M.2 boot drives; they are not sealed to the
                hardware root of trust, and a removed sled's drives still hold
                its earlier shares. A party that obtains the M.2 drives of K or
                more members can reconstruct the secret and derive the storage
                keys for any drive of that rack.

                Sled identity keys. Generated in each sled's hardware root of
                trust during manufacturing; the private key never leaves it.

                API and console TLS keys. Generated by the customer outside the
                rack and uploaded. The customer controls issuance and
                replacement, but the rack stores a copy in the control plane
                database.

                Local disks. Not encrypted by the rack; any key is the
                customer's.

                Update metadata key. Generated for each build. Each update
                bundle carries its own trust root, and the rack does not check
                that a root an administrator adds comes from Oxide Computer
                Company (see SI-2). A process to sign release builds is
                identified as future work.

                Keys held by Oxide Computer Company. The keys that sign root of
                trust firmware and certify device identity are held by Oxide
                Computer Company, not on the rack (see SC-17). No signature on
                service processor firmware is verified at update or boot (see
                SI-7). Keys for Oxide support access at the technician ports are
                described in IA-5.
              props:
